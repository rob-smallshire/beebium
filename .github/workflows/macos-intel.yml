# Best-effort Intel (x86_64) validation of the Homebrew formula.
#
# This is deliberately SEPARATE from macos-package.yml / release.yml and never
# gates a release. GitHub's Intel macos-13 runners are scarce and being
# deprecated, so a release-gating Intel leg would stall the draft indefinitely
# (a reusable-workflow job stuck in the runner queue never completes). Here a
# stuck or absent runner only affects this standalone run, never a release.
#
# The release path stays arm64-only (macos-package.yml); the formula is a source
# build, so Intel Macs work for users regardless. This workflow adds the CI
# signal on Intel where a runner is available.
#
# For reliable Intel coverage, register an Intel Mac as a self-hosted runner and
# change `runs-on` below to its label (e.g. [self-hosted, macOS, X64]).
#
# EXPECTED RED (as of grpc 1.83.1): Homebrew ships NO x86_64 macOS bottle for
# grpc -- only arm64 macOS + Linux -- so this from-bottle formula build fails
# with "grpc: no bottle available!" on every Intel macOS runner, regardless of
# OS version. There is no runner move that fixes it, and we deliberately do NOT
# build grpc from source here (slow, and not what a real user's `brew install`
# does). This job is non-gating and never in the release needs-chain, so its red
# does not block releases; Intel users are served by the vcpkg bundle/tarball/
# wheel path instead. Re-enable expectations if Homebrew restores Intel bottles.

name: macOS Intel formula

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 07:00 UTC -- keep the Intel build exercised.
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "packaging/homebrew/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/server/CMakeLists.txt"
      - ".github/workflows/macos-intel.yml"

permissions:
  contents: read

jobs:
  formula:
    name: formula (x86_64, best-effort)
    runs-on: macos-13
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install, test and audit the formula
        run: packaging/homebrew/test-formula.sh
