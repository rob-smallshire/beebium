# Assemble a server release when a version tag is pushed.
#
# The release process is: `uvx bump-my-version bump <part>` (edits every
# embedded version, commits, tags v<version>) then `git push --follow-tags`.
# Pushing the tag fires this workflow, which:
#
#   1. builds the self-contained Linux .deb + .tar.gz (both arches),
#   2. builds, tests and audits the macOS Homebrew formula (both arches),
#   3. builds the self-contained Windows .zip (x64),
#   4. creates a DRAFT GitHub Release with the Linux and Windows artifacts,
#   5. publishes the Python client to PyPI (publish-python.yml) as soon as its
#      own gates pass, in parallel with the server builds -- it needs nothing
#      they produce. Client and servers are cut from the same tag because they
#      share the ref, not because one waits for the other.
#
# The release is left as a DRAFT on purpose: nothing is published until you
# review it and click publish. The macOS server is delivered via the Homebrew
# tap, updated with `packaging/homebrew/sync-tap.sh <version> <tap-checkout>`;
# the Windows server is delivered via the Scoop bucket, whose manifest
# (packaging/scoop/beebium-server.json) is pinned to the released .zip's URL and
# hash. Both tap and bucket are updated after the release is published.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Ensure the Linux build-env dependency image exists before the bundle build
  # reuses it. A no-op when the image for the current tag is already published,
  # so this rarely costs more than a lookup.
  build-env:
    uses: ./.github/workflows/build-env.yml

  linux:
    needs: build-env
    uses: ./.github/workflows/linux-packages.yml

  macos-formula:
    uses: ./.github/workflows/macos-package.yml

  # The self-contained macOS bundles (arm64 + x86_64), for the Release tarballs
  # and the macOS server wheels. Separate from the Homebrew formula job.
  macos-bundle:
    uses: ./.github/workflows/macos-bundle.yml

  windows:
    uses: ./.github/workflows/windows-package.yml

  # Repackage the Linux release bundles into beebium-server platform wheels (no
  # compile: the server bytes are the tarball's). This is the one Python job that
  # genuinely consumes the server builds, so it needs `linux`.
  server-wheels:
    name: build server wheels
    needs: [linux, windows, macos-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          # Pin an exact uv version: setup-uv then skips resolving "latest"
          # against the astral-sh/versions manifest, the fetch of which failed
          # transiently and broke a release run.
          version: "0.12.3"

      - name: Download the bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: _bundles
          merge-multiple: true

      - name: Build the server wheels for every platform
        working-directory: packaging/python-server
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' "${GITHUB_WORKSPACE}/.bumpversion.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          B="${GITHUB_WORKSPACE}/_bundles"
          python build_wheel.py "${B}/beebium-server-${V}-linux-amd64.tar.gz"  manylinux_2_36_x86_64
          python build_wheel.py "${B}/beebium-server-${V}-linux-arm64.tar.gz"  manylinux_2_36_aarch64
          python build_wheel.py "${B}/beebium-server-${V}-macos-arm64.tar.gz"  macosx_11_0_arm64
          python build_wheel.py "${B}/beebium-server-${V}-macos-x86_64.tar.gz" macosx_12_0_x86_64
          python build_wheel.py "${B}/beebium-server-${V}-windows-x64.zip"     win_amd64
          ls -l dist

      # Publish-boundary gate: the exact wheel set, with the right platform tags,
      # each containing all four server binaries -- before the wheels leave this
      # job. A green build does not prove the wheel was assembled correctly.
      - name: Verify the server wheels before upload
        working-directory: packaging/python-server/dist
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' "${GITHUB_WORKSPACE}/.bumpversion.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          expected="$(printf '%s\n' \
            "beebium_server-${V}-py3-none-manylinux_2_36_x86_64.whl" \
            "beebium_server-${V}-py3-none-manylinux_2_36_aarch64.whl" \
            "beebium_server-${V}-py3-none-macosx_11_0_arm64.whl" \
            "beebium_server-${V}-py3-none-macosx_12_0_x86_64.whl" \
            "beebium_server-${V}-py3-none-win_amd64.whl" | sort)"
          actual="$(ls -1 *.whl | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::server wheel set mismatch"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi
          # Each wheel carries all four binaries; the Windows wheel names them
          # with a .exe suffix, so accept either form per variant.
          for whl in *.whl; do
            for variant in model-b model-b-plus model-b-plus-128k model-b-romram; do
              unzip -l "${whl}" | grep -qE "beebium/server/_bundle/bin/beebium-${variant}(\.exe)?\$" \
                || { echo "::error::${whl} is missing beebium-${variant}"; exit 1; }
            done
          done
          echo "Server wheels verified: correct tags and all four binaries."

      - uses: actions/upload-artifact@v7
        with:
          name: server-wheels
          path: packaging/python-server/dist/*.whl
          if-no-files-found: error

  # Install each server wheel on a matching-arch runner in a fresh venv, with the
  # CLIENT wheel built from this same checkout, and prove the client resolves and
  # drives the wheel's server with no environment set.
  verify-server-wheels:
    name: verify server wheel (${{ matrix.arch }})
    needs: server-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            tag: manylinux_2_36_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag: manylinux_2_36_aarch64
          - arch: macos-arm64
            runner: macos-14
            tag: macosx_11_0_arm64
          - arch: macos-x86_64
            runner: macos-15-intel
            tag: macosx_12_0_x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          # Pin an exact uv version: setup-uv then skips resolving "latest"
          # against the astral-sh/versions manifest, the fetch of which failed
          # transiently and broke a release run.
          version: "0.12.3"

      - name: Download the server wheels
        uses: actions/download-artifact@v8
        with:
          name: server-wheels
          path: server-wheels

      - name: Build the client wheel from this checkout
        working-directory: clients/beebium-python-client
        run: |
          rm -rf dist
          uv build --wheel
          ls -l dist

      - name: Install both wheels into a fresh venv and verify
        run: |
          set -euo pipefail
          server_whl="$(ls server-wheels/beebium_server-*-${{ matrix.tag }}.whl)"
          client_whl="$(ls clients/beebium-python-client/dist/beebium-*.whl)"
          echo "server wheel: ${server_whl}"
          echo "client wheel: ${client_whl}"
          uv venv /tmp/verify-venv
          PY=/tmp/verify-venv/bin/python
          uv pip install --python "${PY}" "${server_whl}" "${client_whl}" pytest pytest-timeout

          echo "== import + paths =="
          "${PY}" -c "import beebium.server as s; print(s.__version__, s.executable_filepath())"

          echo "== smoke-installed-tree.sh against the wheel bundle =="
          SP="$("${PY}" -c 'import beebium.server, os; print(os.path.dirname(beebium.server.__file__))')"
          bash scripts/smoke-installed-tree.sh "${SP}/_bundle"

          echo "== resolver must choose the wheel (no env, no checkout build, outside the repo) =="
          mkdir -p /tmp/outside
          ( cd /tmp/outside && env -u BEEBIUM_SERVER "${PY}" -c "
          from beebium.client import ServerInstallation
          i = ServerInstallation.default()
          print('resolved origin:', i.origin)
          assert i.origin == 'beebium-server wheel', i.origin
          " )

          echo "== full smoke: client launches the wheel server with no arguments =="
          env -u BEEBIUM_SERVER "${PY}" -m pytest "${GITHUB_WORKSPACE}/packaging/smoke/test_smoke.py" -q

          echo "== README snippets: the beebium-server README examples run against this wheel =="
          env -u BEEBIUM_SERVER "${PY}" -m pytest "${GITHUB_WORKSPACE}/packaging/python-server/readme/snippets" -q

  # The Windows analogue of the verify matrix. Windows has no bash
  # smoke-installed-tree.sh, so the console-script shim (which runs the exe and
  # loads every plugin DLL) plus the full boot in test_smoke.py stand in for it.
  verify-server-wheels-windows:
    name: verify server wheel (win_amd64)
    needs: server-wheels
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          # Pin an exact uv version: setup-uv then skips resolving "latest"
          # against the astral-sh/versions manifest, the fetch of which failed
          # transiently and broke a release run.
          version: "0.12.3"

      - name: Download the server wheels
        uses: actions/download-artifact@v8
        with:
          name: server-wheels
          path: server-wheels

      - name: Build the client wheel from this checkout
        shell: pwsh
        working-directory: clients/beebium-python-client
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          uv build --wheel
          Get-ChildItem dist

      - name: Install the Windows server wheel + client wheel into a fresh venv
        shell: pwsh
        run: |
          $server = (Get-ChildItem server-wheels\beebium_server-*-win_amd64.whl)[0].FullName
          $client = (Get-ChildItem clients\beebium-python-client\dist\beebium-*.whl)[0].FullName
          Write-Host "server wheel: $server"
          Write-Host "client wheel: $client"
          uv venv "$env:RUNNER_TEMP\vv"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $py = "$env:RUNNER_TEMP\vv\Scripts\python.exe"
          uv pip install --python "$py" "$server" "$client" pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "BEEBIUM_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import, and list extensions via the console-script shim
        shell: pwsh
        run: |
          & "$env:BEEBIUM_PY" -c "import beebium.server as s; print(s.__version__, s.executable_filepath())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\vv\Scripts\beebium-model-b.exe" list-extensions
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Resolver must choose the wheel (no env, outside the repo)
        shell: pwsh
        run: |
          Remove-Item Env:\BEEBIUM_SERVER -ErrorAction SilentlyContinue
          Set-Location $env:RUNNER_TEMP
          & "$env:BEEBIUM_PY" -c "from beebium.client import ServerInstallation; i = ServerInstallation.default(); print('resolved origin:', i.origin); assert i.origin == 'beebium-server wheel', i.origin"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Full smoke -- client launches the wheel server with no arguments
        shell: pwsh
        run: |
          Remove-Item Env:\BEEBIUM_SERVER -ErrorAction SilentlyContinue
          & "$env:BEEBIUM_PY" -m pytest "$env:GITHUB_WORKSPACE\packaging\smoke\test_smoke.py" -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: README snippets run against the installed wheel
        shell: pwsh
        # The console-script CLI snippet skips on Windows (the shim runs the
        # server as a child there); the paths-API snippet runs. list-extensions
        # above already exercises the console script on Windows.
        run: |
          Remove-Item Env:\BEEBIUM_SERVER -ErrorAction SilentlyContinue
          & "$env:BEEBIUM_PY" -m pytest "$env:GITHUB_WORKSPACE\packaging\python-server\readme\snippets" -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Publish the verified server wheels to PyPI. Unlike the client publish, this
  # DOES need the server builds, so it runs only after verification passes.
  publish-server-wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-server-wheels, verify-server-wheels-windows]
    uses: ./.github/workflows/publish-server-wheels.yml
    with:
      repository: pypi
    permissions:
      id-token: write
      contents: read

  pypi:
    # PyPI uploads are permanent, so only a pushed version tag publishes; a
    # manual dispatch of this workflow builds the server packages only.
    #
    # No `needs`: the Python client uses nothing the server bundles produce, so
    # it publishes as soon as its own gates pass rather than waiting ~1h for
    # them. Client and servers are cut from the same tag because they share the
    # ref, not because this job is ordered after the builds.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-python.yml
    with:
      repository: pypi
    permissions:
      id-token: write
      contents: read

  release:
    name: draft GitHub Release
    needs: [linux, macos-formula, macos-bundle, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: _artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -l _artifacts

      # Publish-boundary gate: validate the EXACT set of files about to be
      # attached, before uploading. A green build proves the bundles are good; it
      # does NOT prove the publish path (download -> merge -> upload) shipped the
      # right bytes -- that gap once published stale /opt-rooted tarballs while
      # every smoke job stayed green. If any assertion fails, the job stops here
      # and no draft is created/updated with bad assets.
      - name: Verify the publishable artifacts
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' .bumpversion.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Verifying release assets for version ${V}"
          cd _artifacts

          # 1. Exactly the expected asset set -- no missing, no extras, no dupes.
          expected="$(printf '%s\n' \
            "beebium-server-${V}-linux-amd64.tar.gz" \
            "beebium-server-${V}-linux-arm64.tar.gz" \
            "beebium-server-${V}-macos-arm64.tar.gz" \
            "beebium-server-${V}-macos-x86_64.tar.gz" \
            "beebium-server-${V}-windows-x64.zip" \
            "beebium-server_${V}_amd64.deb" \
            "beebium-server_${V}_arm64.deb" \
            "beebium-server-${V}-1.x86_64.rpm" \
            "beebium-server-${V}-1.aarch64.rpm" | sort)"
          actual="$(ls -1 | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::published asset set mismatch"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

          # 2. Each relocatable .tar.gz is a single top-level directory named for
          #    its os+arch -- NOT /opt, and not more than one entry.
          for osarch in linux-amd64 linux-arm64 macos-arm64 macos-x86_64; do
            t="beebium-server-${V}-${osarch}.tar.gz"
            tops="$(tar -tzf "${t}" | cut -d/ -f1 | sort -u)"
            if [ "${tops}" != "beebium-server-${V}-${osarch}" ]; then
              echo "::error::${t} top-level is '$(echo ${tops})', expected the single dir beebium-server-${V}-${osarch}"
              exit 1
            fi
          done

          # 3. Each .deb's declared Architecture matches its filename.
          for arch in amd64 arm64; do
            d="beebium-server_${V}_${arch}.deb"
            a="$(dpkg-deb -f "${d}" Architecture)"
            [ "${a}" = "${arch}" ] || { echo "::error::${d} Architecture=${a}, expected ${arch}"; exit 1; }
          done

          # 3b. Each .rpm's declared arch matches its filename. RPM names arches
          #     x86_64/aarch64, so query the package metadata rather than trusting
          #     the name (rpm is not installed on the runner by default).
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          for rpm_arch in x86_64 aarch64; do
            r="beebium-server-${V}-1.${rpm_arch}.rpm"
            a="$(rpm -qp --qf '%{ARCH}' "${r}")"
            [ "${a}" = "${rpm_arch}" ] || { echo "::error::${r} arch=${a}, expected ${rpm_arch}"; exit 1; }
          done

          # 4. Actually RUN the shipped amd64 server (this runner is amd64):
          #    self-containment (ldd), plugin discovery, ROM discovery, boot.
          tar -xzf "beebium-server-${V}-linux-amd64.tar.gz"
          bash "${GITHUB_WORKSPACE}/scripts/smoke-installed-tree.sh" \
            "${PWD}/beebium-server-${V}-linux-amd64"

          echo "Publishable artifacts verified: correct set, relocatable tarballs, arch-correct debs and rpms, amd64 server runs."

      - name: Create draft release with Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: _artifacts/*
          body: |
            Headless BBC Micro emulator servers (Model B, B+, B+ 128K, ROM/RAM),
            drivable from the Python/TypeScript clients or directly. Each install
            puts the four servers on `PATH` and bundles the ROMs and extensions;
            list them with `beebium-model-b list-extensions`.

            ### Linux
            Self-contained for `amd64` and `arm64` (no gRPC/protobuf to install).
            - **Debian / Ubuntu / Raspberry Pi OS** -- download the `.deb` for your
              architecture and `sudo apt install ./<file>.deb`.
            - **Fedora / RHEL / openSUSE** -- download the `.rpm` for your
              architecture (`x86_64` / `aarch64`) and `sudo dnf install ./<file>.rpm`.
            - **Other distros** -- download the `.tar.gz`, extract it **anywhere**,
              and add the extracted `beebium-server-*/bin` directory to your
              `PATH` (no root needed).

            ### macOS
            Self-contained for Apple Silicon (`arm64`) and Intel (`x86_64`),
            ad-hoc codesigned so they run without a build toolchain.
            ```
            brew tap rob-smallshire/beebium
            brew install beebium-server
            ```
            Or download the `.tar.gz` for your architecture, extract it
            **anywhere**, and add the extracted `beebium-server-*/bin` directory
            to your `PATH` (no Homebrew needed).

            ### Windows
            ```
            scoop bucket add beebium https://github.com/rob-smallshire/scoop-beebium
            scoop install beebium-server
            ```
            Or download the `.zip` and extract it; self-contained apart from the
            Microsoft Visual C++ Redistributable.

            ---
            The macOS/Windows commands require the Homebrew tap and Scoop bucket to
            be synced to this version. The Python and TypeScript clients ship
            separately (PyPI and npm).
