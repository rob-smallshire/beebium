# Assemble a server release when a version tag is pushed.
#
# The release process is: `uvx bump-my-version bump <part>` (edits every
# embedded version, commits, tags v<version>) then `git push --follow-tags`.
# Pushing the tag fires this workflow, which:
#
#   1. builds the self-contained Linux .deb + .tar.gz (both arches),
#   2. builds, tests and audits the macOS Homebrew formula (both arches),
#   3. builds the self-contained Windows .zip (x64),
#   4. creates a DRAFT GitHub Release with the Linux and Windows artifacts,
#   5. publishes the Python client to PyPI (publish-python.yml) as soon as its
#      own gates pass, in parallel with the server builds -- it needs nothing
#      they produce. Client and servers are cut from the same tag because they
#      share the ref, not because one waits for the other.
#
# The release is left as a DRAFT on purpose: nothing is published until you
# review it and click publish. The macOS server is delivered via the Homebrew
# tap, updated with `packaging/homebrew/sync-tap.sh <version> <tap-checkout>`;
# the Windows server is delivered via the Scoop bucket, whose manifest
# (packaging/scoop/beebium-server.json) is pinned to the released .zip's URL and
# hash. Both tap and bucket are updated after the release is published.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Ensure the Linux build-env dependency image exists before the bundle build
  # reuses it. A no-op when the image for the current tag is already published,
  # so this rarely costs more than a lookup.
  build-env:
    uses: ./.github/workflows/build-env.yml

  linux:
    needs: build-env
    uses: ./.github/workflows/linux-packages.yml

  macos-formula:
    uses: ./.github/workflows/macos-package.yml

  windows:
    uses: ./.github/workflows/windows-package.yml

  pypi:
    # PyPI uploads are permanent, so only a pushed version tag publishes; a
    # manual dispatch of this workflow builds the server packages only.
    #
    # No `needs`: the Python client uses nothing the server bundles produce, so
    # it publishes as soon as its own gates pass rather than waiting ~1h for
    # them. Client and servers are cut from the same tag because they share the
    # ref, not because this job is ordered after the builds.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-python.yml
    with:
      repository: pypi
    permissions:
      id-token: write
      contents: read

  release:
    name: draft GitHub Release
    needs: [linux, macos-formula, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: _artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -l _artifacts

      # Publish-boundary gate: validate the EXACT set of files about to be
      # attached, before uploading. A green build proves the bundles are good; it
      # does NOT prove the publish path (download -> merge -> upload) shipped the
      # right bytes -- that gap once published stale /opt-rooted tarballs while
      # every smoke job stayed green. If any assertion fails, the job stops here
      # and no draft is created/updated with bad assets.
      - name: Verify the publishable artifacts
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' .bumpversion.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Verifying release assets for version ${V}"
          cd _artifacts

          # 1. Exactly the expected asset set -- no missing, no extras, no dupes.
          expected="$(printf '%s\n' \
            "beebium-server-${V}-linux-amd64.tar.gz" \
            "beebium-server-${V}-linux-arm64.tar.gz" \
            "beebium-server-${V}-windows-x64.zip" \
            "beebium-server_${V}_amd64.deb" \
            "beebium-server_${V}_arm64.deb" \
            "beebium-server-${V}-1.x86_64.rpm" \
            "beebium-server-${V}-1.aarch64.rpm" | sort)"
          actual="$(ls -1 | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::published asset set mismatch"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

          # 2. Each Linux .tar.gz is a single relocatable top-level directory
          #    named for its arch -- NOT /opt, and not more than one entry.
          for arch in amd64 arm64; do
            t="beebium-server-${V}-linux-${arch}.tar.gz"
            tops="$(tar -tzf "${t}" | cut -d/ -f1 | sort -u)"
            if [ "${tops}" != "beebium-server-${V}-linux-${arch}" ]; then
              echo "::error::${t} top-level is '$(echo ${tops})', expected the single dir beebium-server-${V}-linux-${arch}"
              exit 1
            fi
          done

          # 3. Each .deb's declared Architecture matches its filename.
          for arch in amd64 arm64; do
            d="beebium-server_${V}_${arch}.deb"
            a="$(dpkg-deb -f "${d}" Architecture)"
            [ "${a}" = "${arch}" ] || { echo "::error::${d} Architecture=${a}, expected ${arch}"; exit 1; }
          done

          # 3b. Each .rpm's declared arch matches its filename. RPM names arches
          #     x86_64/aarch64, so query the package metadata rather than trusting
          #     the name (rpm is not installed on the runner by default).
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          for rpm_arch in x86_64 aarch64; do
            r="beebium-server-${V}-1.${rpm_arch}.rpm"
            a="$(rpm -qp --qf '%{ARCH}' "${r}")"
            [ "${a}" = "${rpm_arch}" ] || { echo "::error::${r} arch=${a}, expected ${rpm_arch}"; exit 1; }
          done

          # 4. Actually RUN the shipped amd64 server (this runner is amd64):
          #    self-containment (ldd), plugin discovery, ROM discovery, boot.
          tar -xzf "beebium-server-${V}-linux-amd64.tar.gz"
          bash "${GITHUB_WORKSPACE}/scripts/smoke-installed-tree.sh" \
            "${PWD}/beebium-server-${V}-linux-amd64"

          echo "Publishable artifacts verified: correct set, relocatable tarballs, arch-correct debs and rpms, amd64 server runs."

      - name: Create draft release with Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: _artifacts/*
          body: |
            Headless BBC Micro emulator servers (Model B, B+, B+ 128K, ROM/RAM),
            drivable from the Python/TypeScript clients or directly. Each install
            puts the four servers on `PATH` and bundles the ROMs and extensions;
            list them with `beebium-model-b list-extensions`.

            ### Linux
            Self-contained for `amd64` and `arm64` (no gRPC/protobuf to install).
            - **Debian / Ubuntu / Raspberry Pi OS** -- download the `.deb` for your
              architecture and `sudo apt install ./<file>.deb`.
            - **Fedora / RHEL / openSUSE** -- download the `.rpm` for your
              architecture (`x86_64` / `aarch64`) and `sudo dnf install ./<file>.rpm`.
            - **Other distros** -- download the `.tar.gz`, extract it **anywhere**,
              and add the extracted `beebium-server-*/bin` directory to your
              `PATH` (no root needed).

            ### macOS
            ```
            brew tap rob-smallshire/beebium
            brew install beebium-server
            ```

            ### Windows
            ```
            scoop bucket add beebium https://github.com/rob-smallshire/scoop-beebium
            scoop install beebium-server
            ```
            Or download the `.zip` and extract it; self-contained apart from the
            Microsoft Visual C++ Redistributable.

            ---
            The macOS/Windows commands require the Homebrew tap and Scoop bucket to
            be synced to this version. The Python and TypeScript clients ship
            separately (PyPI and npm).
