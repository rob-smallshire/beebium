# Build the macOS GUI app with the static server bundle embedded, and package it
# as a per-architecture drag-to-Applications DMG.
#
# The app embeds the SAME static server tree shipped in the release tarball (see
# docs/macos-app-packaging.md): this workflow acquires that tree, builds the app
# with the "Embed Static Server Bundle" phase pointed at it, asserts the payload
# is self-contained and signed, assembles a DMG, and smoke-tests the DMG.
#
# Signing (Phase D3): when the Developer ID cert secrets are present, the app and
# DMG are signed with Hardened Runtime, notarized and stapled, and Gatekeeper
# accepts them on any Mac (proven by the quarantine smoke). When the secrets are
# ABSENT -- forks, PRs -- the workflow falls back to the ad-hoc path with a
# ::notice, so it still builds and smokes (Gatekeeper would refuse the ad-hoc DMG
# on another Mac). The signing identity is DISCOVERED from the imported .p12
# (never hardcoded: the cert's subject carries an enrolment OCR typo and will be
# reissued). See docs/discussion/macos-gui-distribution.md.
#
# Two ways in:
#   - workflow_call: release.yml passes the release version; the static tree is
#     the bundle-macos-<arch> ARTIFACT built by the macos-bundle job in the same
#     run.
#   - workflow_dispatch: given a bare `version` of an already-PUBLISHED release,
#     the static tree is that release's macos-<arch> tarball asset. Use this to
#     exercise the app+DMG path without cutting a release.

name: macOS app

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (the tag, with or without a leading v)."
        required: true
        type: string
      require_signing:
        description: "Fail (never fall back to ad-hoc) if the Developer ID cert secrets are absent. release.yml passes true so a release can never ship an unsigned, undistributable DMG."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Published release version to build the app+DMG against, bare (e.g. 0.1.9). The GitHub Release must be published."
        required: true
        type: string

permissions:
  contents: read

jobs:
  app:
    name: app + DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Mirror macos-bundle.yml's runners: arm64 on macos-14, x86_64 on the
        # native Intel runner. The server floors (11.0 / 12.0) are already baked
        # into the prebuilt bundle; the app carries its own deployment target.
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    steps:
      # Check out the ref this workflow runs on -- NOT v<version>. For a
      # workflow_call from release.yml that is the release tag (which carries the
      # app source being released). For a manual dispatch it is the branch the
      # dispatch ran on (e.g. master), so the app is built from current source
      # while the server bundle comes from an existing release's tarball -- the
      # point of the dispatch is to prove the current app+DMG path without
      # cutting a release. (Checking out v<version> would build stale app source:
      # a release tagged before this workflow landed has the old embed phase.)
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the bare version
        id: v
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      # Acquire the static server bundle tarball. In a release run it is the
      # same-run artifact; on manual dispatch it is the published release asset.
      - name: Download the bundle artifact (release run)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: _bundle

      - name: Download the bundle from the published release (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            --pattern "beebium-server-${VERSION}-macos-${{ matrix.arch }}.tar.gz" \
            --dir _bundle

      - name: Unpack the static server tree
        run: |
          set -euo pipefail
          tarball="_bundle/beebium-server-${VERSION}-macos-${{ matrix.arch }}.tar.gz"
          tar -xzf "${tarball}" -C _bundle
          tree="${GITHUB_WORKSPACE}/_bundle/beebium-server-${VERSION}-macos-${{ matrix.arch }}"
          test -f "${tree}/bin/beebium-model-b" || { echo "::error::static tree missing bin/beebium-model-b"; exit 1; }
          echo "SERVERS_TREE=${tree}" >> "${GITHUB_ENV}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      # Build Release with the embed phase pointed at the static tree, ad-hoc
      # signed (CODE_SIGN_IDENTITY=-) so codesign --verify has something to check.
      # The embed phase itself asserts no absolute-path leaks and that every
      # embedded Mach-O is signed.
      - name: Build the app (Release, ad-hoc signed)
        working-directory: clients/macos/Beebium
        env:
          BEEBIUM_SERVERS_BUILD_DIR: ${{ env.SERVERS_TREE }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES

      - name: Assert self-containment and signature
        run: |
          set -euo pipefail
          app="clients/macos/Beebium/build/Build/Products/Release/Beebium.app"
          srv="${app}/Contents/Resources/servers"
          test -d "${srv}/bin" && test -d "${srv}/lib" && test -d "${srv}/share/beebium" \
            || { echo "::error::embedded payload is not the bin/lib/share tree"; exit 1; }
          leaks=0
          while IFS= read -r f; do
            file "$f" | grep -q Mach-O || continue
            if otool -L "$f" | tail -n +2 | grep -Eq '/opt/homebrew|/Users/|/usr/local'; then
              echo "::error::absolute-path leak: $f"
              otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/Users/|/usr/local'
              leaks=1
            fi
          done < <(find "${srv}/bin" "${srv}/lib" -type f)
          [ "$leaks" = 0 ] || { echo "::error::embedded payload leaks absolute paths"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${app}"
          echo "APP_PATH=${GITHUB_WORKSPACE}/${app}" >> "${GITHUB_ENV}"

      # Signing is enabled only when the Developer ID cert secret is present.
      # Read it into a plain env var here so later `if:` conditions can gate on
      # env.HAS_SIGNING (secrets are awkward in step-level if expressions).
      - name: Detect signing secrets
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          if [ -n "${CERT}" ]; then
            echo "HAS_SIGNING=true" >> "${GITHUB_ENV}"
            echo "Developer ID signing + notarization ENABLED"
          elif [ "${REQUIRE_SIGNING}" = "true" ]; then
            # Hard gate for release context: the fork-safe ad-hoc fallback must
            # NEVER silently ship in a release. An unsigned DMG is undistributable
            # (Gatekeeper refuses it), so refuse to build one when signing is required.
            echo "::error::require_signing is set but no Developer ID cert secret is present. Refusing to build an ad-hoc (undistributable) app. Check that the caller passes 'secrets: inherit' and that the cert secrets exist."
            exit 1
          else
            echo "HAS_SIGNING=false" >> "${GITHUB_ENV}"
            echo "::notice::no Developer ID cert secret -- building AD-HOC. This build is NOT distributable (Gatekeeper will refuse the DMG on another Mac); it is for fork/PR CI only, never a release."
          fi

      # Ephemeral keychain: created with a random password, added to the search
      # list, and deleted in the always-runs cleanup step. The Developer ID G2
      # intermediate is added so the leaf chains to a trusted root (its absence is
      # the classic "certificate is not trusted" codesign failure); NO trust
      # settings are changed. The signing identity is DISCOVERED from the imported
      # cert -- never hardcoded.
      - name: Set up Developer ID signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/beebium-signing.keychain-db"
          kc_pw="$(openssl rand -base64 24)"
          security create-keychain -p "${kc_pw}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${kc_pw}" "${keychain}"
          # Add my keychain to the front of the user search list (keep the rest).
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | sed 's/"//g')

          # Developer ID G2 intermediate (no trust settings -- just chain completion).
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          security add-certificates -k "${keychain}" "${RUNNER_TEMP}/DeveloperIDG2CA.cer" || \
            security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}" || true

          # Import the signing cert + key; let codesign use the key without a prompt.
          printf '%s' "${CERT_P12_B64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${CERT_PW}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${kc_pw}" "${keychain}" >/dev/null

          # Discover the sole Developer ID Application identity (never hardcode the name).
          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          [ -n "${identity}" ] || { echo "::error::no Developer ID Application identity in the imported cert"; exit 1; }
          echo "Discovered signing identity: ${identity}"

          # App Store Connect API key for notarytool (one file, used for app + DMG).
          printf '%s' "${ASC_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/asc.p8"

          echo "SIGN_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          echo "SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "ASC_KEY_PATH=${RUNNER_TEMP}/asc.p8" >> "${GITHUB_ENV}"
          echo "ASC_KEY_ID=${ASC_KEY_ID}" >> "${GITHUB_ENV}"
          echo "ASC_ISSUER=${ASC_ISSUER}" >> "${GITHUB_ENV}"
          rm -f "${RUNNER_TEMP}/cert.p12"

      # Sign leaf-first with the Hardened Runtime: every dylib and plugin in the
      # embedded payload, then every server executable, then the app itself. All
      # nested code carries the same Team ID, so library validation is satisfied
      # without weakening entitlements (none are added unless notarization demands).
      - name: Sign the app (Developer ID, Hardened Runtime, leaf-first)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          app="${APP_PATH}"
          srv="${app}/Contents/Resources/servers"
          sign() {
            codesign --force --options runtime --timestamp \
              --keychain "${SIGN_KEYCHAIN}" --sign "${SIGN_IDENTITY}" "$@"
          }
          # 1. leaves: ABI dylibs (lib/) and dlopened plugins (bin/extensions/)
          while IFS= read -r f; do
            file "$f" | grep -q "Mach-O" && sign "$f"
          done < <(find "${srv}/lib" "${srv}/bin/extensions" -type f)
          # 2. server executables
          for exe in "${srv}"/bin/beebium-*; do
            [ -f "${exe}" ] && sign "${exe}"
          done
          # 3. the app last (seals everything nested)
          sign "${app}"
          echo "== verify the signed app =="
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dvv "${app}" 2>&1 | grep -E 'Authority=Developer ID|flags=.*runtime' || true

      # Notarize the APP first (ditto zip -> notarytool submit --wait), then staple
      # its ticket so it validates offline. On failure, surface the notary log
      # rather than guessing.
      - name: Notarize and staple the app
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          zip="${RUNNER_TEMP}/Beebium-app.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${zip}"

          # notarytool submit --wait occasionally loses its connection to Apple
          # mid-poll (a transient NSURLError -1005), so bound each attempt with
          # --timeout and retry. A terminal Invalid/Rejected is a real failure:
          # print the notary log and stop. JSON is parsed only when present, so a
          # non-JSON network-error body is treated as retryable, not a crash.
          id=""; status=""
          for attempt in 1 2 3; do
            echo "== notarize app (attempt ${attempt}/3) =="
            set +e
            out="$(xcrun notarytool submit "${zip}" \
              --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER}" \
              --wait --timeout 25m --output-format json 2>&1)"
            set -e
            id=""; status=""
            case "${out}" in
              *'"id"'*)
                id="$(printf '%s' "${out}" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')"
                status="$(printf '%s' "${out}" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')" ;;
            esac
            echo "attempt ${attempt}: id=${id} status=${status:-<none>}"
            [ "${status}" = "Accepted" ] && break
            case "${status}" in
              Invalid|Rejected)
                echo "::error::app notarization ${status} (id ${id})"
                [ -n "${id}" ] && xcrun notarytool log "${id}" --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER}" || true
                exit 1 ;;
              *)
                echo "::warning::transient notarization result on attempt ${attempt}; output tail:"
                printf '%s\n' "${out}" | tail -5
                sleep 30 ;;
            esac
          done
          [ "${status}" = "Accepted" ] || { echo "::error::app notarization did not reach Accepted after retries (last id ${id}, status ${status:-<none>})"; exit 1; }
          echo "APP_NOTARIZE_ID=${id}" >> "${GITHUB_ENV}"
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      # dmgbuild (run by make-dmg.sh via uvx) needs uv on the runner.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.12.3"

      - name: Assemble the DMG
        run: |
          set -euo pipefail
          # One script for the local preview loop and CI: dmgbuild against the
          # reviewed settings.py and the committed background, no Finder scripting.
          packaging/macos-dmg/make-dmg.sh \
            "${APP_PATH}" "${VERSION}" "${{ matrix.arch }}" \
            packaging/macos-dmg/background.tiff
          dmg="${GITHUB_WORKSPACE}/Beebium-${VERSION}-macos-${{ matrix.arch }}.dmg"
          test -f "${dmg}" || { echo "::error::DMG not produced at ${dmg}"; exit 1; }
          echo "DMG_PATH=${dmg}" >> "${GITHUB_ENV}"
          ls -lh "${dmg}"

      # Sign the DMG with the same identity (the app inside is already signed +
      # notarized + stapled), then notarize and staple the DMG itself.
      - name: Sign, notarize and staple the DMG
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --keychain "${SIGN_KEYCHAIN}" --sign "${SIGN_IDENTITY}" "${DMG_PATH}"
          codesign --verify --strict --verbose=2 "${DMG_PATH}"

          # Same bounded-retry notarization as the app (transient -1005 tolerant).
          id=""; status=""
          for attempt in 1 2 3; do
            echo "== notarize DMG (attempt ${attempt}/3) =="
            set +e
            out="$(xcrun notarytool submit "${DMG_PATH}" \
              --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER}" \
              --wait --timeout 25m --output-format json 2>&1)"
            set -e
            id=""; status=""
            case "${out}" in
              *'"id"'*)
                id="$(printf '%s' "${out}" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')"
                status="$(printf '%s' "${out}" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))')" ;;
            esac
            echo "attempt ${attempt}: id=${id} status=${status:-<none>}"
            [ "${status}" = "Accepted" ] && break
            case "${status}" in
              Invalid|Rejected)
                echo "::error::DMG notarization ${status} (id ${id})"
                [ -n "${id}" ] && xcrun notarytool log "${id}" --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER}" || true
                exit 1 ;;
              *)
                echo "::warning::transient notarization result on attempt ${attempt}; output tail:"
                printf '%s\n' "${out}" | tail -5
                sleep 30 ;;
            esac
          done
          [ "${status}" = "Accepted" ] || { echo "::error::DMG notarization did not reach Accepted after retries (last id ${id}, status ${status:-<none>})"; exit 1; }
          echo "DMG_NOTARIZE_ID=${id}" >> "${GITHUB_ENV}"
          xcrun stapler staple "${DMG_PATH}"

      # Gatekeeper acceptance gates: the app runs, the DMG opens, and both carry a
      # stapled ticket (validate offline).
      - name: Verify Gatekeeper acceptance and stapling
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          echo "== spctl app (exec) =="
          spctl -a -t exec -vv "${APP_PATH}"
          echo "== spctl DMG (open, primary signature) =="
          spctl -a -t open --context context:primary-signature -vv "${DMG_PATH}"
          echo "== stapler validate =="
          xcrun stapler validate "${APP_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      # Mount the DMG, copy the app out, and prove it is intact and runnable:
      # signature verifies, and one embedded server boots (ROM discovery via the
      # share fallback + gRPC bring-up). A full GUI launch is best-effort: a
      # hosted runner may lack a usable window-server/Metal session, so a failure
      # to bring the UI up is reported as a note, not a hard failure.
      - name: Smoke the DMG
        run: |
          set -euo pipefail
          mnt="$(mktemp -d)"
          hdiutil attach "${DMG_PATH}" -mountpoint "${mnt}" -nobrowse -readonly
          out="$(mktemp -d)"
          cp -R "${mnt}/Beebium.app" "${out}/Beebium.app"
          hdiutil detach "${mnt}"
          app="${out}/Beebium.app"
          srv="${app}/Contents/Resources/servers"

          echo "== codesign --verify --deep --strict (copied out of the DMG) =="
          codesign --verify --deep --strict "${app}"

          if [ "${HAS_SIGNING:-false}" = "true" ]; then
            echo "== quarantine experience: Gatekeeper must accept a quarantined copy =="
            # Stamp the com.apple.quarantine attribute the way a download would, then
            # confirm Gatekeeper still accepts the app -- the real first-launch proof
            # for a notarized+stapled bundle.
            xattr -w com.apple.quarantine "0081;00000000;Beebium;$(uuidgen)" "${app}"
            spctl -a -t exec -vv "${app}"
            echo "quarantined app accepted by Gatekeeper (notarized + stapled)"
          fi

          echo "== boot one embedded server (ROM share fallback + gRPC) =="
          boot_log="$(mktemp)"
          "${srv}/bin/beebium-model-b" start \
            --mos acorn-mos_1_20.rom \
            --sideways slot=15:type=rom:image=bbc-basic_2.rom \
            --port 0 >"${boot_log}" 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do
            grep -q "Listening on port" "${boot_log}" && break
            kill -0 "${pid}" 2>/dev/null || break
            sleep 0.5
          done
          kill "${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          grep -q "Listening on port" "${boot_log}" \
            || { echo "::error::embedded server did not reach 'Listening on port'"; cat "${boot_log}"; exit 1; }
          grep "Listening on port" "${boot_log}"

          echo "== best-effort GUI app launch =="
          app_log="$(mktemp)"
          "${app}/Contents/MacOS/Beebium" >"${app_log}" 2>&1 &
          apid=$!
          started=""
          for _ in $(seq 1 20); do
            grep -q "system preset file" "${app_log}" 2>/dev/null && started=1 && break
            kill -0 "${apid}" 2>/dev/null || break
            sleep 1
          done
          kill "${apid}" 2>/dev/null || true
          wait "${apid}" 2>/dev/null || true
          if [ -n "${started}" ]; then
            echo "app process launched and ran preset discovery from the bundle"
            grep -E "system preset|Discovered:" "${app_log}" | head -12 || true
          else
            echo "::notice::headless GUI launch did not confirm preset discovery (a hosted runner may lack a window-server/Metal session); codesign + embedded-server boot passed, which is the D2 bar."
            tail -20 "${app_log}" || true
          fi

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: Beebium-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      # Always remove the ephemeral keychain and the decoded API key, even on
      # failure, so no signing material lingers on the runner.
      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ] && [ -f "${SIGN_KEYCHAIN}" ]; then
            security delete-keychain "${SIGN_KEYCHAIN}" || true
          fi
          rm -f "${ASC_KEY_PATH:-}" "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/DeveloperIDG2CA.cer" "${RUNNER_TEMP}/Beebium-app.zip" || true
