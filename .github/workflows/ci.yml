  typescript-client:

    name: TypeScript Client Unit Tests
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        working-directory: clients/beebium-typescript-client
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/beebium-typescript-client
        run: npm run generate-protos

      - name: Type-check
        working-directory: clients/beebium-typescript-client
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: clients/beebium-typescript-client
        run: npm run test:unit

      # Enumerates test cases without running any, covering the unit and
      # integration files alike (the integration cases run in a sibling job).
      #
      # `vitest list` omits skipped tests, so a case gated behind .skipIf() is
      # counted where it runs and not where it does not: this reports 631 under
      # CI=true against 632 without it, the difference being one it.skipIf(isCI)
      # case. The C++ and Python counts do include their skipped tests, so the
      # total is "cases that exist, less those TypeScript skips here". Left as
      # is: the discrepancy is one test, and vitest offers no list-skipped knob.
      #
      # A bare `vitest list` is deliberate: passing --exclude replaces vitest's
      # default exclude set rather than extending it, which lets discovery walk
      # outside the client directory and silently inflate the count.
      - name: Count tests
        working-directory: clients/beebium-typescript-client
        run: |
          npx vitest list --json > list.json
          python3 -c "
          import json
          tests = json.load(open('list.json'))
          if not tests:
              raise SystemExit('vitest collected no tests')
          open('typescript.count', 'w').write(str(len(tests)))
          print(f'typescript: {len(tests)}')
          "

      - name: Upload test count
        uses: actions/upload-artifact@v7
        with:
          name: test-count-typescript
          path: clients/beebium-typescript-client/typescript.count
          retention-days: 1

