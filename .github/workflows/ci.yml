  python-client:

    name: Python Client Unit Tests
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Check generated proto stubs are in sync with their sources
        working-directory: clients/beebium-python-client
        # Regenerates with the locked toolchain and fails if the committed _proto
        # tree changes -- catches stubs drifting from the .proto sources.
        run: bash scripts/check_proto_regen.sh

      - name: Build wheel and run packaging + unit tests against it
        working-directory: clients/beebium-python-client
        # Load-bearing packaging gate: build the wheel, install it into a fresh
        # venv, and run the suite against the installed artifact (not src/) so
        # missing package data, an unshipped py.typed marker or an unregistered
        # entry point fail here. --durations=0 lists every test's wall-clock
        # time (slowest first); --timeout=600 fails a hung test after 10 min
        # rather than stalling the job.
        run: bash scripts/test-wheel.sh tests_packaging/ tests/ -v --durations=0 --timeout=600

      - name: Packaging smoke test still imports the client
        working-directory: clients/beebium-python-client
        # The release smoke test (packaging/smoke/test_smoke.py) drives an
        # installed server and so runs only on tags/manual -- a stale import
        # there rots silently, as a flat `from beebium import Beebium` (broken by
        # the namespace split) did until it failed a release. Collect it against
        # the built wheel every push: this proves the import path and the
        # bbc-fixture plugin resolve, without needing a server.
        run: bash scripts/test-wheel.sh ../../packaging/smoke/test_smoke.py --collect-only -q

      # One line per collected test ("path::test_name"), so counting the lines
      # carrying "::" is independent of pytest's summary wording. Parametrised
      # cases are collected individually and so count individually.
      - name: Count tests
        working-directory: clients/beebium-python-client
        run: |
          uv run python -m pytest tests/ --collect-only -q \
            | grep -cE '::' > python.count
          test -s python.count && [ "$(cat python.count)" -gt 0 ] || { echo "pytest collected no tests"; exit 1; }
          echo "python: $(cat python.count)"

      - name: Upload test count
        uses: actions/upload-artifact@v7
        with:
          name: test-count-python
          path: clients/beebium-python-client/python.count
          retention-days: 1

  python-integration-linux:
    name: Python Client Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          # libgrpc++-dev: the server's gRPC runtime. The rest let the server's
          # Avahi advertiser actually publish, so the machine-advertisement test
          # exercises the advertise path instead of skipping: libavahi-client3
          # is the runtime the server dlopens ("libavahi-client.so.3"), and
          # avahi-daemon/avahi-utils/dbus provide the running mDNS daemon.
          sudo apt-get install -y libgrpc++-dev libavahi-client3 avahi-daemon avahi-utils dbus

      # Extract at 'build/' so the artifact's src/server/ and lib/
      # entries land in the same relative layout the server's build-time
      # RPATH expects (see build/lib/libbeebium_extension_api.so).
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: beebium-server-linux
          path: build

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Start Avahi daemon (mDNS advertiser for the machine-name test)
        # The server's advertiser only reports itself active once it reaches a
        # running avahi-daemon and commits its entry group, so without a daemon
        # the machine-advertisement test skips ("advertiser never became
        # active"). Start it the same way the server-test job does: prefer the
        # init-managed services, else launch dbus and avahi-daemon directly.
        # A failure here is not fatal -- the test then skips with that reason
        # rather than sinking the job -- but the daemon should normally come up.
        run: |
          sudo systemctl start dbus 2>/dev/null || sudo service dbus start 2>/dev/null || true
          sudo systemctl start avahi-daemon 2>/dev/null || sudo service avahi-daemon start 2>/dev/null || true
          if ! avahi-browse -t _workstation._tcp >/dev/null 2>&1; then
            sudo mkdir -p /run/dbus
            sudo dbus-daemon --system --fork 2>/dev/null || true
            sudo avahi-daemon --daemonize --no-drop-root 2>/dev/null \
              || sudo avahi-daemon --daemonize --no-drop-root --no-rlimits 2>/dev/null || true
          fi
          for attempt in $(seq 1 10); do
            if avahi-browse -t _beebium._tcp >/dev/null 2>&1; then
              echo "avahi-daemon ready"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::avahi-daemon did not become ready; the machine-advertisement test will skip"

      - name: Run integration tests
        working-directory: clients/beebium-python-client
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        # Runs against the BUILT WHEEL installed into a fresh venv, not the
        # source tree, so packaging faults (missing data files, entry points)
        # fail here too. --durations=0 lists every test's wall-clock time
        # (slowest first); --timeout=600 fails a hung test after 10 min
        # rather than stalling the job.
        run: bash scripts/test-wheel.sh tests/ -v --durations=0 --timeout=600

