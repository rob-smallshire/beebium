        # root-caused rather than silently masked by the retry.
        # Per-test durations are printed inline (Test #N ... Passed X sec).
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 --repeat until-pass:2 2>&1 | tee ctest.log
          if grep -qE '\*\*\*(Failed|Timeout|Exception)' ctest.log; then
            echo "::warning::A test failed on its first attempt and passed on rerun (flaky). See the ctest output above and root-cause it; do not rely on the retry."
          fi

      - name: Upload server binaries and presets
        # Preserve the built binaries even if a step failed, so a re-run of a
        # dependent job can reuse them instead of forcing a full rebuild.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beebium-server-macos-x86_64
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-model-b-plus
            build/src/server/beebium-model-b-romram
            build/src/server/presets/
            build/src/server/extensions/
            build/lib/libbeebium_extension_api.dylib
            build/lib/libbeebium_extension_ui_proto.dylib
          retention-days: 7

  server-linux:
    name: Build and Test Server (Linux)
    runs-on: ubuntu-latest
    needs: preflight

    env:
      # Per-platform build parallelism (see the macOS arm64 job). The hosted
      # ubuntu-latest runner has plenty of cores but a modest RAM ceiling for a
      # gRPC/protobuf C++ build, so cap at 2 concurrent compiles.
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libavahi-client-dev: build the Avahi advertiser (BEEBIUM_HAS_AVAHI).
          # avahi-daemon/avahi-utils/dbus: run a real mDNS daemon so the Linux
          # advertiser test exercises the advertise path rather than skipping.
          sudo apt-get install -y cmake pkg-config libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc uuid-dev \
            libavahi-client-dev avahi-daemon avahi-utils dbus

      # Retry configure: FetchContent pulls Catch2 and nlohmann_json from
      # GitHub at configure time, which intermittently 504s. Clean the build
      # tree and retry rather than failing the whole run on a transient blip.
      - name: Configure CMake
        run: |
          for attempt in 1 2 3; do
            if cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBEEBIUM_BUILD_TESTS=ON \
                -DBEEBIUM_BUILD_SERVICE=ON \
                -DBEEBIUM_BUILD_SERVER=ON; then
              exit 0
            fi
            echo "::warning::CMake configure failed (attempt ${attempt}/3); retrying in case the cause was transient (e.g. a FetchContent download). A deterministic failure will surface after the final attempt."
            rm -rf build
            sleep $((attempt * 20))
          done
          echo "::error::CMake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Start Avahi daemon (Linux mDNS advertiser tests)
        # The Linux advertiser test needs a running avahi-daemon (with a D-Bus
        # system bus) to verify the advertise path. Prefer the init-managed
        # services; fall back to launching them directly where no init system
        # manages them. Fail loudly if the daemon never becomes ready so the
        # mDNS test cannot silently skip (it is also gated by
        # BEEBIUM_REQUIRE_MDNS below, which turns a skip into a failure).
        run: |
          sudo systemctl start dbus 2>/dev/null || sudo service dbus start 2>/dev/null || true
          sudo systemctl start avahi-daemon 2>/dev/null || sudo service avahi-daemon start 2>/dev/null || true
          if ! avahi-browse -t _workstation._tcp >/dev/null 2>&1; then
            sudo mkdir -p /run/dbus
            sudo dbus-daemon --system --fork 2>/dev/null || true
            sudo avahi-daemon --daemonize --no-drop-root 2>/dev/null \
              || sudo avahi-daemon --daemonize --no-drop-root --no-rlimits 2>/dev/null || true
          fi
          for attempt in $(seq 1 10); do
            if avahi-browse -t _beebium._tcp >/dev/null 2>&1; then
              echo "avahi-daemon ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::avahi-daemon did not become ready; Linux mDNS advertiser test cannot run"
          exit 1

      - name: Run tests
        env:
          # Require both the Avahi advertise AND browse paths to actually run: a
          # skipped mDNS test (libavahi/daemon absent, or the browse round trip
          # not completing) becomes a failure so neither is ever shipped
          # untested. The AvahiBrowser round trip is confirmed working on this
          # runner (the [browser][integration] cases pass here, not just skip)
          # and on real hardware (an aarch64 Debian Pi with avahi-daemon).
          BEEBIUM_REQUIRE_MDNS: "1"
          BEEBIUM_REQUIRE_MDNS_BROWSE: "1"
        # --timeout 120: fail a hung test after 2 min. The slowest legitimate
        # test is ~37s on the slowest (x86_64) runner, so this leaves ~3x
        # headroom while capping the wasted time when a test deadlocks.
        # --repeat until-pass:2 reruns a test that fails once, so a transient
        # blip does not sink the whole (lengthy) build and its dependent jobs;
        # a genuinely broken test still fails on the rerun. The post-step grep
        # turns a recovered flake into a visible warning so it gets tracked and
        # root-caused rather than silently masked by the retry.
        # Per-test durations are printed inline (Test #N ... Passed X sec).
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 --repeat until-pass:2 2>&1 | tee ctest.log
          if grep -qE '\*\*\*(Failed|Timeout|Exception)' ctest.log; then
            echo "::warning::A test failed on its first attempt and passed on rerun (flaky). See the ctest output above and root-cause it; do not rely on the retry."
          fi

      # catch_discover_tests registers one ctest entry per Catch2 TEST_CASE, so
      # this reports individual cases rather than test binaries (and expands
      # each TEMPLATE_TEST_CASE per type). It only holds for a completed build:
      # for a binary it cannot run, catch_discover_tests emits a single
      # <target>_NOT_BUILT placeholder instead, which would silently collapse
      # the count to roughly the number of test executables. Refuse to publish
      # a number if any placeholder is present.
      - name: Count tests
        run: |
          ctest --test-dir build --show-only=json-v1 > ctest-tests.json
          python3 -c "
          import json
          names = [t['name'] for t in json.load(open('ctest-tests.json'))['tests']]
          missing = [n for n in names if 'NOT_BUILT' in n]
          if missing:
              raise SystemExit(f'{len(missing)} test binaries were not built, e.g. {missing[:3]}')
          if not names:
              raise SystemExit('ctest discovered no tests')
          open('cpp.count', 'w').write(str(len(names)))
          print(f'cpp: {len(names)}')
          "

      - name: Upload test count
        uses: actions/upload-artifact@v7
        with:
          name: test-count-cpp
          path: cpp.count
          retention-days: 1

      - name: Upload server binaries
        # Preserve the built binaries even if a step failed, so a re-run of a
        # dependent job can reuse them instead of forcing a full rebuild.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beebium-server-linux
          path: |
            build/src/server/beebium-model-b
            build/src/server/extensions/
            build/lib/libbeebium_extension_api.so
            build/lib/libbeebium_extension_ui_proto.so
          retention-days: 7

  server-linux-arm64:
    name: Build and Test Server (Linux arm64)
    # Self-hosted arm64 Linux runner (see docs/local-arm64-runner.md, which is
    # gitignored). GitHub does not offer hosted arm64 Linux runners, so this
    # native aarch64 coverage comes from our own box.
    runs-on: [self-hosted, Linux, ARM64]
    needs: preflight
    # A from-scratch build on the Pi still takes a while even at -j4 (see
    # CMAKE_BUILD_PARALLEL_LEVEL below); bound it generously.
    timeout-minutes: 180

    env:
      # Per-platform build parallelism (see the macOS arm64 job). The runner is
      # a 4-core Raspberry Pi 5 with ~8 GiB RAM. Each of the four server
      # main_*.cpp TUs is heavy in cc1plus (~1.8-2.4 GiB) -- the whole server
      # (every gRPC service, subcommand and the extension framework) lives in
      # the header-only, machine-templated server_main<> in ServerMain.hpp, so
      # it is compiled in full once per machine variant. At -j4 all four
      # compile at once; measured 2026-07-15 that peaked at ~7.5 GiB used
      # (522 MiB RAM free, swap barely touched) and built in ~27 min -- it
      # fits, but only just, so do not raise past 4. (History: the previous
      # 2 GiB Pi 4 could only manage -j1 -- even two of those TUs exhausted RAM
      # + swap and the kernel OOM-killed cc1plus.)
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build/test dependencies (cmake, gRPC/protobuf, Avahi, ...) are
      # pre-provisioned on the runner host rather than installed per run: this
      # is a persistent self-hosted box, so re-installing every build would be
      # wasteful and would require passwordless sudo in the job. See
      # docs/local-arm64-runner.md for the provisioning steps.
      - name: Show toolchain
        run: |
          cmake --version
          gcc --version | head -1
          pkg-config --exists grpc++ && echo "grpc++: $(pkg-config --modversion grpc++)"

      # Retry configure: FetchContent pulls Catch2 and nlohmann_json from
      # GitHub at configure time, which intermittently 504s. Clean the build
      # tree and retry rather than failing the whole run on a transient blip.
      - name: Configure CMake
        run: |
          for attempt in 1 2 3; do
            if cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBEEBIUM_BUILD_TESTS=ON \
                -DBEEBIUM_BUILD_SERVICE=ON \
                -DBEEBIUM_BUILD_SERVER=ON; then
              exit 0
            fi
            echo "::warning::CMake configure failed (attempt ${attempt}/3); retrying in case the cause was transient (e.g. a FetchContent download). A deterministic failure will surface after the final attempt."
            rm -rf build
            sleep $((attempt * 20))
          done
          echo "::error::CMake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Run tests
        env:
          # Require both the Avahi advertise AND browse paths to actually run:
          # validating the real aarch64 Pi round trip is a stated goal (the
          # hosted x86 Linux job already requires it). avahi-daemon runs as a
          # system service on the Pi, so no per-job daemon bring-up is needed.
          BEEBIUM_REQUIRE_MDNS: "1"
          BEEBIUM_REQUIRE_MDNS_BROWSE: "1"
        # See the other jobs for the rationale behind --timeout 120 and
        # --repeat until-pass:2.
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 --repeat until-pass:2 2>&1 | tee ctest.log
          if grep -qE '\*\*\*(Failed|Timeout|Exception)' ctest.log; then
            echo "::warning::A test failed on its first attempt and passed on rerun (flaky). See the ctest output above and root-cause it; do not rely on the retry."
          fi

      - name: Upload server binaries
        # Preserve the built binaries even if a step failed, so a re-run of a
        # dependent job can reuse them instead of forcing a full rebuild.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beebium-server-linux-arm64
          path: |
            build/src/server/beebium-model-b
            build/src/server/extensions/
            build/lib/libbeebium_extension_api.so
            build/lib/libbeebium_extension_ui_proto.so
          retention-days: 7

  server-windows:
    name: Build and Test Server (Windows)
    # Pinned to windows-2022 for Visual Studio 2022. In June 2026 GitHub
    # migrated windows-latest / windows-2025 to ship Visual Studio 2026 by
    # default, so the "Visual Studio 17 2022" CMake generator below no longer
    # finds an instance on windows-latest. Revisit when moving to the VS 2026
    # toolset (generator "Visual Studio 18 2026", and confirm the pinned vcpkg
    # commit supports it).
    runs-on: windows-2022
    needs: preflight

    permissions:
      contents: read
      packages: write

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Pin vcpkg's tool/source download root to a cacheable path. vcpkg
      # downloads its own pinned PowerShell-core here during compiler-hash
      # detection, and that GitHub release URL intermittently 504s; caching
      # the directory means it is fetched once and reused thereafter.
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set VCPKG_INSTALLED_DIR
        run: echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> $env:GITHUB_ENV

      - name: Cache vcpkg downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-downloads
          key: vcpkg-downloads-windows-77df67c

      - name: Configure vcpkg NuGet binary cache
        run: |
          nuget sources add -Name "GitHub" -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.actor }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          echo "VCPKG_BINARY_SOURCES=clear;nuget,GitHub,readwrite" >> $env:GITHUB_ENV

      - name: Setup vcpkg and install dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '77df67cfff9c12ccfdb52284e07c87c75092f723'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      # Retry configure: FetchContent pulls Catch2 and nlohmann_json from
      # GitHub at configure time, which intermittently 504s. Clean the build
      # tree and retry rather than failing the whole run on a transient blip.
      - name: Configure CMake
        run: |
          foreach ($attempt in 1..3) {
            cmake -B build `
              -G "Visual Studio 17 2022" `
              -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              -DBEEBIUM_BUILD_TESTS=ON `
              -DBEEBIUM_BUILD_SERVICE=ON `
              -DBEEBIUM_BUILD_SERVER=ON
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::CMake configure failed (attempt $attempt/3); retrying in case the cause was transient (e.g. a FetchContent download). A deterministic failure will surface after the final attempt."
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($attempt * 20)
          }
          Write-Host "::error::CMake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Copy extension API DLL to test directory
        run: |
          Copy-Item "build\src\server\Release\beebium_extension_api.dll" -Destination "build\tests\Release\" -Force

      - name: Run tests
        # See the macOS/Linux jobs for the rationale behind --timeout 120 and
        # --repeat until-pass:2. shell: bash uses the runner's Git Bash (with
        # -eo pipefail) so the retry-visibility logic matches the other jobs.
        #
        # BEEBIUM_REQUIRE_MDNS_BROWSE is deliberately NOT set here yet. The
        # Windows browser ([browser][integration]) drives a real DnsServiceBrowse
        # /Resolve round trip, which needs a working in-box mDNS responder; it is
        # not yet confirmed whether the GitHub-hosted windows-2022 image provides
        # one. Until a run proves the round trip completes here, these cases skip
        # (rather than fail) when it does not, so an unrelated change is not
        # blocked by CI infrastructure. Once confirmed, set
        # BEEBIUM_REQUIRE_MDNS_BROWSE: "1" (as the macOS jobs do) so the Windows
        # browser is required-tested on every push.
        shell: bash
        run: |
          ctest --test-dir build --build-config Release --output-on-failure --timeout 120 --repeat until-pass:2 2>&1 | tee ctest.log
          if grep -qE '\*\*\*(Failed|Timeout|Exception)' ctest.log; then
            echo "::warning::A test failed on its first attempt and passed on rerun (flaky). See the ctest output above and root-cause it; do not rely on the retry."
          fi

      - name: Diagnose native Windows mDNS (informational)
        # This runner is Windows Server 2022 with no Apple Bonjour, so the
        # dual-provider factory selects the NATIVE DnsService* path -- the only
        # place it runs at runtime (dev boxes with Bonjour take the Bonjour
        # path). The [browser][integration] cases skip here rather than assert,
        # so run the native advertise->browse->resolve round trip directly with
        # BEEBIUM_MDNS_TRACE=1 to capture the DnsServiceBrowse/Resolve DNS_STATUS
        # codes. Purpose: determine whether native browse actually works on a
        # clean box (goal: make it work and then require it) vs. an environment
        # limitation. Informational only -- never gates the build.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BEEBIUM_MDNS_TRACE: "1"
        run: |
          echo "::group::native advertiser trace"
          ./build/tests/Release/test_advertiser.exe "[advertiser][windows]" 2>&1 | grep -E "windns-|SKIP|PASS|FAIL|assertion" || true
          echo "::endgroup::"
          echo "::group::native browse round-trip trace"
          ./build/tests/Release/test_browser.exe "Browser sees an advertised service" 2>&1 | grep -E "windns-|SKIP|PASS|FAIL|assertion|advertise" || true
          echo "::endgroup::"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check executable dependencies
        run: dumpbin /dependents build\src\server\Release\beebium-model-b.exe

      - name: Copy runtime DLLs to Release folder
        run: |
          Copy-Item "$env:VCPKG_INSTALLED_DIR\x64-windows\bin\*.dll" -Destination "build\src\server\Release\" -Force

      - name: Upload server binary with DLLs
        # Preserve the built binaries even if a step failed, so a re-run of a
        # dependent job can reuse them instead of forcing a full rebuild.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beebium-server-windows
          path: build/src/server/Release/
          retention-days: 7

  gui-client-macos-arm64:

    name: Build and Test GUI Client (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Download server artifacts
        uses: actions/download-artifact@v8
        with:
          name: beebium-server-macos-arm64
          path: server-build

      - name: Make servers executable
        run: chmod +x server-build/src/server/beebium-model-b*
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
