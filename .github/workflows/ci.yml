                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_INSTALLED_DIR="${VCPKG_INSTALLED_DIR}" \
                -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/triplets" \
                -DVCPKG_TARGET_TRIPLET=x64-osx-static \
                -DVCPKG_HOST_TRIPLET=x64-osx-static \
                -DVCPKG_MANIFEST_INSTALL=OFF \
                -DBEEBIUM_BUILD_TESTS=ON \
                -DBEEBIUM_BUILD_SERVICE=ON \
                -DBEEBIUM_BUILD_SERVER=ON; then
              exit 0
            fi
            echo "::warning::CMake configure failed (attempt ${attempt}/3); retrying in case the cause was transient (e.g. a FetchContent download). A deterministic failure will surface after the final attempt."
            rm -rf build
            sleep $((attempt * 20))
          done
          echo "::error::CMake configure failed after 3 attempts"
          exit 1

      - name: Build
        run: cmake --build build --parallel

      - name: Verify static linking
        run: |
          echo "Checking dynamic dependencies..."
          otool -L build/src/server/beebium-model-b
          # Should only show system libraries, not Homebrew paths

      - name: Run tests
        env:
          # macOS Bonjour browse is reliable on the hosted runners, so require
          # the browser integration round trip to actually run: a skipped
          # browse test becomes a failure so the browser is never shipped
          # untested. (The advertise side is asserted directly by the
          # [advertiser][macos] cases via REQUIRE.)
          BEEBIUM_REQUIRE_MDNS_BROWSE: "1"
        # --timeout 120: fail a hung test after 2 min. The slowest legitimate
        # test is ~37s on the slowest (x86_64) runner, so this leaves ~3x
        # headroom while capping the wasted time when a test deadlocks.
        # --repeat until-pass:2 reruns a test that fails once, so a transient
        # blip does not sink the whole (lengthy) build and its dependent jobs;
        # a genuinely broken test still fails on the rerun. The post-step grep
