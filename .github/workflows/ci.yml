        run: bash scripts/test-wheel.sh tests/ -v --durations=0 --timeout=600

  python-integration-macos-x86_64:
    name: Python Client Integration Tests (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Extract at 'build/' so the artifact's src/server/ and lib/
      # entries land in the same relative layout the server's build-time
      # RPATH expects (see build/lib/libbeebium_extension_api.dylib).
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: beebium-server-macos-x86_64
          path: build

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Run integration tests
        working-directory: clients/beebium-python-client
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        # Runs against the BUILT WHEEL installed into a fresh venv, not the
        # source tree, so packaging faults (missing data files, entry points)
        # fail here too. --durations=0 lists every test's wall-clock time
        # (slowest first); --timeout=600 fails a hung test after 10 min
        # rather than stalling the job.
        run: bash scripts/test-wheel.sh tests/ -v --durations=0 --timeout=600

  # Builds the npm tarball and exercises it the way a consumer would. Nothing
  # else here can: the other jobs run `npm ci`, which installs devDependencies,
  # so a runtime import reachable only by hoisting out of a dev-only package
  # still resolves; and vitest resolves like a bundler, accepting extensionless
  # specifiers that Node's ESM resolver rejects. Both had already let real
  # breakage through -- undeclared protobufjs/long, and a dist/ that could not
  # be imported at all -- while every check stayed green.
  #
  # This is also the only job that runs `npm run build`, and so the only one
  # that proves the dist/ named by package.json "main" exists and works.
  package-typescript:
    name: TypeScript Client Package
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        working-directory: clients/beebium-typescript-client
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/beebium-typescript-client
        run: npm run generate-protos

      - name: Build dist
        working-directory: clients/beebium-typescript-client
        run: npm run build

      - name: Pack tarball
        working-directory: clients/beebium-typescript-client
        run: |
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "Packed $TARBALL"

      # Installed by tarball into an empty directory, with --omit=dev, so
      # resolution sees only what the package declares -- not this repo's
      # node_modules.
      - name: Install the tarball as a consumer
        run: |
          set -euo pipefail
          CLEANROOM="$RUNNER_TEMP/cleanroom"
          rm -rf "$CLEANROOM" && mkdir -p "$CLEANROOM"
          cd "$CLEANROOM"
          echo '{ "name": "cleanroom", "private": true, "type": "module" }' > package.json
          npm install --omit=dev "$RUNNER_TEMP/$TARBALL"

      - name: Smoke-test the installed package
        run: |
          set -euo pipefail
          CLEANROOM="$RUNNER_TEMP/cleanroom"
          cp "$GITHUB_WORKSPACE/clients/beebium-typescript-client/scripts/package-smoke.mjs" "$CLEANROOM/"
          cd "$CLEANROOM"
          node package-smoke.mjs

  # Sums the per-suite counts and publishes a shields.io endpoint badge to the
  # orphan `badges` branch, which the README points at. Keeping the JSON on its
  # own branch keeps master's history free of once-per-push badge commits, and
  # avoids depending on a gist (no external state, no PAT).
  test-count-badge:
    name: Publish test-count badge
    runs-on: ubuntu-latest
    needs: [server-linux, python-client, typescript-client]
    # Publish only from master: a feature branch or PR must not move the number
    # the README shows. `needs` also means a failed build never publishes a
    # count. Pushes authenticated with GITHUB_TOKEN do not trigger workflows,
    # so committing here cannot re-trigger CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Download test counts
        uses: actions/download-artifact@v8
        with:
          pattern: test-count-*
          merge-multiple: true
          path: counts

      - name: Build badge JSON
        run: |
          python3 -c "
          import json, pathlib

          counts = {p.stem: int(p.read_text().strip())
                    for p in sorted(pathlib.Path('counts').glob('*.count'))}

          # Refuse to publish a partial sum: a suite silently dropping out would
          # otherwise look like tests being deleted.
          expected = {'cpp', 'python', 'typescript'}
          if set(counts) != expected:
              raise SystemExit(f'expected counts for {sorted(expected)}, got {sorted(counts)}')

          total = sum(counts.values())
          for suite, n in sorted(counts.items()):
              print(f'{suite:>12}: {n}')
          print(f'{\"total\":>12}: {total}')

          pathlib.Path('tests.json').write_text(json.dumps({
              'schemaVersion': 1,
              'label': 'tests',
              'message': str(total),
              'color': 'blue',
          }))
          pathlib.Path('total.txt').write_text(str(total))
          "

      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOTAL="$(cat total.txt)"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The branch is orphan and holds only the badge JSON, so clone it if it
          # exists and bootstrap it if this is the first run.
          if git clone --quiet --depth 1 --branch badges "$REMOTE" badges-repo 2>/dev/null; then
            echo "Using existing badges branch"
          else
            echo "Bootstrapping badges branch"
            mkdir badges-repo
            git -C badges-repo init --quiet -b badges
            git -C badges-repo remote add origin "$REMOTE"
          fi

          cp tests.json badges-repo/tests.json
          cd badges-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json

          # The count is unchanged on most pushes; committing anyway would add a
          # commit per push for no information.
          if git diff --staged --quiet; then
            echo "Test count unchanged at ${TOTAL}; nothing to publish."
            exit 0
          fi

          git commit --quiet -m "Update test-count badge: ${TOTAL} tests"
          git push --quiet origin badges
          echo "Published test count: ${TOTAL}"
