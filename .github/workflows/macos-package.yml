# Build, install, test and audit the beebium-server Homebrew formula on macOS.
#
# The formula is a source build against Homebrew's own grpc/protobuf/abseil, so
# this is cheap (~1 min per runner) -- it runs on PRs that touch the formula or
# the build system, on demand, and as a reusable job in the release flow.
#
# Runs on arm64 (the macos-15 runner, Apple Silicon). It must track a macOS
# version that Homebrew still ships grpc/protobuf/abseil BOTTLES for: this is a
# from-bottle install, not a source build of the deps, so an unbottled runner
# fails with "grpc: no bottle available!". Homebrew dropped macOS 14 from grpc's
# bottle window (bottles now cover arm64 sequoia/tahoe/... only), which is why
# this moved off macos-14. Bump it again when Homebrew retires the current OS.

name: macOS package

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "packaging/homebrew/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/server/CMakeLists.txt"
      - ".github/workflows/macos-package.yml"

permissions:
  contents: read

jobs:
  # arm64 only, because the formula is: Homebrew ships no Intel macOS bottles for
  # its grpc, protobuf and openssl@3 dependencies, so Intel Macs use the
  # self-contained tarball, wheel or DMG, which release.yml builds on
  # macos-15-intel (where ci.yml also builds and tests the server).
  formula:
    name: formula (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install, test and audit the formula
        run: packaging/homebrew/test-formula.sh

      # Validate the canonical beebium-gui CASK here (sync-channels.yml runs on
      # ubuntu, where cask audits are not meaningful). Stage it in a throwaway
      # tap -- `brew audit --cask <path>` is disabled -- and run style + audit.
      # Neither style nor `audit --strict` reports deprecated stanza usage
      # (e.g. `url ..., verified:`); that only surfaces when the tapped cask is
      # loaded, as a warning on every user's `brew upgrade`. Loading it here
      # with HOMEBREW_DEVELOPER=1 turns that warning into an error, so the
      # next deprecation fails CI instead.
      - name: Style and audit the beebium-gui cask
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/beebium/homebrew-caskcheck"
          brew tap-new beebium/caskcheck --no-git >/dev/null
          mkdir -p "${tap}/Casks"
          cp packaging/homebrew/beebium-gui.rb "${tap}/Casks/beebium-gui.rb"
          brew style "${tap}/Casks/beebium-gui.rb"
          brew audit --cask --strict beebium/caskcheck/beebium-gui
          HOMEBREW_DEVELOPER=1 brew info --cask beebium/caskcheck/beebium-gui
          rm -rf "${tap}"
          echo "beebium-gui cask: style + audit + load clean"
