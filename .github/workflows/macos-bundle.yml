# Build the self-contained macOS server bundles (arm64 + x86_64).
#
# Like the Linux/Windows bundles this is a from-source static build
# (gRPC/protobuf/abseil), so it is expensive and runs only on demand or as a
# reusable job in the release flow. Its static deps come from triplets of its own
# (arm64-osx11-static, x64-osx12-static) that compile them for the bundle's
# deployment floor, so the floor holds in every linked object and not only in
# the binary's load command (#243). Those deps are cached under a key of their
# own, separate from ci.yml's: a bundle run is warm when an earlier bundle run on
# the same runner image filled the cache. There is no GHCR build-env on macOS.
#
# The result is beebium-server-<version>-macos-<arch>.tar.gz: a relocatable
# single-directory tree (bin/ lib/ share/beebium) with every Mach-O ad-hoc
# codesigned so Apple Silicon will execute it. pip-installed binaries carry no
# quarantine attribute, so Gatekeeper/notarisation does not apply.

name: macOS bundle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The triplet's VCPKG_OSX_DEPLOYMENT_TARGET MUST equal
          # deployment_target; a step below asserts it.
          - arch: arm64
            runner: macos-15
            triplet: arm64-osx11-static
            # 11.0 (Big Sur) is the first macOS on Apple Silicon, so it is the
            # lowest floor that means anything for arm64.
            deployment_target: "11.0"
            self_hosted: false
            # The hosted macOS runners are RAM-starved for a static gRPC/protobuf
            # build; serialise the heavy compiles as ci.yml does.
            parallel: "1"
          # The self-hosted Intel macOS runner (#223).
          - arch: x86_64
            runner: [self-hosted, macOS, X64]
            triplet: x64-osx12-static
            # 12.0 (Monterey) is a defensible modern Intel floor: Catalina/Big Sur
            # are past their support window, and it keeps the wheel's reach broad
            # without claiming an OS we cannot reason about.
            deployment_target: "12.0"
            self_hosted: true
            # 12 threads but 16 GiB at about 2 GiB per server TU, as ci.yml.
            parallel: "6"

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      # Per-runner build parallelism, from the matrix.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}

    steps:
      # The self-hosted Intel macOS runner has no Homebrew; its tools are
      # pre-provisioned under $HOME/tools/bin (see ci.yml's server-macos-x86_64).
      - name: Put the runner's tools on PATH
        if: matrix.self_hosted
        run: echo "$HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A self-hosted workspace persists between runs; start clean.
          clean: true

      - name: Select Xcode 16
        if: ${{ !matrix.self_hosted }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      # setup-xcode looks for /Applications/Xcode_<version>.app; the self-hosted
      # runner has /Applications/Xcode.app selected, so assert its version.
      - name: Check Xcode 16
        if: matrix.self_hosted
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -qE '^Xcode 16\.' || {
            echo "::error::the self-hosted Intel macOS runner must have Xcode 16 selected"
            exit 1
          }

      - name: Check the triplet's floor matches the deployment target
        run: |
          set -euo pipefail
          triplet_filepath="triplets/${{ matrix.triplet }}.cmake"
          floor="$(sed -nE 's/^set\(VCPKG_OSX_DEPLOYMENT_TARGET ([0-9.]+)\)$/\1/p' "${triplet_filepath}")"
          echo "${{ matrix.triplet }} VCPKG_OSX_DEPLOYMENT_TARGET=${floor}, deployment_target=${{ matrix.deployment_target }}"
          [ "${floor}" = "${{ matrix.deployment_target }}" ] \
            || { echo "::error::${triplet_filepath} builds the deps for ${floor:-no floor}, but the binary links for ${{ matrix.deployment_target }}"; exit 1; }

      - name: Set VCPKG_INSTALLED_DIR
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> "$GITHUB_ENV"
          # The key rotates with the runner image, as ci.yml's does. A
          # self-hosted runner has no ImageVersion; ci.yml uses the same fallback.
          echo "IMAGE_VERSION=${ImageVersion:-selfhosted}" >> "$GITHUB_ENV"

      # Keyed on the floor triplet's name and contents, so it never shares an
      # entry with ci.yml's *-osx-static caches in either direction.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('vcpkg.json', format('triplets/{0}.cmake', matrix.triplet)) }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.IMAGE_VERSION }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '77df67cfff9c12ccfdb52284e07c87c75092f723'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          # A self-hosted workspace persists between runs: configure from scratch.
          rm -rf build
          for attempt in 1 2 3; do
            if cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_INSTALLED_DIR="${VCPKG_INSTALLED_DIR}" \
                -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/triplets" \
                -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
                -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
                -DVCPKG_MANIFEST_INSTALL=OFF \
                -DBEEBIUM_BUILD_TESTS=ON \
                -DBEEBIUM_BUILD_SERVICE=ON \
                -DBEEBIUM_BUILD_SERVER=ON; then
              exit 0
            fi
            echo "::warning::CMake configure failed (attempt ${attempt}/3); retrying in case the cause was transient (e.g. a FetchContent download)."
            rm -rf build
            sleep $((attempt * 20))
          done
          echo "::error::CMake configure failed after 3 attempts"
          exit 1

      - name: Build the servers
        run: |
          set -euo pipefail
          cmake --build build --target beebium-servers --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}" 2>&1 \
            | tee "${RUNNER_TEMP}/build-servers.log"

      # ld64 sets the binary's minos from the link flag whatever the inputs were
      # built for, so the load command alone does not prove the floor. It warns
      # for each object built for a newer macOS; there must be none.
      - name: Verify the binary's deployment floor
        run: |
          set -euo pipefail
          newer="$(grep -c "was built for newer 'macOS' version" "${RUNNER_TEMP}/build-servers.log" || true)"
          echo "link warnings for objects built for a newer macOS: ${newer}"
          if [ "${newer}" != 0 ]; then
            grep -m 20 "was built for newer 'macOS' version" "${RUNNER_TEMP}/build-servers.log"
            echo "::error::${newer} linked objects were built for a macOS newer than ${{ matrix.deployment_target }}"
            exit 1
          fi
          got="$(vtool -show-build build/src/server/beebium-model-b | awk '/minos/{print $2}')"
          echo "beebium-model-b minos=${got}, expected ${{ matrix.deployment_target }}"
          [ "${got}" = "${{ matrix.deployment_target }}" ] \
            || { echo "::error::minos ${got} != deployment target ${{ matrix.deployment_target }} -- the wheel tag would be wrong"; exit 1; }

      - name: Prove the freshly built tree installs and boots
        run: ctest --test-dir build -R install_smoke --output-on-failure

      - name: Package the relocatable tarball (CPack TGZ)
        run: |
          set -euo pipefail
          ( cd build && cpack -G TGZ )
          ls build/beebium-server-*-macos-${{ matrix.arch }}.tar.gz

      - name: Ad-hoc codesign every Mach-O and repackage
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' .bumpversion.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          tarball="build/beebium-server-${V}-macos-${{ matrix.arch }}.tar.gz"
          top="beebium-server-${V}-macos-${{ matrix.arch }}"
          work="$(mktemp -d)"
          tar -xzf "${tarball}" -C "${work}"
          tree="${work}/${top}"
          # Sign the servers, the plugin dylibs, and the ABI libraries. CMake
          # already applies an ad-hoc signature during install; re-affirm it (and
          # cover anything it missed) so every shipped Mach-O is signed and valid.
          find "${tree}/bin" "${tree}/lib" -type f \( -name '*.dylib' -o -perm -u+x \) \
            | while IFS= read -r f; do
                if file "$f" | grep -q "Mach-O"; then
                  codesign --force -s - "$f"
                  codesign -v "$f"
                fi
              done
          # Repackage the signed tree in place (same single-top-dir layout).
          rm -f "${tarball}"
          tar -czf "${tarball}" -C "${work}" "${top}"
          echo "Signed and repackaged ${tarball}"

      - name: Smoke-test the extracted, signed tree
        run: |
          set -euo pipefail
          V="$(grep -E '^current_version' .bumpversion.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          top="beebium-server-${V}-macos-${{ matrix.arch }}"
          work="$(mktemp -d)"
          tar -xzf "build/beebium-server-${V}-macos-${{ matrix.arch }}.tar.gz" -C "${work}"
          bash scripts/smoke-installed-tree.sh "${work}/${top}"

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: build/beebium-server-*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
