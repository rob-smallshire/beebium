# Build, test, package and smoke-test the Linux client .debs, one per
# distribution and architecture (beebium-client_<version>.<distro>_<arch>.deb).
#
# The client links the distribution's Qt 6 and gRPC dynamically, so unlike the
# static server bundle it is built ON each distribution it is for, in that
# distribution's container on the hosted runners:
#   debian13     Debian 13 (trixie), whose packages also serve Raspberry Pi
#                OS trixie
#   ubuntu26.04  Ubuntu 26.04 LTS
# Each lane's .deb carries its distribution as a tilde suffix on the version
# (0.16.0~debian13) and a dot in its file name, as GitHub publishes it
# (#259). Ubuntu 24.04 ships Qt 6.4, below the client's 6.7 floor, so it has
# no lane.
#
# dpkg-shlibdeps ties each .deb to the exact Qt build it was compiled against
# (qt6-base-private-abi, from the QRhi display), so every run installs the
# archive's current packages afresh and nothing built is cached between runs.
# See docs/packaging.md, "The Linux desktop client".
#
# The dependency list and the build and smoke commands live in
# clients/linux/ci/, so CI and a local container run the same steps. ci.yml
# calls this on every push; release.yml calls it to attach the .debs.

name: Linux client package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build client .deb (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            image: debian:trixie
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            image: debian:trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: ubuntu26.04
            image: ubuntu:26.04
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu26.04
            image: ubuntu:26.04
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # A bare distribution image has no git: install it before checkout, or
      # actions/checkout falls back to a REST tarball with no .git.
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: sh clients/linux/ci/install-build-deps.sh

      # Two jobs: the hosted runners' RAM, as for the server's Linux job.
      - name: Configure, build, test and package
        run: sh clients/linux/ci/build-package.sh build-linux-client 2 ${{ matrix.distro }}

      - name: Check the package metadata matches its file name
        run: |
          set -eu
          V="$(grep -E '^current_version' .bumpversion.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          deb="build-linux-client/beebium-client_${V}.${{ matrix.distro }}_${{ matrix.arch }}.deb"
          test -f "${deb}" || { echo "::error::expected ${deb}"; ls build-linux-client/*.deb; exit 1; }
          dpkg-deb -f "${deb}" Package Version Architecture Depends Recommends
          [ "$(dpkg-deb -f "${deb}" Package)" = beebium-client ] || { echo "::error::Package is not beebium-client"; exit 1; }
          [ "$(dpkg-deb -f "${deb}" Version)" = "${V}~${{ matrix.distro }}" ] || { echo "::error::Version is not ${V}~${{ matrix.distro }}"; exit 1; }
          [ "$(dpkg-deb -f "${deb}" Architecture)" = "${{ matrix.arch }}" ] || { echo "::error::Architecture is not ${{ matrix.arch }}"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: linux-client-${{ matrix.distro }}-${{ matrix.arch }}
          path: build-linux-client/beebium-client_*.${{ matrix.distro }}_${{ matrix.arch }}.deb
          if-no-files-found: error

  # Install the .deb in a FRESH container of its distribution, not the build
  # container, so the build's -dev packages cannot satisfy a dependency the
  # .deb fails to declare.
  smoke:
    name: smoke client .deb (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            image: debian:trixie
            arch: amd64
            runner: ubuntu-latest
          - distro: debian13
            image: debian:trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: ubuntu26.04
            image: ubuntu:26.04
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu26.04
            image: ubuntu:26.04
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-client-${{ matrix.distro }}-${{ matrix.arch }}
          path: _artifacts

      # The Qt the .deb resolved to is printed so a future qt6-base-private-abi
      # mismatch (a Debian Qt point update) is visible in the log.
      - name: Install, run, validate and remove in a clean ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }} sh -c '
            set -eu
            sh clients/linux/ci/smoke-package.sh _artifacts/beebium-client_*.${{ matrix.distro }}_${{ matrix.arch }}.deb
            echo "Qt the package was built for and resolved to:"
            dpkg-deb -f _artifacts/beebium-client_*.${{ matrix.distro }}_${{ matrix.arch }}.deb Depends | tr "," "\n" | grep -E "qt6-base-private-abi|libqt6core6" || true
            dpkg-query -W -f="\${Package} \${Version}\n" "libqt6core6*"
          '
