# Build and smoke-test the self-contained Linux server packages.
#
# Manual only (workflow_dispatch) -- this is expensive (a from-source static
# gRPC/protobuf build per architecture), so it is NOT run on push. Trigger it
# from the Actions tab, or via the API / CLI:
#
#   gh workflow run linux-packages.yml
#
# Later this can be wired to a version-bump + tag flow (e.g. bump-my-version) to
# build and publish release artifacts automatically.
#
# Runners are native per architecture (free on public repos): amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm. No QEMU emulation.

name: Linux packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # Pull the prebuilt build-env dependency image from GHCR (private by default).
  packages: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
            runner: ubuntu-latest
            triplet: x64-linux-static
          - arch: arm64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux-static
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the prebuilt build-env image, if published
        # Start the build FROM the prebuilt dependency image when it exists
        # (published by build-env.yml, whose tag this recomputes), skipping the
        # ~half-hour vcpkg install. When it is absent -- a fork, or before the
        # first build-env run -- leave BUILDENV_ARG empty and the Dockerfile
        # builds the dependencies from scratch (its default). See
        # docs/packaging.md, "Persistent dependency caching".
        run: |
          tag="$(bash scripts/build-env-tag.sh)"
          img="ghcr.io/${{ github.repository_owner }}/beebium-build-env:${tag}-${{ matrix.arch }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "Using prebuilt build-env image: $img"
            echo "BUILDENV_ARG=--build-arg BUILDENV_IMAGE=$img" >> "$GITHUB_ENV"
          else
            echo "No prebuilt build-env image ($img); building dependencies from scratch."
            echo "BUILDENV_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Build self-contained bundle (.deb + .rpm + .tar.gz)
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            -f docker/linux-bundle/Dockerfile \
            --build-arg VCPKG_TRIPLET=${{ matrix.triplet }} \
            ${BUILDENV_ARG} \
            --target artifact \
            --output type=local,dest=./_artifacts \
            --cache-from type=gha,scope=bundle-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=bundle-${{ matrix.arch }} \
            .

      - name: List artifacts
        run: ls -l _artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          # Upload ONLY this arch's packages. The buildx output dir can carry
          # stale cross-arch/old-layout files from the gha build cache; without
          # this filter each bundle picks up the other arch's files, and the
          # release job's merge-multiple then collides same-named assets and
          # publishes the wrong (stale) ones. The Debian (amd64/arm64) and RPM
          # (x86_64/aarch64) arch tokens are each mutually exclusive substrings,
          # so both globs select cleanly; the .rpm needs its own line because its
          # filename carries the RPM arch token, not the Debian one.
          path: |
            _artifacts/*${{ matrix.arch }}*
            _artifacts/*${{ matrix.rpm_arch }}*
          if-no-files-found: error

  # Install the .deb in a clean Debian, then drive the installed server through
  # the Python client (the real user path: install -> launch -> gRPC -> ROMs).
  smoke-deb:
    name: smoke .deb (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: _artifacts

      - name: Install .deb and run bundle + interaction smoke
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e BEEBIUM_ROM_DIR=/opt/beebium/share/beebium/roms \
            debian:bookworm bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq \
                ./_artifacts/beebium-server_*_${{ matrix.arch }}.deb \
                curl ca-certificates
              echo "::group::bundle smoke (self-containment + boot + bare-command)"
              bash scripts/smoke-installed-tree.sh /opt/beebium
              echo "::endgroup::"
              echo "::group::interaction smoke (client drives the installed server)"
              # The Python client requires Python >=3.12, but debian:bookworm
              # (the .deb glibc-floor target) ships 3.11. Provide 3.12 with uv --
              # the project manages Python with uv anyway -- rather than testing
              # the server on a non-target distro.
              export HOME=/root
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="/root/.local/bin:${PATH}"
              uv venv --python 3.12 /venv
              . /venv/bin/activate
              uv pip install --quiet ./clients/beebium-python-client pytest pytest-timeout
              pytest -q packaging/smoke/test_smoke.py
              echo "::endgroup::"
            '

  # Extract the .tar.gz in a clean Arch (the non-dpkg path) and run the bundle
  # smoke. Official archlinux is x86_64-only; arm64 uses Arch Linux ARM.
  smoke-tarball:
    name: smoke .tar.gz (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: _artifacts

      - name: Extract .tar.gz on Arch and run bundle smoke
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ${{ matrix.image }} bash -c '
              set -euo pipefail
              tarball="$(ls _artifacts/beebium-server-*-linux-${{ matrix.arch }}.tar.gz)"
              # The relocatable tarball unpacks to a single dir named exactly like
              # the tarball without .tar.gz. (Avoid `tar -tzf | head`: head closes
              # the pipe early, tar gets SIGPIPE, and `set -o pipefail` aborts.)
              dir="$(basename "$tarball" .tar.gz)"
              tar -xzf "$tarball"
              bash scripts/smoke-installed-tree.sh "$dir"
            '

  # Install the .rpm in a clean Fedora with dnf (the RPM-family path), then drive
  # the installed server through the Python client -- the mirror of smoke-deb.
  # Fedora ships Python >=3.12, so the client's requires-python is satisfied; uv
  # still provides the interpreter for parity/determinism with the .deb leg.
  smoke-rpm:
    name: smoke .rpm (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: _artifacts

      - name: Install .rpm and run bundle + interaction smoke
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e BEEBIUM_ROM_DIR=/opt/beebium/share/beebium/roms \
            fedora:latest bash -c '
              set -euo pipefail
              dnf install -y -q \
                ./_artifacts/beebium-server-*.${{ matrix.rpm_arch }}.rpm \
                curl ca-certificates
              echo "::group::bundle smoke (self-containment + boot + bare-command)"
              bash scripts/smoke-installed-tree.sh /opt/beebium
              echo "::endgroup::"
              echo "::group::interaction smoke (client drives the installed server)"
              export HOME=/root
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="/root/.local/bin:${PATH}"
              uv venv --python 3.12 /venv
              . /venv/bin/activate
              uv pip install --quiet ./clients/beebium-python-client pytest pytest-timeout
              pytest -q packaging/smoke/test_smoke.py
              echo "::endgroup::"
            '
