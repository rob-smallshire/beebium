# Re-run the Python client integration tests against a server binary already
# built by a prior CI run, without rebuilding anything. Use this to iterate on
# Python-only changes: pick the run whose server artifacts to reuse (they are
# retained for 7 days) and the platform to test on.
#
# This deliberately mirrors the download/setup/run steps of the
# python-integration-<platform> jobs in ci.yml; it does not refactor them.
name: Python Integration (reuse server artifacts)

on:
  workflow_dispatch:
    inputs:
      server_run_id:
        description: "CI run id whose beebium-server-<platform> artifact to reuse (e.g. 32597529370)"
        required: true
        type: string
      platform:
        description: "Platform to test on"
        required: true
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - macos-x86_64
          - linux
          - windows
      pytest_args:
        description: "Arguments passed to scripts/test-wheel.sh"
        required: true
        type: string
        default: "tests/ -v --durations=0 --timeout=600"

jobs:
  python-integration-reuse:
    name: Python Integration (${{ inputs.platform }}, run ${{ inputs.server_run_id }})
    # Same runner label mapping as ci.yml's per-platform jobs.
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-14","macos-x86_64":"macos-15-intel","linux":"ubuntu-latest","windows":"windows-2022"}')[inputs.platform] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Linux only: the server dlopens the Avahi runtime, and the
      # machine-advertisement test needs a running daemon (see ci.yml).
      - name: Install gRPC runtime libraries
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev libavahi-client3 avahi-daemon avahi-utils dbus

      # The artifact name matches the platform input exactly
      # (beebium-server-macos-arm64, ...-linux, ...-windows, ...). Windows lands
      # in build/src/server/Release; the others extract at build/ so the RPATH
      # layout matches. run-id + github-token pull from the other run.
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: beebium-server-${{ inputs.platform }}
          path: ${{ inputs.platform == 'windows' && 'build/src/server/Release' || 'build' }}
          run-id: ${{ inputs.server_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make servers executable
        if: inputs.platform != 'windows'
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          # Pin an exact uv version: setup-uv then skips resolving "latest"
          # against the astral-sh/versions manifest, the fetch of which failed
          # transiently and broke a release run.
          version: "0.12.3"

      - name: Start Avahi daemon (mDNS advertiser for the machine-name test)
        if: inputs.platform == 'linux'
        # Same as ci.yml: prefer the init-managed services, else launch dbus and
        # avahi-daemon directly. A failure here is a warning, not fatal -- the
        # machine-advertisement test then skips with that reason.
        run: |
          sudo systemctl start dbus 2>/dev/null || sudo service dbus start 2>/dev/null || true
          sudo systemctl start avahi-daemon 2>/dev/null || sudo service avahi-daemon start 2>/dev/null || true
          if ! avahi-browse -t _workstation._tcp >/dev/null 2>&1; then
            sudo mkdir -p /run/dbus
            sudo dbus-daemon --system --fork 2>/dev/null || true
            sudo avahi-daemon --daemonize --no-drop-root 2>/dev/null \
              || sudo avahi-daemon --daemonize --no-drop-root --no-rlimits 2>/dev/null || true
          fi
          for attempt in $(seq 1 10); do
            if avahi-browse -t _beebium._tcp >/dev/null 2>&1; then
              echo "avahi-daemon ready"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::avahi-daemon did not become ready; the machine-advertisement test will skip"

      - name: Run integration tests
        working-directory: clients/beebium-python-client
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/${{ inputs.platform == 'windows' && 'Release/beebium-model-b.exe' || 'beebium-model-b' }}
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        # Runs against the BUILT WHEEL in a fresh venv, exactly as ci.yml does.
        run: bash scripts/test-wheel.sh ${{ inputs.pytest_args }}
