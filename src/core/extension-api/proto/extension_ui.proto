syntax = "proto3";

package beebium;

// Extension UI framework: a small, server-driven UI vocabulary that lets
// any extension (peripheral, econet transport, future kinds) describe a
// control panel as a typed tree of Controls. Frontends render the tree
// natively and post user actions back through Dispatch.
//
// Design notes: docs/discussion/extension-ui-architecture.md
//
// The model is server-driven (Phoenix-LiveView style): the server holds
// the extension's state and computes a View; the client is a thin
// renderer with no business state. All user actions route through one
// Dispatch RPC -- there are no per-control RPCs.
service ExtensionUiService {
    // Open a long-lived stream of View updates for one extension. The
    // server pushes a fresh View whenever the extension's state changes
    // (the first View is delivered immediately on subscription). The
    // stream ends with NOT_FOUND if the named extension does not exist
    // (or is unloaded mid-session).
    rpc SubscribeView(SubscribeViewRequest) returns (stream View);

    // Post a user action back to the server. The server validates the
    // request (extension exists, control id is known for the current
    // view revision, payload type matches the control type, revision is
    // current) and then runs the extension's handle_event. The result of
    // the action is observable on the SubscribeView stream as a new
    // View, not in the response.
    rpc Dispatch(DispatchRequest) returns (DispatchResponse);
}

// --- View envelope ---

message SubscribeViewRequest {
    // Opaque, server-assigned extension instance id (matches
    // PeripheralExtensionService's ExtensionInfo.id and
    // EconetTransportService.EconetTransport.id). It is typically a
    // UUID; do not assume any relationship to the manifest name.
    // Clients must discover it via the relevant listing RPC
    // (ListExtensions / ListTransports) rather than hardcoding names,
    // so new extensions surface in frontends with no client changes.
    string extension_id = 1;
}

message View {
    // Echoed back so clients can route updates by extension if they
    // multiplex several streams onto one handler.
    string extension_id = 1;

    // Monotonic per-extension counter, bumped before each push. Clients
    // must echo this in DispatchRequest so the server can reject stale
    // events that target a control the server has already replaced.
    uint64 view_revision = 2;

    // Root of the control tree. By convention this is a Group, but any
    // single Control is valid (e.g. a single Label for an extension that
    // has nothing interactive to expose).
    Control root = 3;
}

// --- Controls ---
//
// Eleven primitives, deliberately small. Together with nested Groups and
// ModalEditors they cover the panels we have today (Piconet, AUN) and
// are expected to cover ~90% of any future extension. Stretching the
// alphabet should hurt slightly each time -- that's the forcing function
// for keeping it small. The newest two, EditableList and FileReference,
// each earn their place by replacing a dozen lower-level controls that
// built the #142 AUN panel: see docs/discussion/extension-ui-architecture.md
// "Vocabulary extension (2026-10-01)".

message Control {
    // Stable id assigned by the extension. Used by Dispatch to address
    // the control and by clients to patch widgets in place across pushes
    // (instead of rebuilding the panel each time).
    string id = 1;

    // Optional hover text. The platform-specific surfacing varies
    // (macOS uses the SwiftUI .help() modifier, web maps to the
    // `title` attribute, others may use a tooltip helper from their
    // toolkit). Use it for verbose / diagnostic detail that would
    // clutter the panel if rendered inline -- e.g. a disc geometry
    // breakdown on a Capacity Label, a memory-mapped address range
    // on an adapter's name Label. Empty / absent means no tooltip.
    string tooltip = 11;

    oneof control {
        Label          label           = 2;
        Indicator      indicator       = 3;
        Toggle         toggle          = 4;
        Button         button          = 5;
        Choice         choice          = 6;
        TextInput      text_input      = 7;
        Group          group           = 8;
        ModalEditor    modal_editor    = 9;
        EditableChoice editable_choice = 10;
        EditableList   editable_list   = 12;
        FileReference  file_reference  = 13;
    }
}

// Read-only text. Frontends render as a static label.
//
// secondary_text is a renderer hint for a short, lower-emphasis
// caption shown alongside the primary text -- typically right-
// aligned or in a muted style. Use it for provenance / status / size
// metadata that's logically attached to the primary line but should
// not be confused with it. Empty / absent means "no secondary
// caption", which is the default. Frontends that don't have a
// natural muted-text style fall back to rendering the two strings
// joined with whitespace.
message Label {
    string text = 1;
    string secondary_text = 2;
}

// Read-only state badge. The 'state' field is semantic -- the frontend
// chooses how to render it (colour, icon, accessibility hint) per its
// platform conventions. The 'text' field is a short caption shown next
// to the indicator.
message Indicator {
    enum State {
        UNKNOWN = 0;
        OK = 1;
        WARN = 2;
        ERROR = 3;
    }
    State state = 1;
    string text = 2;
}

// Bool. Dispatch payload: bool_value.
message Toggle {
    string label = 1;
    bool value = 2;
}

// Fire-only command. Dispatch payload: none (oneof unset).
message Button {
    string label = 1;
    bool enabled = 2;
}

// Enum with a fixed set of options. Dispatch payload: index_value
// (zero-based index into 'options').
message Choice {
    string label = 1;
    repeated string options = 2;
    uint32 selected_index = 3;
}

// Free-form string. Dispatch payload: string_value. Frontends decide
// dispatch timing (per-keystroke vs on-blur); the protocol does not
// constrain that.
message TextInput {
    string label = 1;
    string value = 2;
    string placeholder = 3;
}

// Open-ended choice: pick from a fixed list of options OR type a custom
// value. The semantic mirror of Choice (closed: must be one of the
// options); EditableChoice is open. Renderers map this to the platform's
// idiomatic combobox widget -- macOS NSComboBox, GTK GtkComboBox with
// has_entry, HTML <input list="..."> with a <datalist>, etc.
//
// Dispatch payload: string_value. The string is whatever the user
// committed -- whether they typed it freely or picked it from the
// dropdown is not visible on the wire, and shouldn't matter to the
// extension.
message EditableChoice {
    string label = 1;
    string value = 2;            // current text content
    string placeholder = 3;
    repeated string options = 4; // dropdown content; may be empty
}

// Structural primitive: an ordered sequence of child Controls with an
// optional label. Renderers display children in their toolkit's natural
// vertical flow; nested Groups produce nested sections.
message Group {
    // Absent (oneof not set) means an unlabelled group; renderers should
    // not render a heading. Present-but-empty means an empty heading,
    // which is usually a mistake -- prefer to omit the field entirely.
    optional string label = 1;
    repeated Control controls = 2;
}

// Structural primitive for deferred, atomic editing: an always-visible
// anchor (typically a Label showing the current value) plus an editor
// tree that is revealed on user activation, with a single atomic commit
// event delivered when the user confirms. "Modal" here names the
// interaction model -- a separate scope with deferred commit -- not the
// HIG-strict input-blocking sense; a macOS popover, a Win32 flyout, a
// TUI sub-panel, and an HTML <dialog> all satisfy this model.
//
// Commit semantics are client-buffered: while the editor tree is open,
// its sub-controls hold local frontend state and do NOT dispatch per-
// keystroke / per-selection events. On confirm the frontend bundles all
// sub-control values into a single EditorCommit payload. Cancel is a
// pure client-side discard -- the server never hears about it, because
// it has no state to roll back.
//
// The server gates editability via the 'editable' bool: when false,
// frontends render the anchor as a plain read-only display with no edit
// affordance. Symmetric to Button.enabled.
message ModalEditor {
    // Always-visible display of the current value. Typically a Label;
    // any leaf Control type is valid if you want a richer anchor
    // (e.g. an Indicator showing status alongside a value).
    Control anchor = 1;

    // The editor tree revealed on activation. By convention this is a
    // Group whose children are TextInput / Choice / Toggle leaves, but
    // any Control is accepted. Nested ModalEditors inside the editor
    // tree are discouraged (reason about the interaction first).
    Control editor = 2;

    // False means "display only": the anchor renders as a read-only
    // widget with no affordance to open the editor. True means the
    // frontend attaches an edit affordance appropriate to its platform
    // (pencil button, click-to-edit, etc.).
    bool editable = 3;

    // Semantic role of the commit action. Frontends pick platform-
    // idiomatic wording and styling: macOS "Save"/"Add", iOS "Done"/
    // "Add", Windows "OK"/"Add", GNOME "Apply"/"Add". Keeping this
    // semantic rather than a string lets every frontend localise and
    // match its own conventions; string labels would leak one
    // platform's wording into the vocabulary.
    enum CommitRole {
        SAVE = 0;  // default: committing edits to an existing value
        ADD  = 1;  // creating a new entity (Add peer, Add disc, etc.)
    }
    CommitRole commit_role = 4;

    // When true, the renderer includes an explicit Cancel affordance
    // in addition to any platform-default dismiss (escape / click-
    // outside). macOS popovers dismiss natively, so explicit Cancel
    // is optional; full-window dialogs on other platforms may want it
    // regardless and can synthesise one. Default false means "trust
    // the frontend's default dismiss".
    bool show_cancel = 5;
}

// Collection primitive: a titled list of records with the platform's
// standard add / remove / edit affordances, replacing the Label + Button +
// ModalEditor-per-row shape the first collection panel (#142 AUN) was built
// from. Each item carries its own prefilled editor and its own per-item
// actions, so one EditableList expresses a whole editable table. All user
// actions on the list arrive through one dispatch payload,
// EditableListEvent, keyed by the item's stable id.
message EditableList {
    string title = 1;                 // "Peers", "Subnet rules"
    repeated EditableListItem items = 2;
    bool can_add = 3;                 // shows the platform's "+" affordance
    // The editor Control for a NEW item (fields only; the renderer supplies
    // the commit UI). By convention a Group of TextInput / Choice leaves,
    // mirroring a ModalEditor's editor tree. Committed as an ADD event.
    Control add_editor = 4;
    string empty_text = 5;            // shown when items is empty: "No peers"
}

// One row of an EditableList.
message EditableListItem {
    string id = 1;                    // stable; echoed back in dispatches
    string primary = 2;               // "0.254  192.168.1.10:32768"
    string secondary = 3;             // right-aligned caption: "map file", "mDNS"
    string subtitle = 4;              // beneath, muted: the label "PiEconetBridge FS"
    // Small state badge for the row. UNKNOWN means no indicator; WARN marks,
    // e.g., an unreachable peer. Reuses Indicator.State so the renderer shares
    // one badge style across controls.
    Indicator.State state = 5;
    bool editable = 6;                // edit affordance; `editor` below is prefilled
    bool removable = 7;               // "-" affordance
    Control editor = 8;               // prefilled editor for THIS item, when editable
    repeated EditableListAction actions = 9;  // per-item commands, context menu
    string note = 10;                 // short warning shown with the item, optional
}

// A named per-item command surfaced in the row's context menu. `warning`,
// when set, is the confirmation text the renderer must show before
// dispatching the ACTION; empty means no confirmation.
message EditableListAction {
    string id = 1;
    string title = 2;
    string warning = 3;
}

// Reference primitive: a file on the server's host, shown as a small
// document icon plus display name, with the path as a tooltip, a state
// badge, and a pull-down of the server's actions. The renderer adds its
// own client-side actions (Reveal in Finder, gated on the host fingerprint;
// Copy Path, always). Server actions dispatch as `file_action_id`.
message FileReference {
    string path = 1;                  // absolute, on the server's host
    string display_name = 2;          // "aun-map.json"; defaults to the path's file name
    // OK = loaded; WARN = missing; ERROR = load error. Reuses Indicator.State.
    Indicator.State state = 3;
    string state_text = 4;            // "12 peers, 1 subnet" or the load error
    repeated FileReferenceAction actions = 5;  // server actions: "Reload"
}

// A named server-side action on a FileReference, surfaced in its pull-down.
message FileReferenceAction {
    string id = 1;
    string title = 2;
}

// --- Dispatch ---

message DispatchRequest {
    // Which extension instance the event targets (matches View.extension_id).
    string extension_id = 1;

    // Which control inside that extension's view (matches Control.id).
    string control_id = 2;

    // The view_revision the client was looking at when it generated the
    // event. The server rejects events with a stale revision so that a
    // client cannot act on a control that the server has already
    // replaced in the next pushed View.
    uint64 view_revision = 3;

    // Typed payload, chosen to match the target Control's type:
    //   Toggle      -> bool_value
    //   TextInput   -> string_value
    //   Choice      -> index_value
    //   Button      -> none (leave the oneof unset)
    //   ModalEditor -> editor_commit (one atomic bundle of sub-control
    //                  values; see EditorCommit)
    //   EditableList -> editable_list_event (add / edit / remove / action
    //                  on one item; see EditableListEvent)
    //   FileReference -> file_action_id (the id of the server action chosen
    //                  from the pull-down)
    //
    // Validation: the server rejects requests whose payload variant
    // does not match the addressed control's type.
    oneof payload {
        bool              bool_value          = 4;
        string            string_value        = 5;
        uint32            index_value         = 6;
        EditorCommit      editor_commit       = 7;
        EditableListEvent editable_list_event = 8;
        string            file_action_id      = 9;
    }
}

// The user's action on one EditableList item. ADD carries no item_id and an
// `commit` built from the list's add_editor; EDIT carries the item_id and an
// `commit` from that item's editor; REMOVE carries just the item_id; ACTION
// carries the item_id and the chosen action_id (and no commit). The server
// validates item_id / action_id against the current view like any other
// dispatch, and applies an ADD / EDIT commit with the same no-partial rule as
// EditorCommit.
message EditableListEvent {
    enum Kind {
        ADD    = 0;
        EDIT   = 1;
        REMOVE = 2;
        ACTION = 3;
    }
    Kind kind = 1;
    string item_id = 2;               // empty for ADD
    string action_id = 3;             // for ACTION
    EditorCommit commit = 4;          // for ADD and EDIT: the editor field values
}

// One field's value inside an EditorCommit. The 'field_id' names a
// sub-control inside the ModalEditor's editor tree (matches the
// Control.id of that leaf). The payload variant must match the
// addressed sub-control's type (see EditorCommit validation below).
message EditorFieldValue {
    string field_id = 1;
    oneof value {
        bool   bool_value   = 2;
        string string_value = 3;
        uint32 index_value  = 4;
    }
}

// Atomic commit of a ModalEditor's editor tree. Sent as the payload of
// a DispatchRequest targeting a ModalEditor control.
//
// Clients bundle the final value of each sub-control whose value the
// user changed (or all sub-controls -- either is accepted). The server
// validates that every field_id names a sub-control actually present in
// the editor tree and that each value variant matches the sub-control's
// type; any violation rejects the whole commit (no partial applies).
message EditorCommit {
    repeated EditorFieldValue fields = 1;
}

message DispatchResponse {
    // True if the event was accepted and handle_event ran. False means
    // the request was rejected by the validation gauntlet -- 'error'
    // describes why (stale event, unknown control, payload-type
    // mismatch, unknown extension).
    bool   accepted = 1;
    string error    = 2;
}
