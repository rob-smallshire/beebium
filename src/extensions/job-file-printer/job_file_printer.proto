syntax = "proto3";

package beebium;

service JobFilePrinter {
    // The directory, the job being written and the counts.
    rpc GetStatus(JobFilePrinterGetStatusRequest) returns (JobFilePrinterStatus);
}

message JobFilePrinterGetStatusRequest {}

message JobFilePrinterStatus {
    string directory = 1;          // where job files are written
    string current_job_file = 2;   // the job file being written, or empty between jobs
    uint64 bytes_in_job = 3;       // bytes written to the current job file
    uint64 jobs_completed = 4;     // jobs ended since launch
    uint64 total_bytes = 5;        // bytes written to all job files, after line-ending translation
}
