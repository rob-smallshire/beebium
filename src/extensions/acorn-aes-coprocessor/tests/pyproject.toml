# AESulator: the Acorn ARM Evaluation System, a Beebium plugin.
# pyproject.toml, the Python tests' package settings
# version 2.0.0, 20 November 2026.

# The Python tests, in the form of Beebium's own scenario suites (SRC, integration_tests/tube-save).
# The path holds in Beebium's tree, at src/extensions/acorn-aes-coprocessor/tests, where they run.

[project]
name = "aes-coprocessor-tests"
version = "2.0.0"
description = "Tests of the AES plugin for Beebium"
requires-python = ">=3.12"
dependencies = [
    "beebium",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
beebium = { path = "../../../../clients/beebium-python-client", editable = true }
