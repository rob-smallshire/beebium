syntax = "proto3";

package beebium;

// AUN-specific service. Lives alongside the AunEconetTransportExtension
// in src/extensions/aun/ and is served via that extension's AunDispatcher
// over the core's ExtensionRpc channel (no gRPC stub is compiled from this
// service block). It is reachable only when AUN is the active transport.
//
// EconetService remains the place for transport-agnostic Econet RPCs
// (status, station ID, enable/disable). Anything that only makes sense
// for AUN (peer table management, AUN-port reporting, the cable-plug
// simulation that drives DCD) lives here.
service AunService {
    // Connect or disconnect the simulated network cable. While
    // disconnected the ADLC sees DCD high (no carrier).
    rpc SetConnected(AunSetConnectedRequest) returns (AunSetConnectedResponse);

    // Add an Econet address <-> UDP endpoint peer mapping.
    rpc AddPeer(AunAddPeerRequest) returns (AunAddPeerResponse);

    // Remove a peer mapping by Econet address.
    rpc RemovePeer(AunRemovePeerRequest) returns (AunRemovePeerResponse);

    // Enumerate all configured peers.
    rpc ListPeers(AunListPeersRequest) returns (AunListPeersResponse);

    // Read the current AUN backend status (port, peer count, link state).
    rpc GetStatus(AunGetStatusRequest) returns (AunGetStatusResponse);
}

// --- Status ---

message AunGetStatusRequest {
    // Empty.
}

message AunGetStatusResponse {
    // True if the AUN UDP socket is bound and the cable is connected.
    bool connected = 1;

    // The local UDP port the AUN backend is bound to (0 if none).
    uint32 local_port = 2;

    // Number of peers configured in the peer table.
    uint32 peer_count = 3;
}

// --- Cable plug ---

message AunSetConnectedRequest {
    // True to plug in the cable, false to unplug it.
    bool connected = 1;
}

message AunSetConnectedResponse {
    bool success = 1;
    string error = 2;
}

// --- Peer table ---

message AunAddPeerRequest {
    // Econet network number (0-127).
    uint32 net = 1;

    // Econet station number (1-254).
    uint32 stn = 2;

    // Dotted-quad IP address (e.g. "192.168.1.100").
    string ip_address = 3;

    // UDP port (0 = use AUN default 32768).
    uint32 port = 4;
}

message AunAddPeerResponse {
    bool success = 1;
    string error = 2;
}

message AunRemovePeerRequest {
    uint32 net = 1;
    uint32 stn = 2;
}

message AunRemovePeerResponse {
    bool success = 1;
    string error = 2;
}

message AunListPeersRequest {
    // Empty.
}

message AunListPeersResponse {
    repeated AunPeer peers = 1;
}

// Where a peer entry came from, mirroring the AunPeerProvenance the AUN
// transport resolves by. The three operator sources (Launch, Api, MapFile)
// all take precedence over Discovered, in the order Api > Launch > MapFile;
// a discovered announcement that claims a (net, stn) an operator source
// already holds is shadowed rather than displacing it. Named AunPeerSource
// so the proto-generated C++ symbol does not collide with the transport's
// beebium::AunPeerProvenance enum class.
enum AunPeerSource {
    // Default for uninitialised messages; no source should emit it.
    AUN_PEER_SOURCE_UNSPECIFIED = 0;

    // Added via --aun map= or the preset's econet.transport.parameters
    // for this launch.
    AUN_PEER_SOURCE_LAUNCH = 1;

    // Added at runtime via AunService::AddPeer.
    AUN_PEER_SOURCE_API = 2;

    // Read from the per-user aun-map.json (reserved for the map-file step).
    AUN_PEER_SOURCE_MAP_FILE = 3;

    // Added by the AUN extension's mDNS subscriber from a
    // _aun._udp announcement on the LAN.
    AUN_PEER_SOURCE_DISCOVERED = 4;

    // Materialised from a subnets rule in the map file (an inbound sender
    // identified, or an outbound guess). Lowest precedence; Discovered wins.
    AUN_PEER_SOURCE_SUBNET = 5;
}

message AunPeer {
    uint32 net = 1;
    uint32 stn = 2;
    string ip_address = 3;
    uint32 port = 4;
    // Provenance of this resolved entry (the source it won from). Clients
    // present it in the AUN panel's secondary text: "launch", "API",
    // "map file" or "mDNS".
    AunPeerSource source = 5;
}
