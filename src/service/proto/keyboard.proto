syntax = "proto3";

package beebium;

// BBC keyboard matrix input service
service KeyboardService {
    // Press/release by matrix position (momentary key events)
    rpc KeyDown(KeyRequest) returns (KeyResponse);
    rpc KeyUp(KeyRequest) returns (KeyResponse);

    // Query current pressed keys
    rpc GetState(GetStateRequest) returns (KeyboardState);

    // =========================================================================
    // Keyboard Links (DIP switches)
    // =========================================================================
    // These are persistent configuration settings, not momentary key events.
    // The 8 links form a startup options byte read by MOS at reset.

    // Raw byte access to all 8 links
    rpc SetLinks(SetLinksRequest) returns (SetLinksResponse);
    rpc GetLinks(GetLinksRequest) returns (LinksState);

    // Semantic accessors for specific link groups
    rpc SetStartupScreenMode(SetStartupScreenModeRequest) returns (SetStartupScreenModeResponse);
    rpc GetStartupScreenMode(GetStartupScreenModeRequest) returns (StartupScreenModeState);
    rpc SetStartupAutoBoot(SetStartupAutoBootRequest) returns (SetStartupAutoBootResponse);
    rpc GetStartupAutoBoot(GetStartupAutoBootRequest) returns (StartupAutoBootState);

    // =========================================================================
    // Break Key (Reset)
    // =========================================================================
    // The Break key is NOT part of the keyboard matrix. It is directly
    // connected to the reset circuit (IC16 NE555 timer) via pin 4.
    //
    // While Break is held: CPU is halted (reset line held low)
    // On Break release: Soft reset sequence begins
    //
    // Note: Hardware always does a soft reset. MOS checks if Ctrl is held
    // during its reset sequence to decide between warm/cold reset behavior.

    // Hold Break key (halt CPU)
    rpc BreakDown(BreakDownRequest) returns (BreakDownResponse);

    // Release Break key (begin soft reset)
    rpc BreakUp(BreakUpRequest) returns (BreakUpResponse);

    // Query Break key state
    rpc GetBreakState(GetBreakStateRequest) returns (BreakKeyState);

    // Query CAPS LOCK / SHIFT LOCK logical state.
    //
    // Returns the MOS-maintained latch bits that also drive the lock LEDs.
    // Unlike the lock-LED brightness published by IndicatorService -- which is
    // duty-cycle filtered over a wall-clock window for human persistence of
    // vision -- this is the exact logical state and is correct at any emulation
    // speed. Automation that needs to know whether a lock is engaged should use
    // this rather than inferring it from filtered brightness.
    rpc GetLockState(GetLockStateRequest) returns (LockKeyState);

    // =========================================================================
    // Type-ahead (TypeQuickly)
    // =========================================================================
    // Non-blocking text input that types strings at machine speed.
    // Text is queued and typed character-by-character as the emulator runs.

    // Enqueue text to type at machine speed (non-blocking)
    rpc TypeQuickly(TypeQuicklyRequest) returns (TypeQuicklyResponse);

    // Query typing status
    rpc GetTypingStatus(GetTypingStatusRequest) returns (TypingStatus);

    // Clear pending typing
    rpc ClearTyping(ClearTypingRequest) returns (ClearTypingResponse);

    // =========================================================================
    // Character-to-key mapping
    // =========================================================================
    // Query the canonical character-to-key mapping table.

    // Get mapping for a single character
    rpc GetKeyMapping(GetKeyMappingRequest) returns (KeyMappingEntry);

    // Get complete mapping table (for client caching)
    rpc GetAllKeyMappings(GetAllKeyMappingsRequest) returns (AllKeyMappingsResponse);
}

message KeyRequest {
    // Internal key number: row is hi-nybble, column is lo-nybble
    // giving 0x<row><column> in hexadecimal (e.g., 'V' = 0x63)
    uint32 ik_number = 1;
}

message KeyResponse {
    bool accepted = 1;
}

message GetStateRequest {}

message KeyboardState {
    // Bitmap of pressed keys (10 rows)
    repeated uint32 pressed_rows = 1;
}

// ============================================================================
// Keyboard Links (DIP switches)
// ============================================================================
//
// The BBC Micro has 8 keyboard links (row 0, columns 2-9) that form a startup
// options byte. Active-low: bit SET = link broken (open), bit CLEAR = link made.
//
// Bit layout:
//   Bits 0-2: Screen mode (XOR'd with 7 by MOS, so 0x07 = Mode 7)
//   Bit 3: SHIFT-BREAK action (1 = normal, 0 = reversed)
//   Bits 4-7: ROM-dependent (disc timing, filing system, etc.)
//
// Default value 0xFF (all links broken) = Mode 7, normal SHIFT-BREAK.

// --- Raw byte access ---

message SetLinksRequest {
    uint32 value = 1;  // 8-bit value (0-255)
}

message SetLinksResponse {
    bool success = 1;
    string error = 2;
}

message GetLinksRequest {}

message LinksState {
    uint32 value = 1;  // Current 8-bit links value
}

// --- Startup Screen Mode (bits 0-2) ---

message SetStartupScreenModeRequest {
    uint32 mode = 1;  // 0-7
}

message SetStartupScreenModeResponse {
    bool success = 1;
    string error = 2;
}

message GetStartupScreenModeRequest {}

message StartupScreenModeState {
    uint32 mode = 1;  // Current mode (0-7)
}

// --- Startup Auto-Boot (bit 3) ---

message SetStartupAutoBootRequest {
    bool enabled = 1;  // true = SHIFT-BREAK boots (bit 3 cleared)
}

message SetStartupAutoBootResponse {
    bool success = 1;
    string error = 2;
}

message GetStartupAutoBootRequest {}

message StartupAutoBootState {
    bool enabled = 1;  // true if bit 3 is cleared
}

// ============================================================================
// Break Key (Reset)
// ============================================================================
//
// The Break key is directly connected to the reset circuit, not the keyboard
// matrix. It provides direct hardware reset control.

message BreakDownRequest {}

message BreakDownResponse {
    bool success = 1;       // Always true unless emulator error
}

message BreakUpRequest {}

message BreakUpResponse {
    bool success = 1;       // Always true unless emulator error
}

message GetBreakStateRequest {}

message BreakKeyState {
    bool is_held = 1;       // True if Break key is currently held
}

message GetLockStateRequest {}

message LockKeyState {
    bool caps_lock_on = 1;   // True if CAPS LOCK is currently engaged
    bool shift_lock_on = 2;  // True if SHIFT LOCK is currently engaged
}

// ============================================================================
// Type-ahead (TypeQuickly)
// ============================================================================

// Enqueue text for typing at machine speed (non-blocking, returns immediately)
message TypeQuicklyRequest {
    string text = 1;              // UTF-8 string to type
    // No timing knob: the server paces keystrokes reliably on its own.
    // For deliberate custom timing, drive KeyDown/KeyUp directly instead.

    // Translate host text conventions into what the BBC keyboard can type:
    // line endings normalised to CR, typographic punctuation folded to ASCII,
    // and SAA5050 teletext glyphs mapped back to the codes that produce them.
    //
    // Defaults to true when unset, which is what interactive pasting wants.
    // Set false to type the text exactly as given, and note that CRLF then
    // presses Return twice because both CR and LF are Return.
    optional bool translate = 2;
}

message TypeQuicklyResponse {
    bool accepted = 1;            // True if text was enqueued
    string error = 2;             // Error message if not accepted (e.g., unmappable char)
    uint32 pending_characters = 3; // Total chars now pending in queue
}

// Query typing status
message GetTypingStatusRequest {}

message TypingStatus {
    bool idle = 1;                // True if queue is empty (all typing complete)
    uint32 pending_characters = 2; // Characters remaining to type
    uint32 strings_queued = 3;    // Number of strings in queue
}

// Clear typing queue
message ClearTypingRequest {}

message ClearTypingResponse {
    uint32 characters_cleared = 1; // Number of characters that were pending
}

// ============================================================================
// Character-to-key mapping
// ============================================================================

// Query mapping for a single character
message GetKeyMappingRequest {
    string character = 1;         // Single UTF-8 character
}

// Get entire mapping table (for client caching)
message GetAllKeyMappingsRequest {}

// Key mapping entry - used for both single lookups and bulk queries
message KeyMappingEntry {
    bool found = 1;               // True if mapping exists (always true in bulk queries)
    string character = 2;         // UTF-8 character (empty for named-only keys)
    uint32 ik_number = 3;         // Internal key number (row << 4 | column)
    bool needs_shift = 4;         // True if SHIFT required
    string name = 5;              // Key name (e.g., "A", "Return", "f0", "Up")
}

message AllKeyMappingsResponse {
    repeated KeyMappingEntry mappings = 1;
}
