syntax = "proto3";

package beebium;

// Generic debugger service for 6502-based machines.
// Can be instantiated for both host (Machine<Hardware>) and parasite (ParasiteRunner).
service DebuggerControl {
    // Execution control
    rpc GetState(Empty) returns (ExecutionState);
    rpc Run(Empty) returns (RunResponse);
    rpc Stop(Empty) returns (StopResponse);
    rpc Reset(Empty) returns (ResetResponse);
    rpc StepInstruction(StepRequest) returns (StepResponse);
    rpc StepCycle(StepRequest) returns (StepResponse);

    // Event streaming
    rpc WatchExecutionState(WatchExecutionStateRequest)
        returns (stream ExecutionStateEvent);

    // Memory access (16-bit address space)
    rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
    rpc WriteMemory(WriteMemoryRequest) returns (WriteMemoryResponse);
    rpc PeekMemory(PeekMemoryRequest) returns (PeekMemoryResponse);

    // Memory region access (named regions: shadow RAM, ANDY, banks, etc.)
    rpc GetMemoryRegions(GetMemoryRegionsRequest) returns (GetMemoryRegionsResponse);
    rpc PeekRegion(RegionAccessRequest) returns (RegionAccessResponse);
    rpc ReadRegion(RegionAccessRequest) returns (RegionAccessResponse);
    rpc WriteRegion(WriteRegionRequest) returns (WriteRegionResponse);

    // Breakpoints (shared list)
    rpc AddBreakpoint(AddBreakpointRequest) returns (AddBreakpointResponse);
    rpc RemoveBreakpoint(RemoveBreakpointRequest) returns (RemoveBreakpointResponse);
    rpc EnableBreakpoint(EnableBreakpointRequest) returns (EnableBreakpointResponse);
    rpc ListBreakpoints(Empty) returns (ListBreakpointsResponse);
    rpc ClearBreakpoints(Empty) returns (ClearBreakpointsResponse);

    // Watchpoints (address range + access type)
    rpc AddWatchpoint(AddWatchpointRequest) returns (AddWatchpointResponse);
    rpc RemoveWatchpoint(RemoveWatchpointRequest) returns (RemoveWatchpointResponse);
    rpc EnableWatchpoint(EnableWatchpointRequest) returns (EnableWatchpointResponse);
    rpc ListWatchpoints(Empty) returns (ListWatchpointsResponse);
    rpc ClearWatchpoints(Empty) returns (ClearWatchpointsResponse);

    // CPU state (family-agnostic register model). The CPU describes itself
    // (GetCpuDescriptor); the state is name/value pairs in descriptor order.
    // SetCpuState accepts any subset of registers by name and returns the
    // full state.
    rpc GetCpuDescriptor(Empty) returns (CpuDescriptor);
    rpc GetCpuState(Empty) returns (CpuState);
    rpc SetCpuState(CpuState) returns (CpuState);
}

// Parasite (second processor) debugger service.
// Same RPCs as DebuggerControl but registered under a distinct service name
// so both can coexist on the same gRPC server.
service ParasiteDebuggerControl {
    rpc GetState(Empty) returns (ExecutionState);
    rpc Run(Empty) returns (RunResponse);
    rpc Stop(Empty) returns (StopResponse);
    rpc Reset(Empty) returns (ResetResponse);
    rpc StepInstruction(StepRequest) returns (StepResponse);
    rpc StepCycle(StepRequest) returns (StepResponse);
    rpc WatchExecutionState(WatchExecutionStateRequest)
        returns (stream ExecutionStateEvent);
    rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
    rpc WriteMemory(WriteMemoryRequest) returns (WriteMemoryResponse);
    rpc PeekMemory(PeekMemoryRequest) returns (PeekMemoryResponse);
    rpc GetMemoryRegions(GetMemoryRegionsRequest) returns (GetMemoryRegionsResponse);
    rpc PeekRegion(RegionAccessRequest) returns (RegionAccessResponse);
    rpc ReadRegion(RegionAccessRequest) returns (RegionAccessResponse);
    rpc WriteRegion(WriteRegionRequest) returns (WriteRegionResponse);
    rpc AddBreakpoint(AddBreakpointRequest) returns (AddBreakpointResponse);
    rpc RemoveBreakpoint(RemoveBreakpointRequest) returns (RemoveBreakpointResponse);
    rpc EnableBreakpoint(EnableBreakpointRequest) returns (EnableBreakpointResponse);
    rpc ListBreakpoints(Empty) returns (ListBreakpointsResponse);
    rpc ClearBreakpoints(Empty) returns (ClearBreakpointsResponse);
    rpc AddWatchpoint(AddWatchpointRequest) returns (AddWatchpointResponse);
    rpc RemoveWatchpoint(RemoveWatchpointRequest) returns (RemoveWatchpointResponse);
    rpc EnableWatchpoint(EnableWatchpointRequest) returns (EnableWatchpointResponse);
    rpc ListWatchpoints(Empty) returns (ListWatchpointsResponse);
    rpc ClearWatchpoints(Empty) returns (ClearWatchpointsResponse);
    rpc GetCpuDescriptor(Empty) returns (CpuDescriptor);
    rpc GetCpuState(Empty) returns (CpuState);
    rpc SetCpuState(CpuState) returns (CpuState);
}

// BBC Micro device state inspection.
// Only available on the host; parasite returns UNIMPLEMENTED for all RPCs.
service DeviceInspection {
    rpc GetSystemViaState(GetSystemViaStateRequest) returns (ViaState);
    rpc GetUserViaState(GetUserViaStateRequest) returns (ViaState);
    rpc GetCrtcState(GetCrtcStateRequest) returns (CrtcState);
    rpc GetVideoUlaState(GetVideoUlaStateRequest) returns (VideoUlaState);
    rpc GetAddressableLatchState(GetAddressableLatchStateRequest) returns (AddressableLatchState);
    rpc GetSoundGeneratorState(GetSoundGeneratorStateRequest) returns (SoundGeneratorState);
    rpc GetTubeState(GetTubeStateRequest) returns (TubeState);
}

message Empty {}

message ExecutionState {
    bool is_running = 1;
    uint64 cycle_count = 2;
    string halt_reason = 3;
    uint64 sequence = 4;
}

message RunResponse {
    bool success = 1;
    string error = 2;
}

message StopResponse {
    bool success = 1;
    ExecutionState state = 2;
}

message ResetResponse {
    bool success = 1;
}

message StepRequest {
    uint32 count = 1;
}

message StepResponse {
    bool success = 1;
    string error = 2;
    uint32 instructions_executed = 3;
    uint64 cycles_executed = 4;
    ExecutionState state = 5;
}

message WatchExecutionStateRequest {}

enum StopReason {
    STOP_REASON_UNKNOWN = 0;
    STOP_REASON_BREAKPOINT = 1;
    STOP_REASON_MANUAL = 2;
    STOP_REASON_ERROR = 3;
    STOP_REASON_STEP_COMPLETE = 4;
    STOP_REASON_WATCHPOINT = 5;
    STOP_REASON_COUNTERPART = 6;
}

enum WatchpointType {
    WATCHPOINT_READ = 0;
    WATCHPOINT_WRITE = 1;
    WATCHPOINT_BOTH = 2;
}

message ExecutionStateEvent {
    StopReason reason = 1;
    ExecutionState state = 2;
    string message = 3;
    WatchpointHitInfo watchpoint_hit = 4;
}

message WatchpointHitInfo {
    uint32 watchpoint_id = 1;
    uint32 address = 2;
    uint32 value = 3;
    bool is_write = 4;
}

message ReadMemoryRequest {
    uint32 address = 1;
    uint32 length = 2;
    // Simulated PC for B+ shadow RAM routing. When set, memory access is
    // routed as if code at this PC were executing. On Model B+ with shadow
    // enabled, VDU driver code (0xC000-0xDFFF or paged RAM 0xA000-0xAFFF)
    // sees shadow RAM at 0x3000-0x7FFF; other code sees main RAM.
    optional uint32 simulated_pc = 3;
}

message ReadMemoryResponse {
    bytes data = 1;
}

message PeekMemoryRequest {
    uint32 address = 1;
    uint32 length = 2;
    // Simulated PC for B+ shadow RAM routing. See ReadMemoryRequest.
    optional uint32 simulated_pc = 3;
}

message PeekMemoryResponse {
    bytes data = 1;
}

message WriteMemoryRequest {
    uint32 address = 1;
    bytes data = 2;
    // Simulated PC for B+ shadow RAM routing. See ReadMemoryRequest.
    optional uint32 simulated_pc = 3;
}

message WriteMemoryResponse {
    bool success = 1;
}

message AddBreakpointRequest {
    uint32 start_address = 1;          // start of range (inclusive)
    uint32 end_address = 2;            // end of range (exclusive); 0 means start+1 (single address)
    bool stop_counterpart = 3;
    string condition = 4;              // optional condition expression (use `hits` for hit counts)
    optional bool enabled = 5;         // absent means enabled (default true)
}

message AddBreakpointResponse {
    bool success = 1;
    uint32 id = 2;
}

message RemoveBreakpointRequest {
    uint32 id = 1;
}

message RemoveBreakpointResponse {
    bool success = 1;
}

message ListBreakpointsResponse {
    repeated Breakpoint breakpoints = 1;
}

message Breakpoint {
    uint32 id = 1;
    uint32 start_address = 2;
    uint32 end_address = 3;
    string condition = 4;
    bool stop_counterpart = 5;
    uint64 hit_count = 6;
    bool enabled = 7;
}

message EnableBreakpointRequest {
    uint32 id = 1;
    bool enabled = 2;
}

message EnableBreakpointResponse {
    bool success = 1;
}

message ClearBreakpointsResponse {
    uint32 count_removed = 1;
}

// === Watchpoints ===

message AddWatchpointRequest {
    uint32 start_address = 1;
    uint32 end_address = 2;     // exclusive [start, end)
    WatchpointType type = 3;
    bool stop_counterpart = 4;
    string condition = 5;              // optional condition expression (use `hits` for hit counts)
    optional bool enabled = 6;         // absent means enabled (default true)
}

message AddWatchpointResponse {
    bool success = 1;
    uint32 id = 2;
}

message RemoveWatchpointRequest {
    uint32 id = 1;
}

message RemoveWatchpointResponse {
    bool success = 1;
}

message ListWatchpointsResponse {
    repeated WatchpointInfo watchpoints = 1;
}

message WatchpointInfo {
    uint32 id = 1;
    uint32 start_address = 2;
    uint32 end_address = 3;
    WatchpointType type = 4;
    string condition = 5;
    bool stop_counterpart = 6;
    uint64 hit_count = 7;
    bool enabled = 8;
}

message EnableWatchpointRequest {
    uint32 id = 1;
    bool enabled = 2;
}

message EnableWatchpointResponse {
    bool success = 1;
}

message ClearWatchpointsResponse {
    uint32 count_removed = 1;
}

// === Family-agnostic CPU register model ===
//
// The coprocessor (and the host's own CPU) describe themselves so the
// protos, the server and the clients need not name a CPU family. The
// descriptor lists the registers in display order and the interrupt
// signals; the state carries values in the same order.

enum RegisterRole {
    REGISTER_ROLE_NONE = 0;
    PROGRAM_COUNTER = 1;
    STACK_POINTER = 2;
    FLAGS = 3;
}

message RegisterDescriptor {
    string name = 1;                 // "A", "PC", "HL", "SP", "P"
    uint32 width_bits = 2;
    RegisterRole role = 3;
    repeated string flag_names = 4;  // for FLAGS: bit 0 first, "" for unused
}

message CpuDescriptor {
    string family = 1;               // "6502", "z80", "6809", "ns32016", "80186"
    uint32 address_bits = 2;         // 16, 24, 32
    bool little_endian = 3;
    repeated RegisterDescriptor registers = 4;  // display order
    repeated string signals = 5;     // interrupt line names, e.g. "IRQ", "NMI"
}

message RegisterValue {
    string name = 1;
    uint64 value = 2;
}

message SignalState {
    string name = 1;
    bool asserted = 2;
    bool pending = 3;
    bool in_handler = 4;
}

message CpuState {
    repeated RegisterValue registers = 1;  // descriptor order (subset for SetCpuState)
    repeated SignalState signals = 2;       // descriptor.signals order
    uint64 cycle_count = 3;
}

// Memory region discovery and access messages

message GetMemoryRegionsRequest {}

message MemoryRegionInfo {
    string name = 1;           // Region identifier (e.g., "main_ram", "bank_0")
    uint32 base_address = 2;   // Base address in CPU address space
    uint32 size = 3;           // Size in bytes
    bool readable = 4;         // Can be read
    bool writable = 5;         // Can be written
    bool has_side_effects = 6; // read() may differ from peek()
    bool populated = 7;        // Has content (for optional banks)
    bool active = 8;           // Currently selected (for banks)
}

message GetMemoryRegionsResponse {
    string machine_type = 1;              // "ModelB", "ModelBPlus", etc.
    repeated MemoryRegionInfo regions = 2;
}

message RegionAccessRequest {
    string region_name = 1;  // Region to access
    uint32 address = 2;      // Absolute address (must be within region bounds)
    uint32 length = 3;       // Number of bytes to read
}

message RegionAccessResponse {
    bytes data = 1;
}

message WriteRegionRequest {
    string region_name = 1;
    uint32 address = 2;      // Absolute address (must be within region bounds)
    bytes data = 3;
}

message WriteRegionResponse {
    bool success = 1;
    string error = 2;
}

// =============================================================================
// Device State Inspection Messages
// =============================================================================

// === VIA 6522 ===

message GetSystemViaStateRequest {}
message GetUserViaStateRequest {}

message ViaState {
    // Port state
    uint32 ora = 1;       // Output Register A
    uint32 orb = 2;       // Output Register B
    uint32 ddra = 3;      // Data Direction Register A
    uint32 ddrb = 4;      // Data Direction Register B
    uint32 ira = 5;       // Input Register A (computed: port pins masked by DDR)
    uint32 irb = 6;       // Input Register B (computed: port pins masked by DDR)

    // Timer 1 (16-bit free-running or one-shot)
    uint32 t1c = 7;       // Timer 1 counter (16-bit, effective value)
    uint32 t1l = 8;       // Timer 1 latch (16-bit)

    // Timer 2 (16-bit one-shot or pulse counting)
    uint32 t2c = 9;       // Timer 2 counter (16-bit, effective value)
    uint32 t2l = 10;      // Timer 2 latch low (8-bit, high byte not latched)

    // Control registers
    uint32 acr = 11;      // Auxiliary Control Register
    uint32 pcr = 12;      // Peripheral Control Register
    uint32 sr = 13;       // Shift Register

    // Interrupt registers
    uint32 ifr = 14;      // Interrupt Flag Register
    uint32 ier = 15;      // Interrupt Enable Register

    // Internal state (not directly memory-mapped)
    bool t1_pending = 16; // Timer 1 active and can generate IRQ
    bool t2_pending = 17; // Timer 2 active and can generate IRQ
    uint32 t1_pb7 = 18;   // PB7 output state from Timer 1 (when ACR bit 7 set)

    // Control lines
    bool ca1 = 19;
    bool ca2 = 20;
    bool cb1 = 21;
    bool cb2 = 22;
}

// === CRTC 6845 ===

message GetCrtcStateRequest {}

message CrtcState {
    // All 18 registers (R0-R17, includes write-only timing registers)
    repeated uint32 registers = 1;

    // Currently selected register (address register)
    uint32 address_register = 2;

    // Internal timing counters
    uint32 column = 3;        // Horizontal character position (0 to R0)
    uint32 row = 4;           // Vertical character row (0 to R4)
    uint32 raster = 5;        // Scanline within character row (0 to R9)
    uint32 char_addr = 6;     // Current character address (MA0-MA13)

    // Computed values (convenience)
    uint32 screen_start = 7;  // R12/R13: Display start address
    uint32 cursor_position = 8; // R14/R15: Cursor address

    // Sync state
    bool in_hsync = 9;
    bool in_vsync = 10;
    bool display_enabled = 11;
}

// === Video ULA ===

message GetVideoUlaStateRequest {}

message VideoUlaState {
    // Control register (0xFE20)
    uint32 control = 1;

    // Palette (16 entries, logical colour -> physical colour)
    // Written via 0xFE21, not directly readable by CPU
    repeated uint32 palette = 2;
}

// === Addressable Latch (IC32 74LS259 on Model B) ===

message GetAddressableLatchStateRequest {}

message AddressableLatchState {
    // Raw 8-bit latch value
    uint32 value = 1;

    // Decoded fields for convenience
    uint32 screen_base = 2;       // Bits 4-5: Screen memory base address select
    bool sound_write_enable = 3;  // Bit 0: Active low
    bool speech_read = 4;         // Bit 1: Active low
    bool speech_write = 5;        // Bit 2: Active low
    bool keyboard_write = 6;      // Bit 3: Active low
    bool caps_lock_led = 7;       // Bit 6: Active low (accent grave on keyboard)
    bool shift_lock_led = 8;      // Bit 7: Active low
}

// === Sound Generator SN76489 ===

message GetSoundGeneratorStateRequest {
    // No parameters - always returns chip-native ordering
}

message SoundGeneratorState {
    repeated SoundChannelState channels = 1;
    uint32 latched_register = 2;  // Currently latched register (0-7)
}

message SoundChannelState {
    uint32 channel_id = 1;        // Channel index (depends on view)
    string channel_name = 2;      // "Tone0"/"Noise" (native) or "0"/"1"/"2"/"3" (MOS)

    // Tone channel state
    uint32 frequency_divider = 3; // 10-bit divider value (0-1023)
    uint32 counter = 4;           // Current countdown value
    bool output_bit = 5;          // Square wave polarity
    uint32 volume = 6;            // 4-bit attenuation (0=max, 15=silent)
    float frequency_hz = 7;       // Computed output frequency

    // Noise channel state (only valid for noise channel)
    uint32 noise_rate = 8;        // 2-bit rate select (0-3, where 3=Tone2)
    bool white_noise = 9;         // true=white noise, false=periodic
    uint32 lfsr_state = 10;       // 15-bit LFSR state
}

// === Tube ULA ===

message GetTubeStateRequest {}

// Complete Tube ULA state, modelling the real hardware's registers, FIFOs,
// latches, control flags, and interrupt outputs.
//
// The Tube ULA has four register pairs (R1-R4), each with a host-to-parasite
// (H-to-P) and parasite-to-host (P-to-H) direction. Each direction uses
// specific hardware: latches, FIFOs, or 2-byte shift registers.
//
// Status bits are provided from both host and parasite perspectives, since
// each side sees different views of the same registers.
message TubeState {
    // Control flags (6 bits, written by host via R1 status register).
    TubeControlFlags control_flags = 1;

    // Register 1: H-to-P is a 1-byte latch; P-to-H is a 24-byte FIFO.
    TubeLatchState r1_h2p = 2;      // Host-to-parasite latch
    TubeFifo24State r1_p2h = 3;     // Parasite-to-host 24-byte FIFO

    // Register 2: 1-byte latch in each direction (no bus stretching).
    TubeLatchState r2_h2p = 4;
    TubeLatchState r2_p2h = 5;

    // Register 3: 2-byte shift register in each direction.
    // Threshold mode (1 or 2 bytes) is selected by the V flag.
    TubeReg3State r3_h2p = 6;
    TubeReg3State r3_p2h = 7;

    // Register 4: 1-byte latch in each direction.
    TubeLatchState r4_h2p = 8;
    TubeLatchState r4_p2h = 9;

    // Status registers (as read by host at offsets 0/2/4/6).
    TubeHostStatus host_status = 10;

    // Status registers (as read by parasite at offsets 0/2/4/6).
    TubeParasiteStatus parasite_status = 11;

    // Interrupt outputs.
    TubeInterrupts interrupts = 12;

    // Bus stretching state.
    bool host_stretched = 13;

    // Whether the Tube socket is populated (has a second processor attached).
    bool enabled = 14;

    // Per-register transfer counters (bytes transferred since reset).
    TubeTransferCounters counters = 15;

    // Protocol trace: last N register data events (ring buffer, oldest first).
    // Each entry is a tag byte (register/direction/side) and a data byte.
    repeated TubeTraceEntry trace = 16;
    uint64 trace_total_count = 17;
}

// A single entry in the Tube protocol trace ring buffer.
message TubeTraceEntry {
    uint32 tag = 1;    // bits 7-4: register (1-4), bit 3: dir (0=H2P,1=P2H), bit 2: side (0=host,1=parasite)
    uint32 value = 2;  // data byte
}

// Per-register byte transfer counters for Tube diagnostics.
// Each counter records total bytes written or read for a register direction.
// Stored in shared memory so both host and parasite can read all counters.
message TubeTransferCounters {
    // Host-to-parasite direction
    uint64 r1_h2p_writes = 1;
    uint64 r1_h2p_reads = 2;
    uint64 r2_h2p_writes = 3;
    uint64 r2_h2p_reads = 4;
    uint64 r3_h2p_writes = 5;
    uint64 r3_h2p_reads = 6;
    uint64 r4_h2p_writes = 7;
    uint64 r4_h2p_reads = 8;

    // Parasite-to-host direction
    uint64 r1_p2h_writes = 9;
    uint64 r1_p2h_reads = 10;
    uint64 r2_p2h_writes = 11;
    uint64 r2_p2h_reads = 12;
    uint64 r3_p2h_writes = 13;
    uint64 r3_p2h_reads = 14;
    uint64 r4_p2h_writes = 15;
    uint64 r4_p2h_reads = 16;
}

// Tube ULA control flags (bits 0-5 of the control register).
message TubeControlFlags {
    bool q = 1;   // Bit 0: Enable HIRQ from R4
    bool i = 2;   // Bit 1: Enable PIRQ from R1
    bool j = 3;   // Bit 2: Enable PIRQ from R4
    bool m = 4;   // Bit 3: Enable PNMI from R3
    bool v = 5;   // Bit 4: Two-byte mode for R3
    bool p = 6;   // Bit 5: Parasite reset
}

// Single-byte latch state (R1 H-to-P, R2 both directions, R4 both directions).
message TubeLatchState {
    uint32 value = 1;           // Current data byte in the latch
    bool data_available = 2;    // Latch contains unread data
}

// 24-byte FIFO state (R1 P-to-H only).
message TubeFifo24State {
    uint32 count = 1;           // Number of bytes currently in the FIFO (0-24)
    bytes data = 2;             // FIFO contents in read order (head to tail)
    bool data_available = 3;    // count > 0
}

// 2-byte shift register state (R3 in each direction).
message TubeReg3State {
    uint32 count = 1;           // Number of bytes in the register (0-2)
    bytes data = 2;             // Register contents in read order (up to 2 bytes)
    bool pending = 3;           // Complete transfer awaiting consumption
    uint32 threshold = 4;       // Current threshold (1 or 2, from V flag)
}

// Host-perspective status registers (what the host reads at offsets 0/2/4/6).
message TubeHostStatus {
    uint32 r1_status = 1;   // Offset 0: control flags + R1 status bits
    uint32 r2_status = 2;   // Offset 2: R2 status bits (bits 7:6 + 0x3F)
    uint32 r3_status = 3;   // Offset 4: R3 status bits
    uint32 r4_status = 4;   // Offset 6: R4 status bits
}

// Parasite-perspective status registers (what the parasite reads at offsets 0/2/4/6).
message TubeParasiteStatus {
    uint32 r1_status = 1;   // Offset 0: control flags + R1 status bits
    uint32 r2_status = 2;   // Offset 2: R2 status bits
    uint32 r3_status = 3;   // Offset 4: R3 status bits (N F3 1 1 1 1 1 1; N at bit 7)
    uint32 r4_status = 4;   // Offset 6: R4 status bits
}

// Tube interrupt output state.
message TubeInterrupts {
    bool hirq = 1;           // Host IRQ: Q=1 AND R4 P-to-H has data
    bool pirq = 2;           // Parasite IRQ: (I=1 AND R1 H-to-P has data) OR (J=1 AND R4 H-to-P has data)
    bool pnmi_level = 3;     // PNMI level (combinational, before edge detection)
    bool pnmi_edge = 4;      // PNMI latched rising edge
}
