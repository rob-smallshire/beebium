syntax = "proto3";

package beebium;

// The cassette deck behind the Serial ULA's cassette interface.
//
// One deck, so no drive number anywhere. The deck is the user's transport:
// inserting leaves it stopped at the start, and play is a separate request. The
// tape moves only while the deck plays and the machine's motor relay (Serial
// ULA latch bit 7) is closed. Every unsuccessful response carries a sentence
// naming the tape by the name the client gave, and a kind.
service CassetteService {
    // Insert a UEF or CSW tape image the server can reach. The format is
    // judged by content. Fails if a tape is already in.
    rpc InsertTape(InsertTapeRequest) returns (InsertTapeResponse);

    // Stop and remove the tape.
    rpc EjectTape(EjectTapeRequest) returns (CassetteResponse);

    // The deck's keys. Play at the end of the tape succeeds and leaves the
    // deck stopped at the end. Seek beyond the end lands at the end.
    rpc Play(PlayRequest) returns (CassetteResponse);
    rpc Stop(StopRequest) returns (CassetteResponse);
    rpc Seek(SeekRequest) returns (CassetteResponse);

    // Wind the tape backwards or forwards at 30 times real speed, whether or
    // not the relay is closed; nothing reaches the Serial ULA while it winds.
    // The wind ends on Stop, Play, Seek or EjectTape, or at an end of the
    // tape, where the deck stops. Seek to 0 is the instant return to the start.
    rpc Rewind(RewindRequest) returns (CassetteResponse);
    rpc FastForward(FastForwardRequest) returns (CassetteResponse);

    // Press record. From here, while the relay is closed, the tape moves and
    // what passes under the head is replaced by what the Serial ULA sends, an
    // edge or silence. Stop, Play, Seek, a wind, EjectTape and the end of the
    // tape end it, and the tape is then written back to its file. Refused with
    // READ_ONLY for a tape Beebium only reads (a CSW).
    rpc Record(RecordRequest) returns (CassetteResponse);

    // The blank tape templates the server ships, and a copy of one into place
    // on the server's host, as DiscService's ListBlankDiscs and CreateDisc.
    rpc ListBlankTapes(ListBlankTapesRequest) returns (ListBlankTapesResponse);
    rpc CreateTape(CreateTapeRequest) returns (CreateTapeResponse);

    // A live audio input, streamed by a client from its host: the stream is
    // the live tape. The first message is the format, once; the rest are
    // samples. Refused with DECK_OCCUPIED while a tape is in, and with
    // INVALID_FORMAT if the first message is not a format or a second one
    // comes. A valid format inserts the live tape, stopped; the client then
    // calls Play. The relay does not gate it. Closing the stream ejects it,
    // and EjectTape ends the stream. The ring between the stream and the
    // emulation absorbs the drift between the host's clock and emulated
    // time; there is no resampling, so a live load is for real speed.
    rpc StreamAudio(stream AudioInputChunk) returns (StreamAudioSummary);

    // The deck's state, read without stopping the machine.
    rpc GetDeckStatus(GetDeckStatusRequest) returns (DeckStatus);

    // The current status at once, then a status on every change of presence,
    // transport, relay or tape, and while the deck plays the position no more
    // often than min_interval_ms of emulated time.
    rpc SubscribeDeckStatus(SubscribeDeckStatusRequest) returns (stream DeckStatus);

    // Where the tape carries signal, a level a second, computed off the
    // emulation thread when a tape is inserted and again when a recording
    // ends. Until it is ready, and for a live tape, ready is false;
    // DeckStatus.signal_map_generation says when to fetch it again.
    rpc GetTapeSignalMap(GetTapeSignalMapRequest) returns (TapeSignalMap);
}

enum CassetteErrorKind {
    CASSETTE_ERROR_KIND_UNSPECIFIED = 0;
    CASSETTE_ERROR_KIND_NO_CASSETTE_INTERFACE = 1;  // the model has no cassette interface
    CASSETTE_ERROR_KIND_CANNOT_OPEN = 2;            // missing, or no permission
    CASSETTE_ERROR_KIND_UNREADABLE = 3;             // opened, but could not be read to the end
    CASSETTE_ERROR_KIND_UNSUPPORTED_FORMAT = 4;     // not a UEF or CSW
    CASSETTE_ERROR_KIND_INVALID_IMAGE = 5;          // recognised, but refused (a disc chunk, a version, a value out of range, a blank tape template)
    CASSETTE_ERROR_KIND_DECK_OCCUPIED = 6;          // insert with a tape in
    CASSETTE_ERROR_KIND_DECK_EMPTY = 7;             // eject, play, stop, seek, wind, record or a signal map with no tape
    CASSETTE_ERROR_KIND_INVALID_POSITION = 8;       // a seek to a negative position
    CASSETTE_ERROR_KIND_READ_ONLY = 9;              // record on a tape that cannot be recorded on (a CSW or WAV, or a file the server cannot write)
    CASSETTE_ERROR_KIND_LIVE_SOURCE = 10;           // seek, wind or record on a live tape
    CASSETTE_ERROR_KIND_INVALID_FORMAT = 11;        // a live stream's or a WAV channel's format refused
}

enum TapeTransport {
    TAPE_TRANSPORT_STOPPED = 0;
    TAPE_TRANSPORT_PLAYING = 1;
    TAPE_TRANSPORT_RECORDING = 2;
    TAPE_TRANSPORT_REWINDING = 3;
    TAPE_TRANSPORT_FAST_FORWARDING = 4;
}

message TapeMetadata {
    string name = 1;              // the file's name
    string url = 2;               // the source, as given
    string format = 3;            // "UEF", "CSW", "WAV" or "LIVE"
    string title = 4;             // the image's own title (UEF &0009), else empty
    string origin = 5;            // the tool that made the image (UEF &0000, the CSW's application), else empty
    string target_machine = 6;    // the machine the image says it is for (UEF &0005), else empty
    double duration_seconds = 7;  // the tape's length; 0 when unknown
    bool recordable = 8;          // whether Record can record on it: a UEF whose file the server can write
    uint32 sample_rate = 9;       // a WAV's or live stream's rate in Hz; 0 for UEF and CSW
    string channel = 10;          // a stereo WAV's or live stream's channel, "left" or "right"; empty for a mono source, UEF and CSW
    string record_refusal = 11;   // when !recordable, why, as a sentence (the one Record refuses with)
}

message DeckStatus {
    bool has_cassette_interface = 1;  // false on a model without one
    bool tape_inserted = 2;           // (not has_tape: protobuf derives has_tape() from field 3)
    TapeMetadata tape = 3;            // set when tape_inserted
    TapeTransport transport = 4;
    double position_seconds = 5;      // tape time, in seconds of the ULA clock
    bool motor_on = 6;                // the relay, latch bit 7, whether or not a tape is in
    string ula_part = 7;              // "ferranti" or "vlsi"
    // For a live tape: how full its ring is (0 to 1), and the samples dropped
    // because it was full and those made up as silence because it was empty.
    double live_ring_fill = 8;
    uint64 live_overruns = 9;
    uint64 live_underruns = 10;
    // The tape's signal map: whether one is ready for the tape in the deck,
    // and how many have been published, so a client knows when to fetch it.
    bool signal_map_ready = 11;
    uint32 signal_map_generation = 12;
}

message InsertTapeRequest {
    string url = 1;                   // a file:// URI or an absolute path
    optional string channel = 2;      // a stereo WAV's channel, "left" or "right"; absent, the louder
}

message InsertTapeResponse {
    bool success = 1;
    string error = 2;                 // a sentence when !success
    CassetteErrorKind kind = 3;
    TapeMetadata tape = 4;            // set on success
}

message CassetteResponse {
    bool success = 1;
    string error = 2;                 // a sentence when !success
    CassetteErrorKind kind = 3;
}

message EjectTapeRequest {}
message PlayRequest {}
message StopRequest {}
message RewindRequest {}
message FastForwardRequest {}
message RecordRequest {}

message AudioInputChunk {
    oneof payload {
        AudioInputFormat format = 1;  // the first message, once
        bytes samples = 2;            // then samples, little-endian, in the stated format
    }
}

enum AudioSampleFormat {
    AUDIO_SAMPLE_FORMAT_UNSPECIFIED = 0;
    AUDIO_SAMPLE_FORMAT_S16 = 1;      // signed 16-bit
    AUDIO_SAMPLE_FORMAT_F32 = 2;      // 32-bit float, full scale +/-1
}

message AudioInputFormat {
    uint32 sample_rate = 1;           // 8000 to 192000
    AudioSampleFormat sample_format = 2;
    uint32 channels = 3;              // 1 or 2
    string channel = 4;               // for 2 channels: "left" or "right"; absent means left
    string device_name = 5;           // the host device, for display; names the live tape
}

message StreamAudioSummary {
    uint64 samples_received = 1;
    uint64 samples_dropped = 2;       // overruns
    uint64 silence_samples_inserted = 3;  // underruns
    string error = 4;                 // a sentence when the stream was refused or failed
    CassetteErrorKind kind = 5;
}

message ListBlankTapesRequest {}

message ListBlankTapesResponse {
    repeated BlankTape tapes = 1;     // in file name order
}

// A blank tape template.
message BlankTape {
    string label = 1;                 // the file name without its extension, e.g. "C15"
    string filename = 2;              // e.g. "C15.uef"
    string kind = 3;                  // "tape"
    uint64 size_bytes = 4;
    double duration_seconds = 5;
}

// Why a CreateTape failed, so a client can react without parsing `error`.
enum CreateTapeErrorKind {
    CREATE_TAPE_ERROR_KIND_UNSPECIFIED = 0;
    CREATE_TAPE_ERROR_KIND_UNKNOWN_LABEL = 1;       // no template has that label
    CREATE_TAPE_ERROR_KIND_DESTINATION_EXISTS = 2;  // the destination exists (or is a directory) and overwrite was not set
    CREATE_TAPE_ERROR_KIND_WRITE_FAILED = 3;        // the copy could not be written
    CREATE_TAPE_ERROR_KIND_WRONG_EXTENSION = 4;     // destination_path ends in another extension than .uef
}

message CreateTapeRequest {
    string label = 1;                 // a template's label, from ListBlankTapes
    string destination_path = 2;      // the new tape's path on the server's host; without an extension, .uef is added
    bool overwrite = 3;               // replace an existing file at destination_path
}

message CreateTapeResponse {
    bool success = 1;
    string error = 2;                 // a lower-case message if !success
    CreateTapeErrorKind kind = 3;
    string path = 4;                  // the absolute path of the new tape, if success
}

message SeekRequest {
    double position_seconds = 1;
}

message GetDeckStatusRequest {}

message SubscribeDeckStatusRequest {
    uint32 min_interval_ms = 1;       // default 100
}

message GetTapeSignalMapRequest {}

// One level a second of tape, the fraction of that second within a run of
// edges (each less than 4 ms after the last), carrier included: 0 silent
// throughout, 255 signal throughout.
message TapeSignalMap {
    bool success = 1;                 // false with no tape, or no cassette interface
    string error = 2;                 // a sentence when !success
    CassetteErrorKind kind = 3;       // DECK_EMPTY or NO_CASSETTE_INTERFACE
    bool ready = 4;                   // false while the map is being computed, or for a live tape
    uint32 seconds = 5;               // the number of levels, the tape's duration rounded up
    bytes levels = 6;                 // one byte a second, 0 (silent) to 255 (signal throughout)
}
