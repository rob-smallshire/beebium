syntax = "proto3";

package beebium;

// The Tube and the coprocessor attached to it.
//
// A coprocessor is an in-process plugin, attached at launch (--tube-65c02,
// --tube-65c102, or a preset's coprocessor); it is driven and debugged through
// CoprocessorDebuggerControl. This service says what is fitted.
service TubeService {
    // Whether the machine has a Tube, whether it is enabled, and which
    // coprocessor is attached to it.
    rpc GetStatus(GetTubeStatusRequest) returns (GetTubeStatusResponse);
}

message GetTubeStatusRequest {
    // Empty - returns full status.
}

message GetTubeStatusResponse {
    // True if this machine variant has a Tube socket (compile-time).
    bool has_tube_socket = 1;

    // True if Tube hardware is currently enabled (runtime).
    bool enabled = 2;

    // True if a coprocessor is attached to the Tube. The fields below are
    // empty or zero when it is not.
    bool coprocessor_connected = 3;

    // The coprocessor's CPU as people name it ("65C02", "65C102"), as the
    // coprocessor-cpu machine-description placeholder shows it.
    string coprocessor_cpu = 4;

    // The coprocessor's nominal clock in hertz (3000000 for the 6502 Second
    // Processor), which the coprocessor-clock placeholder formats.
    uint64 coprocessor_clock_hz = 5;

    // The coprocessor extension's instance id, as PeripheralExtensionService
    // lists it (ExtensionInfo.id).
    string coprocessor_extension_id = 6;
}
