syntax = "proto3";

package beebium;

// Sideways ROM/RAM management service.
//
// Provides query and configuration of sideways ROM/RAM slots.
// Supports both aliased (Model B with 4 sockets) and non-aliased
// (ROM/RAM board with 16 independent slots) configurations.
service SidewaysService {
    // Query slot/socket configuration and current state
    rpc GetSlotStatus(GetSlotStatusRequest) returns (GetSlotStatusResponse);

    // Configure a slot (empty/rom/ram) with optional image data
    rpc ConfigureSlot(ConfigureSlotRequest) returns (ConfigureSlotResponse);

    // Set or clear the write-protect switch on a RAM slot. Models a board's
    // write-protect link/switch (e.g. the ATPL Sidewise S6 link). Rejected for
    // slots that are not currently RAM.
    rpc SetSlotWriteProtect(SetSlotWriteProtectRequest) returns (SetSlotWriteProtectResponse);

    // Read slot contents (for debugging/inspection)
    rpc ReadSlotData(ReadSlotDataRequest) returns (ReadSlotDataResponse);

    // Subscribe to slot/bank selection events
    rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SidewaysEvent);
}

// --- Slot Types ---

enum SidewaysSlotType {
    SIDEWAYS_SLOT_TYPE_EMPTY = 0;   // Returns 0xFF, ignores writes
    SIDEWAYS_SLOT_TYPE_ROM = 1;     // Returns data, ignores writes
    SIDEWAYS_SLOT_TYPE_RAM = 2;     // Returns data, accepts writes
}

// --- Get Slot Status ---

message GetSlotStatusRequest {
    // Empty - returns status of all slots/sockets
}

message GetSlotStatusResponse {
    bool has_aliasing = 1;              // True for Model B (4 sockets with aliasing)
    uint32 num_physical_slots = 2;      // 4 for Model B, 16 for ROM/RAM board
    repeated SocketStatus sockets = 3;  // Physical sockets/slots
    // Tag 4 (selected_bank) was removed: the BBC's ROMSEL value changes
    // faster than any client can usefully sample, and the field was
    // never load-bearing for UI or tests. Do not reuse this tag.
    reserved 4;
    reserved "selected_bank";
    // Motherboard link (jumper) state on this server, when the machine
    // variant has slot-mapping links (e.g. Model B+ S13). Empty for
    // machines with no such links.
    repeated MotherboardLink motherboard_links = 5;
}

// Status of a physical socket (or independent slot for ROM/RAM board)
message SocketStatus {
    uint32 socket_index = 1;            // Physical socket/slot number
    repeated uint32 aliased_slots = 2;  // Slot numbers that map here (e.g., [0,4,8,12])
                                        // For non-aliased, contains only socket_index
    SidewaysSlotType type = 3;                  // empty/rom/ram
    bool populated = 4;                 // Has content loaded
    // Source filepath if loaded - absolute path on the server. Clients that
    // want a short display name should take the basename. Empty for empty or
    // blank-RAM slots, and on machines that have no per-slot image storage
    // (e.g. Model B+).
    string image_name = 5;
    string socket_label = 6;            // Physical label (e.g., "IC52", "IC88") for Model B
    // Capability flags describing what types this physical socket can hold
    // and whether the type can change at runtime via ConfigureSlot. Lets
    // GUI clients gray out RAM/Empty options on ROM-only machines (Model B+).
    SocketCapabilities capabilities = 7;
    // Parsed sideways ROM header for whatever is loaded in this socket.
    // Populated only when the header is recognised (the MOS's "(C)" marker
    // is present); absent / recognised=false for an empty socket, blank RAM,
    // or a non-standard image. Mirrors the describe-rom JSON.
    RomHeader rom_header = 8;
    // True when this slot is a RAM slot whose write-protect switch is engaged,
    // inhibiting writes to the RAM. Always false for ROM/empty slots and on
    // machines with no write-protect control.
    bool write_protected = 9;
}

// Parsed sideways ROM header, when one is recognised in the slot's contents.
// See docs/manuals/sidewrom.pdf for the canonical layout and
// docs/romfs-detection.md for the ROMFS detection.
message RomHeader {
    bool recognised = 1;     // The MOS's "(C)" copyright marker was found
    string title = 2;        // From offset 9 of the header
    string version = 3;      // Optional version string
    string copyright = 4;    // "(C)..." string
    bool contains_romfs = 5; // A CRC-valid CFS block chain is present
    // What the ROM is: any combination of "language", "service", "romfs".
    repeated string kinds = 6;
}

// Capability flags for a physical socket. These reflect the hardware
// (e.g. all Model B+ sockets are ROM-only by motherboard design).
message SocketCapabilities {
    bool supports_rom = 1;
    bool supports_ram = 2;
    bool supports_empty = 3;
    bool runtime_configurable = 4;
}

// One motherboard link (jumper) and its current position. Reported back so
// clients can display the current link configuration and (in future) build
// link configuration UIs.
message MotherboardLink {
    string name = 1;          // e.g. "S13"
    string value = 2;         // e.g. "west", "east"
    string description = 3;   // Optional human-readable description
}

// --- Configure Slot ---

message ConfigureSlotRequest {
    uint32 slot = 1;                    // Slot number (0-15), maps to socket on Model B
    SidewaysSlotType type = 2;                  // empty/rom/ram
    oneof image {
        string url = 3;                 // URL to load (file:// for local)
        bytes data = 4;                 // Raw image data (max 16384 bytes)
    }
    // For type=rom, image is optional (empty ROM if not specified)
    // For type=ram, image is optional (uninitialised RAM if not specified)
    // For type=empty, image is ignored
}

message ConfigureSlotResponse {
    bool success = 1;
    string error = 2;                   // Error message if !success
    uint32 actual_socket = 3;           // Physical socket that was configured (for aliased)
    string image_name = 4;              // Parsed name from ROM header (if applicable)
}

// --- Set Slot Write Protect ---

message SetSlotWriteProtectRequest {
    uint32 slot = 1;              // Slot number (0-15)
    bool write_protected = 2;     // true to engage write-protect, false to release
}

message SetSlotWriteProtectResponse {
    bool success = 1;
    string error = 2;             // Error message if !success
    bool write_protected = 3;     // The slot's write-protect state after the call
}

// --- Read Slot Data ---

message ReadSlotDataRequest {
    uint32 slot = 1;                    // Slot number (0-15)
    uint32 offset = 2;                  // Offset within slot (0-16383)
    uint32 length = 3;                  // Number of bytes to read (max 16384)
}

message ReadSlotDataResponse {
    bool success = 1;
    string error = 2;
    bytes data = 3;                     // Requested data
    SidewaysSlotType type = 4;                  // Current slot type
}

// --- Events ---

message SubscribeEventsRequest {
    uint32 min_interval_ms = 1;         // Reserved for future per-event-type rate control.
    // Opt in to SlotHeaderChangedEvent. Default off: emits at ~1 Hz
    // while RAM-slot header bytes change. Costs the server a periodic
    // rescan, so opt in only while you actually need live updates and
    // drop the subscription (or restart it without this flag) when you
    // don't. See docs/discussion/sideways-live-header-updates.md.
    bool monitor_header_changes = 2;
}

message SidewaysEvent {
    uint64 timestamp_cycles = 1;        // Emulator cycle count
    // Tag 3 (BankSelectedEvent) was removed: ROMSEL changes thousands
    // of times per second during OS scans and intermediate samples have
    // no observational value. Do not reuse this tag.
    reserved 3;
    reserved "bank_selected";
    oneof event {
        SlotConfiguredEvent slot_configured = 2;
        SlotHeaderChangedEvent slot_header_changed = 4;
    }
}

// Architectural placeholder: announces that ConfigureSlot reconfigured
// a slot at runtime. Not currently emitted - no UI path reconfigures
// sideways slots on a running machine, so no real consumer is missing
// updates today. The message and the client-side handlers exist so
// that when hot-plug cartridge support lands (Master 128 cart ports,
// Electron Plus 1, ...), the emitter inside ConfigureSlot becomes a
// one-liner and every existing client already reacts correctly.
message SlotConfiguredEvent {
    uint32 slot = 1;                    // Logical slot number (0-15)
    uint32 socket = 2;                  // Physical socket number
    SidewaysSlotType type = 3;
    string image_name = 4;
}

// Emitted by the live header scanner when the parsed ROM header for a
// RAM slot's current contents differs from the last value broadcast
// on this stream. Only fires for subscribers with
// SubscribeEventsRequest.monitor_header_changes = true.
message SlotHeaderChangedEvent {
    uint32 slot = 1;        // Logical slot whose header just changed
    RomHeader rom_header = 2;  // Current parse result, same shape as SocketStatus.rom_header
}
