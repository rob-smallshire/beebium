syntax = "proto3";

package beebium;

// Floppy disc drive management service.
//
// Provides insert/eject operations with safe eject support,
// drive status queries, and event streaming for multiple clients.
service DiscService {
    // Insert a disc image from URL (file: scheme for local files).
    // Fails if the drive already holds a disc: removing one is a separate,
    // deliberate EjectDisc, so that it goes through the safe eject path.
    rpc InsertDisc(InsertDiscRequest) returns (InsertDiscResponse);

    // Request disc ejection (non-blocking, safe eject by default)
    rpc EjectDisc(EjectDiscRequest) returns (EjectDiscResponse);

    // Query status of all drives
    rpc GetDriveStatus(GetDriveStatusRequest) returns (GetDriveStatusResponse);

    // Stream drive events (insert, eject, motor changes)
    rpc SubscribeDiscEvents(SubscribeDiscEventsRequest) returns (stream DiscEvent);

    // Configure motor spin-up delay (for automation scenarios)
    rpc SetSpinUpDelay(SetSpinUpDelayRequest) returns (SetSpinUpDelayResponse);

    // Query spin-up delay configuration
    rpc GetSpinUpDelay(GetSpinUpDelayRequest) returns (GetSpinUpDelayResponse);

    // List available disc controller types (for machines with sockets)
    rpc ListAvailableControllers(ListAvailableControllersRequest) returns (ListAvailableControllersResponse);

    // Install a disc controller into the socket (machines with sockets only)
    rpc InstallDiscController(InstallDiscControllerRequest) returns (InstallDiscControllerResponse);
}

// --- Drive State ---

// Unified drive state (single field avoids race conditions)
// Named DiscDriveState to avoid conflict with C++ DriveState enum
enum DiscDriveState {
    DISC_DRIVE_STATE_EMPTY = 0;     // No disc in drive
    DISC_DRIVE_STATE_LOADED = 1;    // Disc present, idle
    DISC_DRIVE_STATE_EJECTING = 2;  // Eject pending, waiting for quiescence
}

// --- Insert ---

message InsertDiscRequest {
    uint32 drive = 1;                  // Drive number (0 or 1)
    string url = 2;                    // Disc image URL (file:// for local)
    bool write_protect_override = 3;   // If true, force write-protect regardless of file perms
}

message InsertDiscResponse {
    bool success = 1;
    string error = 2;                  // Error message if !success
    DiscMetadata disc = 3;             // Metadata of inserted disc (if success)
}

// --- Eject ---

message EjectDiscRequest {
    uint32 drive = 1;                  // Drive number (0 or 1)
    bool immediate = 2;                // If true, eject now (skip quiescence wait)
    uint32 quiescence_ms = 3;          // Motor-off time required (default: 500)
    uint32 force_after_ms = 4;         // Force eject after timeout (default: 10000)
}

message EjectDiscResponse {
    bool accepted = 1;                 // Request accepted (transitions to Ejecting)
    string error = 2;                  // Error if !accepted (e.g., "drive empty")
}

// --- Status Query ---

message GetDriveStatusRequest {
    // Empty - returns status of all drives
}

message GetDriveStatusResponse {
    bool has_disc_controller = 1;      // False if machine has no disc interface
    string controller_type = 2;        // "WD1770", "8271", or empty
    repeated DriveStatus drives = 3;   // Status of each drive
    bool is_socketed = 4;              // True if controller can be changed at runtime
    string installed_controller_id = 5; // CLI id of installed controller (if socketed)
}

message DriveStatus {
    uint32 drive = 1;                  // Drive number (0 or 1)
    DiscDriveState state = 2;          // Unified state
    string disc_name = 3;              // Disc name (empty if no disc)
    string disc_url = 4;               // Source URL (empty if no disc)
    bool motor_on = 5;                 // Motor running
    uint32 current_track = 6;          // Head position (0-79)
    bool write_protected = 7;          // Disc write protection
    DiscMetadata disc = 8;             // Full disc metadata (if loaded)
}

// --- Disc Metadata ---

message DiscMetadata {
    string name = 1;                   // Disc name (filename)
    uint32 sides = 2;                  // 1 for single-sided, 2 for double-sided
    bool write_protected = 6;          // Write protection status
    string format = 7;                 // Format name (e.g. "SSD", "ADL", "HFE v3")
}

// --- Event Streaming ---

message SubscribeDiscEventsRequest {
    // Future: filter by drive number or event type
}

enum DiscEventType {
    DISC_EVENT_UNKNOWN = 0;
    DISC_EVENT_INSERTED = 1;           // Disc was inserted
    DISC_EVENT_EJECTED = 2;            // Disc was ejected (graceful)
    DISC_EVENT_FORCE_EJECTED = 3;      // Disc was force-ejected (timeout)
    DISC_EVENT_EJECT_REQUESTED = 4;    // Eject requested (state -> Ejecting)
    DISC_EVENT_EJECT_CANCELLED = 5;    // Eject cancelled (state -> Loaded)
    DISC_EVENT_MOTOR_ON = 6;           // Motor started
    DISC_EVENT_MOTOR_OFF = 7;          // Motor stopped
}

message DiscEvent {
    DiscEventType type = 1;
    uint32 drive = 2;                  // Which drive (0 or 1)
    uint64 timestamp_cycles = 3;       // Emulator cycle count
    DiscMetadata disc = 4;             // Disc info (for insert/eject events)
    string disc_url = 5;               // Source URL of the disc (insert events)
}

// --- Spin-Up Delay Configuration ---

message SetSpinUpDelayRequest {
    bool enabled = 1;                  // Enable/disable motor spin-up delay
}

message SetSpinUpDelayResponse {
    bool success = 1;
    string error = 2;                  // Error message if !success
}

message GetSpinUpDelayRequest {
    // Empty
}

message GetSpinUpDelayResponse {
    bool enabled = 1;                  // Current spin-up delay setting
}

// --- Available Controllers ---

message ListAvailableControllersRequest {
    // Empty - returns all available controller types
}

message ListAvailableControllersResponse {
    repeated DiscControllerTypeInfo controllers = 1;  // Available controller types
}

// Information about a disc controller type
message DiscControllerTypeInfo {
    string id = 1;                     // CLI identifier (e.g., "acorn-1770")
    string display_name = 2;           // Human-readable name (e.g., "Acorn 1770")
    string fdc_chip = 3;               // FDC chip name (e.g., "WD1770")
    string description = 4;            // Brief description
}

// --- Install Controller ---

message InstallDiscControllerRequest {
    string controller_id = 1;          // CLI identifier (e.g., "acorn-1770")
                                       // Use empty string or "none" to remove controller
}

message InstallDiscControllerResponse {
    bool success = 1;
    string error = 2;                  // Error message if !success
    string controller_type = 3;        // Name of installed controller (e.g., "WD1770")
}
