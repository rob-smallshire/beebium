syntax = "proto3";

package beebium;

// Video frame streaming service
service VideoService {
    // Stream frames as they complete (at VSYNC)
    rpc SubscribeFrames(SubscribeFramesRequest) returns (stream Frame);

    // Get current video configuration
    rpc GetConfig(GetConfigRequest) returns (VideoConfig);

    // Read the MODE 7 screen as characters rather than pixels.
    //
    // A snapshot rather than a stream: a caller wants one screen when it asks
    // -- a copy command, or a script reading the display -- and pushing 8 KB
    // of cell data per frame to every client on the chance that someone might
    // copy would be absurd. A future vector renderer needs every frame aligned
    // with the pixels it replaces, and that is a separate transport from the
    // same capture; see docs/discussion/teletext-cell-capture.md.
    rpc GetTeletextScreen(GetTeletextScreenRequest) returns (TeletextScreen);

    // Read text from the display, whatever mode is producing it.
    //
    // The caller selects in pixels and gets back text plus where it was found.
    // A pixel rectangle is something a client can produce from a drag without
    // knowing anything about modes, grids or cell sizes, and the strategy that
    // reads a given band of scanlines is the server's business.
    rpc GetScreenText(GetScreenTextRequest) returns (ScreenText);

    // Report the character grid the display currently implies, per band.
    //
    // Separate from GetScreenText because snapping a drag has to happen while
    // the drag is in progress, when the client has nothing to send yet.
    rpc GetScreenGeometry(GetScreenGeometryRequest) returns (ScreenGeometry);
}

message SubscribeFramesRequest {
    // Future: format preferences, scaling options
}

// Field ordering for interlaced frames.
// Clients can split composited frames into fields for authentic 50Hz display.
enum FieldOrder {
    PROGRESSIVE = 0;    // Non-interlaced, single pass
    EVEN_FIRST = 1;     // Even lines (0,2,4...) rendered first temporally
    ODD_FIRST = 2;      // Odd lines (1,3,5...) rendered first temporally
}

message Frame {
    uint64 frame_number = 1;
    uint64 cycle_count = 2;
    uint32 width = 3;           // Logical width in pixels (varies by mode)
    uint32 height = 4;          // Logical height in scanlines
    bytes pixels = 5;           // BGRA32 pixel data, width * height * 4 bytes
    FieldOrder field_order = 6; // For interlaced modes (e.g., MODE 7)

    // Border dimensions (pixels/scanlines of blanking around active area)
    // Clients can use these for authentic CRT-style display with borders.
    // Add left_border + width + right_border for total horizontal extent.
    uint32 left_border = 7;     // Pixels from left edge to active area
    uint32 right_border = 8;    // Pixels from active area to right edge
    uint32 top_border = 9;      // Scanlines from top edge to active area
    uint32 bottom_border = 10;  // Scanlines from active area to bottom edge

    // Target display resolution for scaling.
    // BBC Micro displays all modes at the same physical CRT size.
    // Clients should scale: width -> display_width, height -> display_height
    // Examples:
    //   MODE 0: 640x256 logical = 640x256 display (1:1)
    //   MODE 1: 320x256 logical = 640x256 display (2:1 horizontal)
    //   MODE 2: 160x256 logical = 640x256 display (4:1 horizontal)
    uint32 display_width = 11;  // Target display width (typically 640)
    uint32 display_height = 12; // Target display height (typically 256)

    // Per-region display geometry for split-screen modes.
    // Always populated with at least one region.
    repeated DisplayRegion regions = 13;
}

// A horizontal region of scanlines sharing the same logical pixel width.
// Used for split-screen modes where the CRTC is reprogrammed mid-frame
// (e.g., Elite uses MODE 4 upper / MODE 5 lower).
message DisplayRegion {
    uint32 start_line = 1;      // First scanline (inclusive, 0-based)
    uint32 end_line = 2;        // Last scanline (exclusive)
    uint32 pixel_width = 3;     // Logical pixel width for scanlines in this region
}

message GetConfigRequest {}

message VideoConfig {
    uint32 width = 1;         // 640 for Mode 0-6, 480 for Mode 7
    uint32 height = 2;        // 256 typical
    uint32 framerate_hz = 3;  // 50Hz PAL
}

// ============================================================================
// MODE 7 screen as characters
// ============================================================================

// Which character set a cell was displayed with.
enum TeletextCharacterSet {
    TELETEXT_ALPHA = 0;
    TELETEXT_CONTIGUOUS_GRAPHICS = 1;
    TELETEXT_SEPARATED_GRAPHICS = 2;
}

// How a region of cells becomes a run of text.
enum TeletextTextLayout {
    // Each row of the region is its own line, preserving the shape of the
    // selection. The default, and what a column of figures wants.
    TELETEXT_LAYOUT_ROWS = 0;
    // A row filled to the region's right edge wrapped, so it continues into
    // the next without a break. What a sentence spanning rows wants.
    TELETEXT_LAYOUT_FLOWED = 1;
}

// A rectangle of cells, in grid coordinates. Absent means the whole screen.
message TeletextScreenRegion {
    uint32 row = 1;
    uint32 column = 2;
    uint32 rows = 3;
    uint32 columns = 4;
}

message GetTeletextScreenRequest {
    // The part of the screen to read. Whole screen when unset.
    optional TeletextScreenRegion region = 1;

    // How to join the region's rows into `text`.
    TeletextTextLayout layout = 2;
}

// One character cell, as it was displayed: the attributes here are the ones in
// effect at this cell after control codes were resolved, not something the
// caller has to re-derive.
message TeletextScreenCell {
    uint32 character = 1;           // 7-bit SAA5050 code
    uint32 fg = 2;                  // Colour index 0-7
    uint32 bg = 3;                  // Colour index 0-7
    TeletextCharacterSet charset = 4;
    bool double_height_top = 5;
    bool double_height_bottom = 6;
    bool concealed = 7;
    bool flashing = 8;
    bool cursor = 9;
    bool is_control_code = 10;
}

message TeletextScreen {
    // False when the display is not MODE 7. The cells then describe whatever
    // was last shown in MODE 7 rather than anything current, so a caller must
    // check this before using them.
    bool active = 1;

    // Dimensions of the returned region, not of the screen.
    uint32 rows = 2;
    uint32 columns = 3;

    // Row-major, rows * columns entries.
    repeated TeletextScreenCell cells = 4;

    // The region as text, converted server-side so every client agrees on what
    // graphics, control codes, concealed cells and double-height rows copy as.
    // Lines are joined with LF; converting to a platform-native ending is the
    // client's business, since the server cannot know the client's platform.
    string text = 5;

    // Increments once per captured frame.
    uint64 frame_number = 6;
}

// ============================================================================
// Screen text
// ============================================================================

// A rectangle in frame pixel coordinates, the origin being the top-left of the
// active area rather than of the bordered display.
message PixelRegion {
    uint32 x = 1;
    uint32 y = 2;
    uint32 width = 3;
    uint32 height = 4;
}

// Which of the two searches a strategy should run.
//
// Honoured by strategies that recognise glyphs in pixels; the teletext
// strategy reads the character grid and is unaffected by it.
enum ScreenTextSearch {
    // Read all the text, wherever it sits: on the character grid and placed
    // freely with VDU 5. The default -- a caller that does not restrict gets
    // everything. This is not a merge the caller performs: the server reads the
    // grid and the off-grid text in disjoint passes and returns them together,
    // so ANYWHERE is a strict superset of ALIGNED, not a second thing to
    // reconcile against it.
    SCREEN_TEXT_SEARCH_ANYWHERE = 0;

    // Read only text aligned to the character grid: exact, cheaper, and what a
    // drag snapped to the grid wants. A caller chooses this or ANYWHERE up
    // front; there is never a reason to ask for both and combine them.
    SCREEN_TEXT_SEARCH_ALIGNED = 1;
}

// How the runs are joined into `text`.
enum ScreenTextLayout {
    // Each grid row is its own line, preserving the shape of the selection.
    SCREEN_TEXT_LAYOUT_ROWS = 0;
    // A row filled to the region's right edge wrapped, so it continues into
    // the next without a break.
    SCREEN_TEXT_LAYOUT_FLOWED = 1;
}

message GetScreenTextRequest {
    // The part of the display to read. Whole display when unset. Independent of
    // `search`: what part of the screen to read and how hard to look for text
    // in it are separate choices.
    optional PixelRegion region = 1;

    ScreenTextSearch search = 2;
    ScreenTextLayout layout = 3;
}

// A contiguous piece of text and where it was found, so a client can highlight
// exactly what it captured.
message ScreenTextRun {
    string text = 1;
    PixelRegion bounds = 2;

    // The character cell geometry this run was read with, so a selection can
    // snap to it. Zero when the run is not cell-aligned, as text written at
    // the graphics cursor is.
    uint32 cell_width = 3;
    uint32 cell_height = 4;
}

message ScreenText {
    // True when at least one band in the requested region had a strategy that
    // could read it.
    //
    // Distinct from readable-but-empty: a graphics screen that was read and
    // found to contain no text is supported with no runs, whereas a display
    // this build has no strategy for is unsupported. Which displays fall in
    // the second group narrows as strategies are added.
    bool supported = 1;

    // In reading order: bands top to bottom, and within a band by baseline
    // then x.
    repeated ScreenTextRun runs = 2;

    // The runs joined into text by `layout`, for a client that wants a string
    // and not structure. Lines are joined with LF; converting to a
    // platform-native ending is the client's business, since the server cannot
    // know the client's platform.
    string text = 3;

    // Cells a strategy tried to read and could not identify at all. Zero for
    // the teletext strategy, whose cells are exact character codes.
    uint32 unreadable_cells = 4;

    // Cells a strategy read but could not pin to a single character, because
    // the font in use draws two characters identically. Also zero for
    // teletext.
    uint32 ambiguous_cells = 5;

    uint64 frame_number = 6;
}

message GetScreenGeometryRequest {}

// The character grid for one band of scanlines, in frame pixel coordinates.
//
// Reported for every band whether or not text can be read from it: where the
// cells are and what is in them are separate questions, and snapping needs
// only the first.
message ScreenBandGeometry {
    uint32 top = 1;            // First scanline, inclusive
    uint32 bottom = 2;         // One past the last

    uint32 cell_width = 3;
    uint32 cell_height = 4;

    // Cell-to-cell step. Equal to the cell size except where a mode leaves
    // blank scanlines between rows, as MODE 3 and MODE 6 do: an eight-scanline
    // glyph on a ten-scanline pitch.
    uint32 column_pitch = 5;
    uint32 row_pitch = 6;

    uint32 origin_x = 7;       // Where the grid starts within the band
    uint32 origin_y = 8;
}

message ScreenGeometry {
    repeated ScreenBandGeometry bands = 1;
    uint64 frame_number = 2;
}
