syntax = "proto3";

package beebium;

// System information service
// Provides machine configuration and identity information
service SystemService {
    // Get current system/machine information
    rpc GetSystemInfo(GetSystemInfoRequest) returns (SystemInfo);

    // Set the machine's user-assignable name
    rpc SetMachineName(SetMachineNameRequest) returns (SetMachineNameResponse);

    // Subscribe to server status events (shutdown notifications, identity changes, etc.)
    // Server sends READY immediately upon subscription, then status changes.
    // Stream ends when server shuts down or client disconnects.
    rpc WatchServerStatus(WatchServerStatusRequest) returns (stream ServerStatusEvent);

    // Request server shutdown.
    // Returns whether the request was accepted based on shutdown policy.
    // Policy: accept if requester's instance UUID matches launch provenance,
    //         or only one client connected, or --allow-shutdown flag was set.
    rpc RequestShutdown(ShutdownRequest) returns (ShutdownResponse);

    // Get current mDNS service advertisement state
    rpc GetAdvertisementState(GetAdvertisementStateRequest) returns (GetAdvertisementStateResponse);

    // Enable or disable mDNS service advertisement at runtime
    rpc SetAdvertisement(SetAdvertisementRequest) returns (SetAdvertisementResponse);

    // Get current pacing statistics (PI controller state, timing, I/O skip counts).
    rpc GetPacingStats(GetPacingStatsRequest) returns (PacingStats);

    // Stream pacing statistics at a configurable interval.
    rpc WatchPacingStats(WatchPacingStatsRequest) returns (stream PacingStats);

    // Set the runtime pacing speed multiplier.
    rpc SetSpeedMultiplier(SetSpeedMultiplierRequest) returns (SetSpeedMultiplierResponse);
}

message GetSystemInfoRequest {
    // Future: request specific fields, version info, etc.
}

// Launch provenance information
// Identifies who/what launched the emulator core and when
message LaunchProvenance {
    // Freeform type string identifying the launching client
    // Examples: "macos-gui", "python-client", "terminal", "vscode-extension"
    string type = 1;

    // Per-instance UUID (RFC 4122) generated at launch time
    string instance_uuid = 2;

    // Optional version string of the launching client
    string version = 3;

    // Unix timestamp when the core was launched (seconds since epoch)
    int64 timestamp = 4;
}

// Machine identity information
// Stable UUID and mutable name for identification and labeling
message MachineIdentity {
    // RFC 4122 v4 UUID, stable for machine lifetime
    string uuid = 1;

    // User-assignable label, mutable via SetMachineName
    string name = 2;

    // Machine model type identifier (e.g., "ModelB", "ModelBPlus")
    // Immutable, set at creation
    string model_type = 3;

    // Human-readable model name (e.g., "BBC Model B 32K")
    // Immutable, set at creation
    string model_name = 4;
}

// Connection tracking information
// Tracks the number of active client connections (WatchServerStatus streams)
message ConnectionInfo {
    // Number of clients with active WatchServerStatus streams
    int32 client_count = 1;
}

message SystemInfo {
    // Old fields removed - use identity instead
    reserved 1, 2;
    reserved "machine_type", "machine_display_name";

    // Launch provenance (who started this core and when)
    LaunchProvenance provenance = 3;

    // Machine identity (UUID and name)
    MachineIdentity identity = 4;

    // Connection tracking (active client count)
    ConnectionInfo connections = 5;

    // Nominal CPU clock frequency in Hz (e.g. 2000000 for 2 MHz).
    uint32 clock_speed_hz = 6;

    // Fingerprint of the wire protocol the server was built against (a hash of
    // the normalised proto contract). Clients compare this to their own
    // compiled-in fingerprint at connect and refuse to proceed on a mismatch.
    string protocol_fingerprint = 7;

    // Filesystem path of the running server executable, as resolved from the
    // OS rather than argv[0], so a PATH symlink reports its real target.
    //
    // This exists to make a protocol_fingerprint mismatch diagnosable. The
    // question a mismatch raises is "which binary am I actually talking to?",
    // and comparing two hashes cannot answer it: a stale server left running,
    // a system-wide install shadowing a development build, or one variant of
    // a multi-server bundle rebuilt while its siblings were not all look
    // identical from the client. The path answers it directly.
    //
    // Empty if the path cannot be determined.
    string executable_path = 8;

    // Future expansion:
    // string cpu_type = 8;          // Primary CPU (e.g., "6502", "65C02")
    // string coprocessor_type = 9;  // Second processor if present (e.g., "Z80", "32016")
}

// === SetMachineName RPC ===

message SetMachineNameRequest {
    // New name for the machine (must not be empty)
    string name = 1;
}

message SetMachineNameResponse {
    // Updated identity with new name
    MachineIdentity identity = 1;
}

// === Shutdown RPC ===

// Shutdown mode determines how the server terminates
enum ShutdownMode {
    // Normal shutdown: notify clients, wait for subsystems, then terminate
    SHUTDOWN_GRACEFUL = 0;

    // Immediate shutdown: terminate as soon as possible, skip coordination
    SHUTDOWN_IMMEDIATE = 1;
}

message ShutdownRequest {
    // How to shut down
    ShutdownMode mode = 1;

    // Grace period in milliseconds before forced termination
    // 0 = use server default (5000ms)
    // Only meaningful for SHUTDOWN_GRACEFUL
    int32 grace_period_ms = 2;
}

message ShutdownResponse {
    // Whether the shutdown request was accepted
    bool accepted = 1;

    // Human-readable explanation
    // On success: "Shutdown initiated"
    // On failure: "Shutdown refused: multiple clients connected"
    string message = 2;
}

// Status of a shutdown condition (subsystem preparing for shutdown)
message ShutdownConditionStatus {
    // Name of the subsystem (e.g., "Disc controller", "Audio output")
    string name = 1;

    // True if this subsystem is ready for shutdown
    bool ready = 2;

    // Milliseconds elapsed since shutdown was initiated
    int32 elapsed_ms = 3;

    // Timeout in milliseconds for this condition
    int32 timeout_ms = 4;
}

// === Server Status Streaming ===

message WatchServerStatusRequest {
    // Future: filter for specific event types
}

// Server status event sent to subscribers
message ServerStatusEvent {
    // Type of status event
    ServerStatusType status = 1;

    // Optional human-readable message
    string message = 2;

    // For SHUTTING_DOWN: grace period in milliseconds before forced termination
    // Clients should disconnect within this time
    uint32 shutdown_grace_ms = 3;

    // For IDENTITY_CHANGED: the updated identity
    MachineIdentity identity = 4;

    // For SHUTDOWN_PROGRESS: status of each subsystem condition
    repeated ShutdownConditionStatus shutdown_conditions = 5;
}

// Server status types
enum ServerStatusType {
    // Server is ready and running normally
    // Sent immediately when client subscribes
    SERVER_STATUS_READY = 0;

    // Server is beginning shutdown sequence
    // Clients should finish pending operations and disconnect
    SERVER_STATUS_SHUTTING_DOWN = 1;

    // Machine identity has changed (e.g., name was updated)
    // The identity field contains the new identity
    SERVER_STATUS_IDENTITY_CHANGED = 2;

    // Shutdown is in progress, showing subsystem coordination status
    // The shutdown_conditions field contains status of each subsystem
    SERVER_STATUS_SHUTDOWN_PROGRESS = 3;

    // Periodic liveness tick, emitted on an otherwise-idle stream every few
    // seconds. Carries no payload; its job is to keep the stream producing
    // traffic so a client can detect a silently-unreachable server (network
    // partition or a frozen process) by the *absence* of heartbeats. A healthy
    // connection delivers these at a steady cadence.
    SERVER_STATUS_HEARTBEAT = 4;
}

// === Advertisement RPC ===

// Current state of mDNS service advertisement
message AdvertisementState {
    // True if advertisement is currently enabled and active
    bool enabled = 1;

    // True if platform has mDNS support (Bonjour/Avahi/Windows mDNS)
    // If false, advertisement cannot be enabled
    bool available = 2;

    // The actual name being advertised (may differ from identity.name
    // if DNS-SD resolved a name collision, e.g., "Machine" -> "Machine (2)")
    // Empty if not currently advertising
    string advertised_name = 3;
}

message GetAdvertisementStateRequest {
    // No parameters needed
}

message GetAdvertisementStateResponse {
    AdvertisementState state = 1;
}

message SetAdvertisementRequest {
    // True to enable advertisement, false to disable
    bool enabled = 1;
}

message SetAdvertisementResponse {
    // The resulting state after the operation
    // Note: enabled may be false even if requested true, if mDNS is unavailable
    AdvertisementState state = 1;
}

// === Pacing Stats RPC ===

message GetPacingStatsRequest {}

message WatchPacingStatsRequest {
    // Minimum interval between updates in milliseconds (default: 1000).
    uint32 interval_ms = 1;
}

message SetSpeedMultiplierRequest {
    // 0.0 = unlimited, 1.0 = real-time, 2.0 = double-speed.
    double speed_multiplier = 1;
}

message SetSpeedMultiplierResponse {
    // Echoed back resulting runtime speed multiplier.
    double speed_multiplier = 1;
}

// Pacing statistics snapshot.
// Available from both host and parasite SystemService instances.
message PacingStats {
    // Emulation timing
    uint64 ticks_executed = 1;         // Total ticks executed since start
    uint64 ticks_skipped = 2;          // Ticks skipped (falling behind)
    uint64 ticks_io_skipped = 3;       // Ticks where sleep was skipped for I/O

    // Adaptive sleep margin
    double avg_overshoot_us = 4;       // Average OS sleep overshoot (microseconds)
    double max_recent_overshoot_us = 5;// Recent maximum overshoot
    double safety_margin_us = 6;       // Current adaptive safety margin

    // PI controller state
    double controller_drift = 7;       // Current drift in cycles (+ = ahead)
    double controller_integral = 8;    // Accumulated drift (time debt)

    // Speed control and headroom, sampled over the pacing window (~5s).
    double speed_multiplier = 9;             // Configured multiplier (0.0 = unlimited)
    double achieved_speed_multiplier = 10;   // Actual emulated rate / base clock over the window
    double estimated_max_speed_multiplier = 11; // Estimated ceiling at current host load; 0.0 = no estimate yet (idle/paused or not yet sampled)
}
