syntax = "proto3";

package beebium;

// Transport-agnostic discovery service: tells clients which Econet
// transport extension is loaded on this server, and the instance id that
// addresses it. Lets a client decide whether to use AunService,
// PiconetService, or some future transport-specific service without having
// to probe via trial-and-error or read transport-specific fields off other
// RPCs.
//
// Modelled on PeripheralExtensionService.ListExtensions for
// peripheral extensions; this is the equivalent for econet
// transports.
service EconetTransportService {
    // List the econet transports loaded on this server, each with an
    // "active" flag. For BBC Micro / Master / Master Compact machines at
    // most one transport can be loaded (the server refuses more), and it is
    // always reported active; future multi-ADLC machine types (e.g. Acorn
    // Econet Bridge) may have several.
    rpc ListTransports(ListTransportsRequest) returns (ListTransportsResponse);

    // Convenience: return the single active transport, or an empty
    // response if no transport is configured. Equivalent to filtering
    // ListTransports for active=true and assuming at most one result.
    rpc GetActiveTransport(GetActiveTransportRequest)
        returns (GetActiveTransportResponse);
}

message EconetTransport {
    // Canonical extension name (e.g. "aun", "piconet"). Identifies
    // both the transport and the service the client should use for
    // transport-specific operations, invoked over ExtensionRpc with `id`
    // as the extension_id:
    //   "aun"     -> AunService (src/extensions/aun/aun.proto)
    //   "piconet" -> PiconetService (src/extensions/piconet/piconet_service.proto)
    string name = 1;

    // Human-readable description from the extension manifest.
    string description = 2;

    // True if this transport is the one the server uses for Econet. Every
    // loaded transport on a BBC machine is active, including before Econet
    // hardware is fitted or while its backend is down (port=none, no
    // Piconet device); use EconetService.GetEconetStatus for the link
    // state.
    bool active = 3;

    // Opaque, stable per-instance id assigned by the server. This is
    // the key clients pass to ExtensionUiService.SubscribeView /
    // Dispatch to drive the transport's control panel, and the
    // extension_id of ExtensionRpc.Invoke that routes the transport's own
    // service (AunService, PiconetService) -- the same role
    // PeripheralExtensionService.ExtensionInfo.id plays for peripherals.
    // Do not assume any relationship to `name`: it is typically a UUID,
    // and multi-instance transports each get a distinct id. Frontends
    // must discover it here rather than hardcoding extension names.
    string id = 4;

    // True if this transport implements an Extension UI (i.e. its
    // ExtensionUi is non-null), so a frontend can decide whether to
    // render an ExtensionUiService panel for it.
    bool has_ui = 5;
}

message ListTransportsRequest {
    // Empty.
}

message ListTransportsResponse {
    // The loaded transport extensions: one entry per transport given via
    // --aun / --piconet or a preset's econet.transport. Transports the
    // server knows about but was not asked to load are not listed.
    repeated EconetTransport transports = 1;
}

message GetActiveTransportRequest {
    // Empty.
}

message GetActiveTransportResponse {
    // Unset when no transport is loaded (no --aun / --piconet and no
    // preset transport), whether or not Econet hardware is fitted.
    EconetTransport active = 1;
}
