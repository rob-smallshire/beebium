syntax = "proto3";

package beebium;

// The one generic, core-hosted service through which clients drive
// extension-provided APIs. Extensions never host a gRPC service themselves;
// they register C++ dispatchers and the core tunnels opaque serialized
// request/response bytes to them. This keeps the single gRPC runtime in the
// core, so a plugin never links gRPC. The extension's own request/response
// messages are ordinary protobuf, but they travel as opaque `payload` bytes
// here -- only the extension and the client (de)serialize them.
//
// See docs/discussion/extension-rpc-channel.md.
service ExtensionRpc {
  // Unary: one request, one response.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);

  // Server-streaming: one request, a stream of responses (status feeds,
  // event subscriptions).
  rpc ServerStream(InvokeRequest) returns (stream InvokeResponse);

  // Instance ids come from the discovery services: PeripheralExtensionService
  // enumerates peripheral extension instances and EconetTransportService
  // enumerates Econet transport instances. Either kind of id is a valid
  // extension_id here. A dedicated discovery method that also reports each
  // instance's services is deferred.

  // Client-streaming and bidi are deferred until an extension needs them
  // (none do today); they would be added the same way, with the FIRST frame
  // carrying the route and subsequent frames carrying payload only.
}

message InvokeRequest {
  // Target instance id: a peripheral extension's id (from
  // PeripheralExtensionService) or an Econet transport's id (from
  // EconetTransportService). May be empty when exactly one loaded instance
  // offers `service`, in which case the core routes by service name; when
  // more than one does, an empty id is FAILED_PRECONDITION and the status
  // message lists the candidate ids.
  string extension_id = 1;

  // Logical service within the extension, e.g. "RpcSerial".
  string service = 2;

  // Method within the service, e.g. "Send".
  string method = 3;

  // Serialized request message, opaque to the core.
  bytes payload = 4;

  // Request headers (auth, trace ids, ...).
  map<string, string> metadata = 5;
}

message InvokeResponse {
  // Serialized response message, opaque to the core. On a non-OK call the
  // gRPC status (code + message) carries the error -- exactly as a native
  // gRPC method would -- and this payload is empty.
  bytes payload = 1;
}
