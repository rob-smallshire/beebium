syntax = "proto3";

package beebium;

// Econet/AUN networking management service.
//
// Provides hardware configuration (enable/disable Econet), network status
// queries (ADLC registers, handshake state), and AUN peer management.
service EconetService {
    // Query Econet hardware status (enabled, station ID, ADLC state, peers).
    rpc GetEconetStatus(GetEconetStatusRequest) returns (GetEconetStatusResponse);

    // Fit Econet hardware: set station ID, optionally bind AUN socket.
    rpc EnableEconet(EnableEconetRequest) returns (EnableEconetResponse);

    // Remove Econet hardware (disable station, close AUN socket).
    rpc DisableEconet(DisableEconetRequest) returns (DisableEconetResponse);

    // Set the station ID (takes effect on next machine reset).
    rpc SetStationId(SetStationIdRequest) returns (SetStationIdResponse);

    // Stream Econet events (frame activity, handshake changes, connection state).
    // Reserved for future implementation.
    rpc SubscribeEconetEvents(SubscribeEconetEventsRequest) returns (stream EconetEvent);

    // Server-pushed status stream. Writes an initial GetEconetStatusResponse
    // as soon as the stream is established, then a fresh snapshot whenever
    // status visible on EconetService changes (enable/disable, station ID
    // change, or transport backend connection toggle). The stream stays open
    // until the client cancels; use this instead of polling GetEconetStatus.
    rpc WatchEconetStatus(WatchEconetStatusRequest) returns (stream GetEconetStatusResponse);
}

// Note: The four AUN-specific RPCs (SetConnected, AddPeer, RemovePeer,
// ListPeers) and their messages (SetConnectedRequest/Response,
// AddPeerRequest/Response, RemovePeerRequest/Response,
// ListPeersRequest/Response, EconetPeer) used to live here. They moved
// to AunService in src/extensions/aun/aun.proto so EconetService can
// stay transport-agnostic. AUN status fields (aun_port, peer_count) on
// GetEconetStatusResponse below are likewise gone -- consult
// AunService.GetStatus for them.

// --- Status ---

message GetEconetStatusRequest {
    // Empty - returns full status.
}

message GetEconetStatusResponse {
    // True if this machine variant has an Econet socket (compile-time).
    bool has_econet_socket = 1;

    // True if Econet hardware is currently fitted (runtime).
    bool enabled = 2;

    // Station number (1-254, 0 if disabled).
    uint32 station_id = 3;

    // True if AUN mode is active (FourWayHandshake present).
    bool aun_mode = 4;

    // True if network link is active (e.g. UDP socket bound + cable
    // not "unplugged" via AunService.SetConnected for AUN, or USB
    // device responsive for Piconet). Set from the backend's generic
    // is_connected().
    bool connected = 5;

    // Field 6 (aun_port) and field 7 (peer_count) were removed; AUN
    // status now lives on AunService.GetStatus.
    reserved 6, 7;
    reserved "aun_port", "peer_count";

    // MC6854 ADLC register state (populated when enabled).
    AdlcStatus adlc = 10;

    // Four-way handshake state (populated when AUN mode active).
    HandshakeStatus handshake = 11;

    // Diagnostic: total tick_rising() calls since boot.
    uint64 tick_count = 12;

    // Diagnostic: count of CR1=&82 writes (nmi_tx_complete indicator).
    uint32 cr1_0x82_write_count = 13;

    // Diagnostic: count of frames received by ADLC from backend.
    uint32 rx_frames_received_count = 14;

    // Diagnostic: count of rx_process_byte calls blocked by RX_RESET.
    uint32 rx_blocked_by_reset_count = 15;

    // Diagnostic: FourWayHandshake counters
    uint32 scout_ack_generated_count = 16;
    uint32 tx_frames_from_beeb_count = 17;
    uint32 unexpected_tx_reset_count = 18;
    uint32 tx_from_idle_count = 19;
    int32 max_handshake_timer_seen = 20;
    uint32 watchdog_timeout_count = 21;
    string send_stage_log = 22;
    uint64 ticks_with_timer_active = 23;
    uint64 read_stretch_parasite_ticks = 24;

    // Emulation-speed gating. requires_real_time is true when the active
    // transport must run at real time (1x) -- it bridges to a real Econet line
    // (Piconet). gated_by_speed is true when that transport is currently severed
    // because the emulation speed is not 1x; the guest sees a dead carrier until
    // the speed returns to 1x. See docs/networking.md ("Emulation speed and
    // real-time peers").
    bool requires_real_time = 26;
    bool gated_by_speed = 27;

    // Field 25 (piconet) was removed; Piconet status now lives on
    // PiconetService.GetStatus (in src/extensions/piconet/piconet_service.proto).
    reserved 25;
    reserved "piconet";
}

message AdlcStatus {
    uint32 cr1 = 1;
    uint32 cr2 = 2;
    uint32 cr3 = 3;
    uint32 cr4 = 4;
    uint32 sr1 = 5;
    uint32 sr2 = 6;
    bool irq_output = 7;
    bool tx_fifo_empty = 8;
    bool tx_fifo_full = 9;
    bool rx_fifo_empty = 10;
    bool rx_fifo_full = 11;
    string tx_frame_field = 12;
    string rx_frame_field = 13;
    int32 pse_level = 14;
    bool cts_input = 15;
}

message HandshakeStatus {
    string stage = 1;
    bool flag_fill_active = 2;

    // Inbound holding queue. Packets that arrive while the handshake is in a
    // stage that cannot use them are held and re-offered rather than dropped;
    // these counters make that visible, so a test or a diagnostic can assert
    // on the mechanism rather than only on the outcome.
    //
    // frames_held      -- currently waiting for a stage that can accept them
    // frames_redelivered -- held and later successfully delivered
    // frames_expired   -- discarded after waiting too long
    // frames_dropped   -- discarded because the queue was full; non-zero
    //                     means a peer is offering traffic faster than the
    //                     handshake can consume it
    uint32 frames_held = 3;
    uint64 frames_redelivered = 4;
    uint64 frames_expired = 5;
    uint64 frames_dropped = 6;
}

// --- Enable/Disable ---

message EnableEconetRequest {
    // Station number (1-254).
    uint32 station_id = 1;

    // UDP port to bind for AUN networking.
    // 0 = use default (32768).
    // Ignored when no_network is true.
    uint32 aun_port = 2;

    // If true, fit hardware with no network connection.
    // Station ID is readable and ADLC is present, but DCD is high (no carrier).
    bool no_network = 3;
}

message EnableEconetResponse {
    bool success = 1;
    string error = 2;

    // Actual port bound (useful when 0/default was requested).
    uint32 actual_aun_port = 3;
}

message DisableEconetRequest {
    // Empty.
}

message DisableEconetResponse {
    bool success = 1;
    string error = 2;
}

// --- Station ID ---

message SetStationIdRequest {
    // Station number (1-254).
    uint32 station_id = 1;
}

message SetStationIdResponse {
    bool success = 1;
    string error = 2;
}

// --- Network Cable + Peer Management ---
//
// The SetConnected/AddPeer/RemovePeer/ListPeers RPCs and their
// messages (SetConnectedRequest/Response, AddPeerRequest/Response,
// RemovePeerRequest/Response, ListPeersRequest/Response, EconetPeer)
// moved to AunService in src/extensions/aun/aun.proto. They were
// always AUN-specific; their new home is the AUN extension's service.

// --- Status Streaming ---

message WatchEconetStatusRequest {
    // Minimum interval between status pushes in milliseconds (optional).
    // Defaults to 50ms server-side. The server only pushes when status
    // actually changes, so this caps the update rate rather than forcing
    // periodic traffic.
    uint32 min_interval_ms = 1;
}

// --- Event Streaming ---
//
// Frames as they cross the transport, which is the view the guest's screen
// cannot give: what actually went out and what actually came back. Recorded
// just above the wire, so these are typed frames after the four-way handshake
// has done its translation.

message SubscribeEconetEventsRequest {
    // Maximum events per message. Defaults to 64 server-side.
    uint32 max_batch = 1;

    // Minimum interval between pushes in milliseconds. Defaults to 20ms.
    // Caps the rate rather than forcing periodic traffic: a quiet network
    // produces nothing.
    uint32 min_interval_ms = 2;
}

enum EconetEventType {
    ECONET_EVENT_UNKNOWN = 0;
    ECONET_EVENT_FRAME_SENT = 1;
    ECONET_EVENT_FRAME_RECEIVED = 2;
    ECONET_EVENT_HANDSHAKE_CHANGE = 3;
    ECONET_EVENT_CONNECTION_CHANGE = 4;
}

message EconetFrameInfo {
    // "raw", "broadcast", "unicast", "ack", "nack", "immediate", "imm_reply".
    string frame_type = 1;
    uint32 dest_net = 2;
    uint32 dest_stn = 3;
    uint32 src_net = 4;
    uint32 src_stn = 5;
    uint32 port = 6;
    uint32 control_byte = 7;

    // The payload's true size, which may exceed what `data` carries.
    uint32 data_length = 8;

    // The leading bytes of the payload, truncated to keep the event stream
    // from becoming a packet capture. Compare with data_length to tell
    // whether anything was dropped.
    bytes data = 9;
}

message EconetEvent {
    EconetEventType type = 1;

    // Monotonic, assigned when the event was recorded. Gaps mean a subscriber
    // fell further behind than the server's ring buffer reaches, and events
    // were lost -- reported rather than hidden, so a diagnosis is never built
    // on a stream with silent holes in it.
    uint64 sequence = 2;

    // Set for FRAME_SENT and FRAME_RECEIVED.
    EconetFrameInfo frame = 3;

    // Set for CONNECTION_CHANGE.
    bool connected = 4;
}
