[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beebium-games-soak"
version = "0.1.0"
description = "Standalone soak / freeze-reproduction harness that cycles through games with a real frontend attached"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
dependencies = [
    "beebium",
]

[project.scripts]
games-soak = "games_soak.driver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/games_soak"]

[tool.uv.sources]
beebium = { path = "../../clients/beebium-python-client", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
