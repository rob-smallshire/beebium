		5CBEE93D93C220A328A4D2D0 /* Embed Server Executables, Presets, and ROMs */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Embed Server Executables, Presets, and ROMs";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Embed the headless server executables, their plugin tree, and\n# their native dependencies under Contents/Resources/servers/ (if\n# BEEBIUM_SERVERS_BUILD_DIR is set). They live in Resources rather\n# than Frameworks because the plugin tree carries non-code files\n# (manifest.json) that codesign rejects in Frameworks, which it\n# validates as code-only. The Swift side resolves this directory\n# via Bundle.main.resourcePath (PresetManager.serversDirpath).\n# Default to the repo's CMake build tree so a plain build (from Xcode\n# or `xcodebuild` without the variable exported) still embeds a freshly\n# built server instead of silently keeping a stale one. Override\n# BEEBIUM_SERVERS_BUILD_DIR to bundle a release/static build.\nSERVERS_DIR=\"${BEEBIUM_SERVERS_BUILD_DIR:-${SRCROOT}/../../../build/src/server}\"\nif [ -d \"$SERVERS_DIR\" ] && [ -f \"$SERVERS_DIR/beebium-model-b\" ]; then\n  echo \"Embedding servers from: $SERVERS_DIR\"\n  SERVERS_DEST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/servers\"\n  # Rebuild from scratch each time so stale bundled dylibs from a\n  # previous build don't accumulate.\n  rm -rf \"$SERVERS_DEST\"\n  mkdir -p \"$SERVERS_DEST\"\n  for server in beebium-model-b beebium-model-b-plus beebium-model-b-plus-128k beebium-model-b-romram; do\n    if [ -f \"$SERVERS_DIR/$server\" ]; then\n      cp \"$SERVERS_DIR/$server\" \"$SERVERS_DEST/\"\n      echo \"  Copied $server\"\n    fi\n  done\n\n  # Copy presets and thumbnails alongside the embedded servers\n  # (Resources/servers/presets/), matching what the server\n  # binary expects: PresetPaths::get_system_presets_dirpath()\n  # looks for a sibling 'presets/' directory next to the\n  # executable. Placing them in Resources/presets/ instead -\n  # which we did before - made create-preset's --from fail to\n  # resolve any system preset by ID.\n  if [ -d \"$SERVERS_DIR/presets\" ]; then\n    mkdir -p \"${SERVERS_DEST}/presets\"\n    cp \"$SERVERS_DIR/presets/\"*.preset.beebium \"${SERVERS_DEST}/presets/\" 2>/dev/null || true\n    cp \"$SERVERS_DIR/presets/\"*.thumbnail.png \"${SERVERS_DEST}/presets/\" 2>/dev/null || true\n    echo \"  Copied presets and thumbnails to ${SERVERS_DEST}/presets\"\n  fi\n\n  # Copy the extension plugin tree next to the embedded servers.\n  # The server resolves plugins from <exe-dir>/extensions/. Without\n  # this, only built-in transports (AUN) load from the packaged\n  # app; plugin transports like Piconet would be silently absent.\n  if [ -d \"$SERVERS_DIR/extensions\" ]; then\n    cp -R \"$SERVERS_DIR/extensions\" \"$SERVERS_DEST/extensions\"\n    echo \"  Copied extension plugin tree\"\n  fi\n\n  # Make the embedded servers and plugins self-contained: bundle\n  # their internal shared libraries and Homebrew dependencies\n  # (gRPC/protobuf/abseil) alongside them, rewrite install names to\n  # @rpath, and re-sign. Without this the app only runs on the\n  # build machine (deps reference the dev tree + /opt/homebrew).\n  # See docs/macos-app-packaging.md.\n  echo \"  Bundling native dependencies into the app...\"\n  /usr/bin/env python3 \"${SRCROOT}/scripts/bundle_dependencies.py\" \\\n    \"$SERVERS_DEST\"\nelse\n  echo \"warning: no server executables found at $SERVERS_DIR\" >&2\n  echo \"warning: the app bundle will keep whatever server it already has (possibly stale, or none).\" >&2\n  echo \"warning: build the servers first --\" >&2\n  echo \"warning:   cmake --build build --target beebium-servers\" >&2\n  echo \"warning: or run scripts/build-macos-app.sh, or set BEEBIUM_SERVERS_BUILD_DIR.\" >&2\nfi\n\n# Copy ROMs (if BEEBIUM_ROMS_DIR is set, otherwise try repo default relative to SRCROOT)\nROMS_DIR=\"${BEEBIUM_ROMS_DIR:-${SRCROOT}/../../../roms}\"\nif [ -d \"$ROMS_DIR\" ]; then\n  echo \"Embedding ROMs from: $ROMS_DIR\"\n  mkdir -p \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms\"\n  cp \"$ROMS_DIR/\"*.rom \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms/\" 2>/dev/null || true\n  echo \"  Copied ROMs\"\nelse\n  echo \"ROMs directory not found at $ROMS_DIR, skipping ROM embedding\"\nfi\n";
		};
