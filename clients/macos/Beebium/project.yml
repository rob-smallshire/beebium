name: Beebium
options:
  bundleIdPrefix: com.beebium
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  grpc-swift:
    url: https://github.com/grpc/grpc-swift
    from: "1.23.0"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
  swift-atomics:
    url: https://github.com/apple/swift-atomics
    from: "1.2.0"

targets:
  Beebium:
    type: application
    platform: macOS
    sources:
      - path: Beebium
        excludes:
          - "**/*.xcassets"
          - Resources/KeyboardMappings
      - path: Beebium/Assets.xcassets
      - path: Beebium/Resources/KeyboardMappings
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.Beebium
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        # Concurrency checking one notch above the default "minimal", so an
        # isolation mistake in code that already touches Sendable types is a
        # warning now rather than a build failure at the next toolchain bump.
        # "complete" is the destination but not yet reachable: it reports ~45
        # further diagnostics, mostly AppKit views that predate the main-actor
        # annotations (TouchBar, EditableChoiceField, ConnectDialog). That is
        # its own piece of work.
        SWIFT_STRICT_CONCURRENCY: targeted
    # Explicit Info.plist (rather than GENERATE_INFOPLIST_FILE) because the
    # beebium:// URL scheme needs CFBundleURLTypes, an array-of-dictionaries
    # that cannot be expressed through INFOPLIST_KEY_* build settings. XcodeGen
    # fills the standard bundle keys; only the non-default ones are listed here.
    info:
      path: Beebium/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.beebium.Beebium.connect
            CFBundleURLSchemes: [beebium]
    dependencies:
      - package: grpc-swift
        product: GRPC
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: swift-atomics
        product: Atomics
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFAudio.framework
    postBuildScripts:
      - name: "Embed Static Server Bundle"
        basedOnDependencyAnalysis: false
        script: |
          # Embed the static server bundle -- the same relocatable tree shipped
          # in the release tarball (bin/ lib/ share/beebium/) -- verbatim under
          # Contents/Resources/servers/, when BEEBIUM_SERVERS_BUILD_DIR points at
          # an installed static tree (the directory containing bin/beebium-model-b).
          # Locally that tree comes from `cmake --install` of a vcpkg-static build,
          # or from the bundle-macos-<arch> release tarball; in CI it is the
          # bundle-macos-<arch> artifact.
          #
          # The payload lives under Resources rather than Frameworks because it
          # carries non-code files (manifest.json, ROMs, presets) that codesign
          # rejects in Frameworks, which it validates as code-only. The Swift side
          # resolves the executables via Bundle.main.resourcePath + servers/bin
          # (PresetManager.serversDirpath); the server finds its own plugins at
          # <exe-dir>/extensions, its ABI dylibs via RPATH into ../lib, and its
          # ROMs/presets under ../share/beebium.
          #
          # The static binaries are already self-contained (no /opt/homebrew, no
          # build-tree paths; @loader_path-relative internal libs; ad-hoc signed
          # at bundle time), so there is no dependency-graph rewriting to do -- the
          # step is a verbatim copy plus verification. Without BEEBIUM_SERVERS_BUILD_DIR
          # the embed is skipped and the app launches servers from the runtime dev
          # fallback (BEEBIUM_SERVERS_DIRPATH, else the CMake build tree) -- see
          # PresetManager.serversDirpath and docs/macos-app-packaging.md.
          SERVERS_DIR="${BEEBIUM_SERVERS_BUILD_DIR:-}"
          if [ -z "$SERVERS_DIR" ] || [ ! -f "$SERVERS_DIR/bin/beebium-model-b" ]; then
            echo "note: BEEBIUM_SERVERS_BUILD_DIR is unset or does not point at an installed static tree (no bin/beebium-model-b)."
            echo "note: skipping server embedding; the app will launch servers from the runtime dev fallback."
            echo "note: to embed a distributable payload, install a vcpkg-static build to a staging prefix and set BEEBIUM_SERVERS_BUILD_DIR to it (see docs/macos-app-packaging.md)."
            exit 0
          fi

          echo "Embedding static server bundle from: $SERVERS_DIR"
          SERVERS_DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/servers"
          # Rebuild from scratch each time so a previous build's payload does not
          # accumulate stale files.
          rm -rf "$SERVERS_DEST"
          mkdir -p "$SERVERS_DEST"
          # Copy the tree verbatim: executables + plugin tree (bin/, bin/extensions/),
          # ABI dylibs (lib/), ROMs and presets (share/beebium/).
          cp -R "$SERVERS_DIR/bin" "$SERVERS_DEST/bin"
          cp -R "$SERVERS_DIR/lib" "$SERVERS_DEST/lib"
          cp -R "$SERVERS_DIR/share" "$SERVERS_DEST/share"
          echo "  Copied bin/ lib/ share/"

          # Verify the copied payload: no absolute-path leaks (only /usr/lib and
          # /System are allowed), and every Mach-O carries a valid signature. A
          # leak or a broken signature here would ship a bundle that only runs on
          # the build machine, or that dyld/Gatekeeper rejects. Xcode runs this
          # phase under /bin/sh, so record failures via a marker file rather than
          # a variable set inside a pipeline subshell (POSIX sh, no bashisms).
          fail_marker="$(mktemp)"
          find "$SERVERS_DEST/bin" "$SERVERS_DEST/lib" -type f | while IFS= read -r f; do
            file "$f" | grep -q "Mach-O" || continue
            if otool -L "$f" | tail -n +2 | grep -qE '/opt/homebrew|/Users/|/usr/local'; then
              echo "error: absolute-path leak in embedded payload: $f" >&2
              otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/Users/|/usr/local' >&2
              echo x >> "$fail_marker"
            fi
            codesign -v "$f" 2>/dev/null || { echo "error: invalid signature in embedded payload: $f" >&2; echo x >> "$fail_marker"; }
          done
          if [ -s "$fail_marker" ]; then
            rm -f "$fail_marker"
            echo "error: embedded server payload failed verification" >&2
            exit 1
          fi
          rm -f "$fail_marker"
          echo "  Verified: no absolute-path leaks, all Mach-Os signed"

  BeebiumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeebiumTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.BeebiumTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - target: Beebium
