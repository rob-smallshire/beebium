[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beebium"
dynamic = ["version"]
description = "Python client for the Beebium BBC Micro emulator"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING.txt"]
requires-python = ">=3.12"
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Emulators",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "stevedore>=5.0.0",
]

# Runtime-optional features are published extras (installable by end users).
# Development tooling lives in dependency-groups (below), NOT in extras, so it
# is never published in the wheel's metadata -- `pip install beebium[...]` only
# ever pulls real runtime features.
[project.optional-dependencies]
imaging = [
    "Pillow>=10.0.0",
]
discovery = [
    "zeroconf>=0.131.0",
]

# PEP 735 dependency-groups: local development tooling, kept out of published
# metadata. `uv run`/`uv sync` install the `dev` group by default. The `test`
# group is split out so the wheel-packaging harness (scripts/test-wheel.sh) can
# `uv export --only-group test` to install just the test runner into the fresh
# venv alongside the built wheel -- no codegen tooling needed there.
[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]
dev = [
    { include-group = "test" },
    "grpcio-tools>=1.60.0",
    "mypy-protobuf>=3.6.0",
    "ruff>=0.6.0",
    # README generation (scripts/generate_readme.py). Kept out of published
    # metadata: end users install the generated README, never regenerate it.
    "jinja2>=3.1.0",
    # The optional-feature dependencies, so the dev environment type-checks the
    # code that uses them (video PIL export, zeroconf discovery).
    "Pillow>=10.0.0",
    "zeroconf>=0.131.0",
]

[project.entry-points.pytest11]
beebium = "beebium.client.pytest_plugin"

# First-party extension client adapters, grouped by the server service that
# discovers them. The key is the server manifest name (kebab-case); the value
# points at the concrete adapter class in its beebium.ext.<category>.<name>
# package. Third-party distributions register into the matching group (and
# contribute to the beebium.ext.<category> namespace) with no change to core.

# Peripheral extensions (attach to an attachment point; PeripheralExtensionService).
[project.entry-points."beebium.ext.peripheral"]
rpc-serial = "beebium.ext.peripheral.rpc_serial:RpcSerial"
host-serial = "beebium.ext.peripheral.host_serial:HostSerial"
acorn-rtc = "beebium.ext.peripheral.acorn_rtc:AcornRtc"
acorn-scsi = "beebium.ext.peripheral.acorn_scsi:AcornScsi"

# Econet transports (provide the Econet wire; EconetTransportService).
[project.entry-points."beebium.ext.econet"]
aun = "beebium.ext.econet.aun:Aun"
piconet = "beebium.ext.econet.piconet:Piconet"

[project.urls]
Homepage = "https://github.com/rob-smallshire/beebium"
Repository = "https://github.com/rob-smallshire/beebium"

[tool.hatch.version]
path = "src/beebium/client/_version.py"

# beebium is a PEP 420 namespace (no src/beebium/__init__.py); beebium.client is
# a regular package and beebium.ext is a namespace under which adapter packages
# live. include the whole tree and let hatch handle the namespace.
[tool.hatch.build.targets.wheel]
packages = ["src/beebium"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 120
# The _proto tree is generated (grpc.experimental, dynamic attrs); don't lint it.
extend-exclude = ["**/_proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Keep classic typing.TypeVar rather than PEP 695 type parameters for now; a
# migration to `def f[T]()` syntax is a deliberate, separate choice.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export their public API.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# Test-support modules imported bare (not under the beebium package) sit
# beside the tests. Classify them as local so they sort into their own group
# after first-party beebium imports, rather than being mistaken for
# third-party packages, which leaves the import order stable.
known-local-folder = ["conftest", "firetrack", "tube_test_helpers", "_snippet_guard"]

[tool.pyright]
include = ["src", "examples"]
# The generated protobuf stubs are exercised via their .pyi type stubs but are
# not themselves hand-written, so don't type-check the generated bodies (they
# use grpc.experimental, dynamic attributes, etc.).
exclude = ["**/_proto"]
typeCheckingMode = "basic"
