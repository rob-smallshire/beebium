[project]
name = "beebium-icon"
version = "0.1.0"
description = "Generator for the Beebium application icon: a periodic-table tile for the element Beebium"
requires-python = ">=3.11"
dependencies = [
    "uharfbuzz>=0.39",
    "resvg-py>=0.1.5",
    "pillow>=10.0",
]

[project.scripts]
beebium-icon = "beebium_icon.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beebium_icon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
