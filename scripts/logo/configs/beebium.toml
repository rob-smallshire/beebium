# The Beebium application icon.
#
# The artwork is "The Shape of Beebium", a pastiche of Acorn's 1981 marketing
# image "The Shape of Things to Come": the same sunset over a mirrored floor
# with a cylinder, a cuboid and a pyramid, but without the computer.  It needs
# no border and no lettering, and its palette - orange sky, white sun, blue
# floor - is what makes it legible at 16px, where none of the solids are.
#
# Paths are relative to this file.  Every value has a default in
# src/beebium_icon/config.py; only the interesting ones are spelled out here.

name = "beebium"

[artwork]
filepath = "../the-shape-of-beebium.png"
# Lanczos softens the horizon and the cylinder's edge as it shrinks them.
# Below half size that loss is worth correcting; above it, sharpening only
# roughens the clouds.
sharpen_below_scale = 0.5
sharpen_percent = 90

# macOS. Apple's icon grid: the body is inset to leave room for the shadow,
# and the corner is a superellipse rather than an arc.
[squircle]
body_ratio = 0.805
unshadowed_body_ratio = 0.94
corner_ratio = 0.225
exponent = 5.0

# Windows, Linux and the web: a conventional rounded square filling the
# canvas. A corner_ratio of 0 would make it a plain square.
[rounded]
body_ratio = 1.0
corner_ratio = 0.18

[shadow]
colour = "#241A06"
opacity = 0.30
dy = 0.020
blur = 0.018
# Below this size the shadow costs more pixels of artwork than it earns.
min_size = 64
