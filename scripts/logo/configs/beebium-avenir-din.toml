# The Beebium icon set in the typefaces the design was drawn for: Avenir Next
# for the element, DIN for the specifications.
#
# Both live in /System/Library/Fonts on macOS and neither may be redistributed,
# so this configuration renders only on a Mac and its output must not be
# checked in as the shipped icon.  configs/beebium.toml is the reproducible
# one.  Note that macOS ships DIN Alternate in Bold only - there is no DIN
# Medium to point at - so the technical face is heavier here than the design
# calls for.

name = "beebium"

[palette]
face_top = "#F6ECD2"
face_bottom = "#E7D8B2"
frame = "#FBF4E1"
ink = "#2E6B35"
shadow = "#4A3B14"

[geometry]
style = "squircle"

[content]
symbol = "Bb"
name = "Beebium"
atomic_number = "6502"
ground_state = "8-bit"
isotopes = ["16", "32", "64", "128"]
isotope_style = "nuclide"
energies = ["2", "3", "4"]
isotope_suffix = "K"
energy_suffix = "MHz"
constituents = ["6502", "6522", "6845", "6850", "6854"]
# DIN Alternate has no middle dot; the bullet operator stands in for it.
separator = " ∙ "

[lod]
small_size = 24
symbol = 0
keyline = 48
atomic_number = 128
name = 128
isotopes = 256
ground_state = 512
energies = 512
constituents = 1024

[fonts.symbol]
filepath = "/System/Library/Fonts/Avenir Next.ttc"
face_index = 2  # Avenir Next Demi Bold
fit = "ink"

[fonts.name]
filepath = "/System/Library/Fonts/Avenir Next.ttc"
face_index = 5  # Avenir Next Medium
fit = "ink"

[fonts.technical]
filepath = "/System/Library/Fonts/Supplemental/DIN Alternate Bold.ttf"
tracking = 0.02
fit = "cap"
